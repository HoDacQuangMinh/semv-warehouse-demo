      <div class="pains">

          <p class="pain__source" data-i18n="problem.source.todo"></p>

        <article class="pain">
          <span class="pain__stat" data-i18n="problem.stat.todo"></span>
          <h3 data-i18n="problem.2.title"></h3>

  <!-- ============ MANUAL CHALLENGE ============ -->

    <div class="wrap">
      <h2 data-i18n="flow.title"></h2>
      <p class="section-lede" data-i18n="flow.lede"></p>

      <ol class="flow__steps">
        <li class="flow__step" data-flow="gr">
          <span class="flow__step-num" aria-hidden="true">1</span>
          <h3 data-i18n="flow.1.title"></h3>
          <p data-i18n="flow.1.body"></p>
          <span class="flow__state" data-flow-state data-i18n="flow.state.waiting"></span>
        </li>
        <li class="flow__step" data-flow="putaway">

          <h3 data-i18n="flow.2.title"></h3>
          <p data-i18n="flow.2.body"></p>
          <span class="flow__state" data-flow-state data-i18n="flow.state.waiting"></span>
        </li>
        <li class="flow__step" data-flow="interlock">
          <span class="flow__step-num" aria-hidden="true">3</span>
          <h3 data-i18n="flow.3.title"></h3>
          <p data-i18n="flow.3.body"></p>
          <span class="flow__state" data-flow-state data-i18n="flow.state.waiting"></span>
        </li>
      </ol>

      <div class="flow__reset">
        <button class="btn btn-ghost" type="button" id="reset-all" data-i18n="flow.reset"></button>
      </div>
    </div>
  </section>

          <span class="ba__todo" data-i18n="problem.stat.todo"></span>
        </div>
        <div class="ba__cell">
          <span class="ba__key" data-i18n="results.after"></span>
          <span class="ba__todo" data-i18n="problem.stat.todo"></span>
        </div>
        <div class="ba__cell">
          <span class="ba__key" data-i18n="results.saved"></span>
          <span class="ba__todo" data-i18n="problem.stat.todo"></span>
        </div>
      </div>
      <p class="pain__source" data-i18n="problem.source.todo"></p>
    </div>
  </section>

  <section id="tech" class="band band--alt">
    <div class="wrap">
      <h2 data-i18n="tech.title"></h2>

  <!-- ============ TEAM ============ -->
  <section id="team" class="band band--alt">
    <div class="wrap">
      <h2 data-i18n="team.title"></h2>
