/* css/tokens.css */
/* Design tokens.
   Colour keeps the Schneider anchor and the spec's semantic rules. Type,
   spacing, radius, materials and motion follow Apple's Human Interface
   Guidelines: a real type scale, an 8pt grid, translucent materials for
   layering, and 44px minimum hit targets.

   One deliberate departure: HIG uses capsule buttons. Ours stay rectangular
   with a soft radius, because pill buttons are banned in this project. */

:root {
  /* Brand */
  --se-green:      #3DCD58;
  --se-green-mid:  #2FA847;
  --se-green-deep: #1F6F4A;
  --se-green-wash: #E3F5E8;

  /* Materials, taken from the warehouse itself */
  --carton:      #C8A57B;
  --carton-deep: #8A6A42;
  --floor:       #EFEAE0;   /* kraft paper */
  --panel:       #E3DCCB;   /* concrete */
  --panel-2:     #FBF8F1;   /* elevated surface, still warm */
  --ink:         #17150F;   /* label */
  --ink-2:       #5C574F;   /* secondary label */
  --ink-3:       #8E8880;   /* tertiary label */
  --line:        #D4CFC6;   /* separator */
  --line-soft:   #E4E0D8;   /* opaque separator */
  --steel:       #33383B;

  /* Semantic, information only */
  --hazard:        #F2B705;
  --hazard-deep:   #8A6800;
  --hazard-wash:   #FDF3D6;
  --verified:      var(--se-green);
  --verified-deep: var(--se-green-deep);
  --verified-wash: var(--se-green-wash);
  --scan:          #0B5FFF;
  --scan-wash:     #E4EDFF;
  --machine:       #E9A93C;
  --machine-deep:  #7A5410;

  /* Station identity. Deliberately OUTSIDE the semantic trio: green, hazard
     yellow and scan blue keep their meanings, so identity has to come from
     somewhere else. These three are earthy and industrial and cannot be
     mistaken for a status. */
  --petrol:      #0E4B4F;   /* the dock */
  --petrol-soft: #D3E2E1;
  --oxide:       #A8451F;   /* the build area */
  --oxide-soft:  #F3DFD6;
  --moss:        #4A5A2B;   /* the racks */
  --moss-soft:   #E2E6D2;

  /* Vehicles. Silver cab, weathered steel container, dark glass and rubber. */
  --truck-cab:   #D8D3C7;
  --truck-glass: #6F8E99;
  --cont-body:   #3E5F6B;
  --tyre:        #1B1E20;
  --op-trouser:  #2A3138;
  --op-skin:     #C89A73;
  --op-helmet:   #F4F1E8;
  --hair:        #241C15;
  --crew-a:      #2A3138;
  --crew-b:      #4A3A52;
  --crew-c:      #23404A;
  --crew-d:      #4A3226;
  --crew-e:      #2E3A2C;

  /* The hall itself. Daylight concrete, not a black void. */
  --hall-bg:     #E3E9EC;
  --hall-top:    #CAD2D3;
  --hall-left:   #7F9198;
  --hall-right:  #9DADB2;
  --hall-grid:   #ADBCC1;
  --hall-steel:  #4A5558;
  --hall-steel-2:#333C3F;
  --hall-steel-3:#3F4A4D;
  --hall-lamp:   #F6F2E6;
  --hall-haze:   rgba(248, 253, 255, .9);
  --wall:        #B4C4CB;
  --wall-rib:    #8CA1AD;
  --column:      #647C88;
  --paint-lane:  #D9A812;
  --paint-walk:  #ADC7BE;
  --pool:        rgba(247, 253, 255, .36);

  /* Surface texture, built from gradients so nothing has to be downloaded. */
  --grain: repeating-linear-gradient(
             45deg,
             rgba(28, 26, 23, .018) 0 2px,
             transparent 2px 4px);
  --tape: repeating-linear-gradient(
            -45deg,
            var(--machine) 0 8px,
            var(--ink) 8px 16px);

  /* Terminal screens */
  --screen-bg:   #1A1E20;
  --screen-ink:  #F2F0EC;
  --screen-dim:  #948E86;
  --screen-line: #33393C;

  /* Radius. Soft, never a capsule. */
  --radius:     8px;   /* controls */
  --radius-lg:  14px;  /* cards and sheets */
  --radius-sm:  6px;

  /* Materials. Layering by translucency rather than heavy borders. */

  --shadow-lift: 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent),

  /* Type. The HIG scale, in rem. */

  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;

  --fs-hero: clamp(2.125rem, 1.3rem + 3.4vw, 3rem);   /* large title */
  --fs-h2:   clamp(1.375rem, 1.2rem + .7vw, 1.75rem); /* title 2 */
  --fs-h3:   1.25rem;                                  /* title 3 */
  --fs-body: 1.0625rem;                                /* body, 17px */
  --fs-sm:   .9375rem;                                 /* subhead, 15px */
  --fs-xs:   .8125rem;                                 /* footnote, 13px */

  --lh-body: 1.47;
  --lh-tight: 1.12;
  --tracking-tight: -.022em;   /* HIG tightens as size grows */
  --weight-emphasis: 590;

  /* 8pt grid */
  --sp-1: .25rem;   /*  4 */
  --sp-2: .5rem;    /*  8 */
  --sp-3: .75rem;   /* 12 */
  --sp-4: 1rem;     /* 16 */
  --sp-5: 1.5rem;   /* 24 */
  --sp-6: 2rem;     /* 32 */
  --sp-7: 3rem;     /* 48 */
  --sp-8: 4rem;     /* 64 */

  --hit: 44px;      /* minimum touch target */
  --wrap: 1120px;

  /* Layout constants shared between the header and the full screen views.
     --topbar-base is the height the header reserves; --topbar-h is what the
     views offset by, and main.js overwrites it with the height the header
     actually rendered. They are deliberately two tokens rather than one: the
     header must not size itself from a value it also feeds, or measuring adds
     the border back each pass and the bar grows without end. --hall-ar keeps
     the warehouse drawing at its SVG viewBox aspect ratio, 988/662, as its

  --topbar-h:    62px;   /* what the views offset by; main.js measures it */

  --ease: cubic-bezier(.32, .72, 0, 1);
  --ease-out: cubic-bezier(.25, .1, .25, 1);

  --dur: 300ms;
  --dur-slow: 520ms;
  --dur-forklift: 2900ms;

/* css/base.css */
/* Reset and base typography. */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--floor);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;

}

h1, h2, h3 {
  margin: 0;

  letter-spacing: var(--tracking-tight);
  font-family: var(--font-display);
  font-weight: 700;
  text-wrap: balance;

h1 { font-size: var(--fs-hero); letter-spacing: -.032em; max-width: 15ch; }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); letter-spacing: -.018em; font-weight: var(--weight-emphasis); }

p { margin: 0 0 var(--sp-4); max-width: 66ch; }
p:last-child { margin-bottom: 0; }

ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }

svg { display: block; }

button { font: inherit; color: inherit; }

.mono {
  font-family: var(--font-mono);
  font-size: .93em;
  letter-spacing: .01em;
}

.wrap {
  width: min(100% - 2.5rem, var(--wrap));
  margin-inline: auto;
}

.lede {
  font-size: clamp(1rem, .95rem + .25vw, 1.125rem);
  color: var(--ink-2);
  max-width: 54ch;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: var(--panel-2);
  padding: var(--sp-3) var(--sp-4);
  z-index: 100;
}
.skip-link:focus { left: var(--sp-4); top: var(--sp-4); }

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--se-green) 55%, transparent);
  outline-offset: 3px;
  border-radius: var(--radius-sm);

button, a.btn, .bin, .slot, .ch-box, .ch-line, .icon-btn {

.bin { min-height: 0; }

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;

<style>
/* css/layout.css */
/* Page level layout. */

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--material-thick);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line);
}

.topbar__inner {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  min-height: var(--topbar-base);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  text-decoration: none;
  margin-right: auto;
  min-width: 0;
}
.brand__mark { width: 26px; height: 26px; flex: none; color: var(--se-green-deep); }
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__name { font-weight: 600; letter-spacing: -.01em; }
.brand__sub { font-size: var(--fs-xs); color: var(--ink-3); }

.topbar__nav { display: flex; gap: var(--sp-5); }
.topbar__nav a {
  display: inline-flex;
  align-items: center;
  min-height: var(--hit);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  text-decoration: none;
  padding-block: var(--sp-2);
  border-bottom: 2px solid transparent;
}
.topbar__nav a:hover { color: var(--ink); border-bottom-color: var(--se-green); }
.topbar__nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--se-green); }

.topbar__tools { display: flex; flex: none; gap: var(--sp-2); }

/* Both original PNGs already have alpha transparency. Keep the header behind
   them visible; the SVG overlay changes only RMIT's navy lettering at night. */
.topbar--partners .topbar__inner {
  width: min(100% - 2.5rem, 1600px);
  display: grid;
  grid-template-columns: 148px 340px minmax(0, 1fr) auto;
  gap: 20px;
  padding-block: 8px;
}
.brand--partner {
  margin: 0;
  padding: 7px;
  min-height: 52px;
  background: transparent;
}
.brand__logo--se { position: relative; width: 100%; aspect-ratio: 1280 / 420; overflow: hidden; }
.brand__logo--se img { display: block; width: 100%; height: auto; transform: translateY(-25.26%); }
.topbar__school { display: block; min-width: 0; aspect-ratio: 10929 / 1900; background: transparent; overflow: hidden; }
.brand__rmit { display: block; width: 100%; height: auto; transform: translateY(-13%); }
.brand__rmit-dark { display: none; }
[data-theme="dark"] .brand__rmit-dark { display: inline; }
[data-theme="dark"] .brand__logo--se img { filter: brightness(1.35); }
.topbar--partners .topbar__nav { justify-content: flex-end; gap: 20px; }
.topbar--partners .topbar__nav a { text-wrap: balance; }

@media (max-width: 1250px) {
  .topbar--partners .topbar__inner { grid-template-columns: 132px minmax(260px, 340px) 1fr; gap: 0 16px; }
  .topbar--partners .topbar__nav { grid-column: 1 / -1; grid-row: 2; justify-content: center; }
  .topbar--partners .topbar__tools { grid-column: 3; grid-row: 1; justify-self: end; }
}
@media (max-width: 760px) {
  .topbar--partners .topbar__inner { grid-template-columns: 112px minmax(240px, 1fr) auto; width: calc(100% - 24px); gap: 0 12px; }
  .topbar--partners .icon-btn { min-width: var(--hit); padding: .42rem; justify-content: center; }
  .topbar--partners .icon-btn span { display: none; }
}
@media (max-width: 540px) {
  .topbar--partners .topbar__inner { grid-template-columns: 112px 1fr; gap: 5px 12px; padding-block: 6px 0; }
  .topbar--partners .topbar__tools { grid-column: 2; grid-row: 1; }
  .topbar--partners .topbar__school { grid-column: 1 / -1; grid-row: 2; width: min(100%, 340px); justify-self: center; }
  .topbar--partners .topbar__nav { grid-row: 3; gap: 16px; }

.band { padding-block: var(--sp-7); border-top: 1px solid var(--line); }

.section-lede {
  color: var(--ink-2);

  margin-bottom: var(--sp-6);
}

.note {
  margin-top: var(--sp-5);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  border-left: 2px solid var(--line);
  padding-left: var(--sp-3);
}

.fineprint { font-size: var(--fs-xs); color: var(--ink-3); }

/* ---------- Hero ---------- */

.hero { padding-block: var(--sp-7) var(--sp-6); }

.hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--sp-7);
  align-items: center;
}

.hero__text h1 { margin-bottom: var(--sp-4); }
.hero__text .lede { margin-bottom: var(--sp-3); }
.hero__text .btn { margin-top: var(--sp-4); }

/* ---------- Stations ---------- */

.station {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr);
  border-top: 1px solid var(--line);

.station:last-of-type { border-bottom: 1px solid var(--line); }

.station__rail {
  position: relative;
  display: flex;
  justify-content: center;
  padding-top: var(--sp-6);

.station__rail::before {

  top: 0; bottom: 0; left: 50%;

  place-items: center;
  background: var(--floor);
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-2);

.band--alt .station__num { background: var(--panel); }
.station.is-done .station__num {
  background: var(--verified-wash);
  border-color: var(--se-green);
  color: var(--se-green-deep);
}

.station__body { padding: var(--sp-6) 0 var(--sp-7) var(--sp-5); }

.station__head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);

.station__icon { width: 32px; height: 32px; color: var(--steel); margin-top: 2px; }
.station__title h3 { font-size: var(--fs-h2); margin-bottom: var(--sp-1); }
.station__role { color: var(--ink-2); font-size: var(--fs-sm); margin: 0; }

.flow__steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-4);

.flow__reset { margin-top: var(--sp-6); }

.footer { border-top: 1px solid var(--line); padding-block: var(--sp-5); }
.footer__inner {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-4);
  align-items: baseline;
  justify-content: space-between;
}
.footer__note { font-size: var(--fs-sm); color: var(--ink-3); margin: 0; max-width: 60ch; }
.footer__links { display: flex; gap: var(--sp-4); font-size: var(--fs-sm); }
.footer__links a { color: var(--ink-2); }

/* ---------- Responsive ---------- */

@media (max-width: 1100px) {
  .topbar__inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0 var(--sp-3);
    padding-top: var(--sp-2);
  }
  .topbar__nav { grid-column: 1 / -1; grid-row: 2; gap: var(--sp-5); }
  .topbar__tools { grid-column: 2; grid-row: 1; }

}

@media (max-width: 900px) {
  .hero__inner { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }

  .flow__steps { grid-template-columns: minmax(0, 1fr); }

  .brand__name { font-size: var(--fs-sm); }
  .topbar__tools { gap: var(--sp-1); }

.terminal__title { font-size: var(--fs-sm); font-weight: 600; }

  text-align: center;
  padding: .5rem .3rem;
  font-size: var(--fs-xs);
  color: var(--screen-dim);

}
.scr__step.is-active { color: var(--screen-ink); border-bottom-color: var(--se-green); }
.scr__step.is-done { color: var(--se-green); }

.scr__body { padding: var(--sp-4); min-height: 232px; }

.scr__foot {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--screen-line);
}
.scr__hint { margin: 0; font-size: var(--fs-xs); color: var(--screen-dim); flex: 1 1 180px; }

.field:last-of-type { border-bottom: 0; }
.field {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: .42rem 0;
  border-bottom: 1px solid var(--screen-line);
  font-size: var(--fs-sm);
}
.field__label { color: var(--screen-dim); }
.field__value { font-family: var(--font-mono); }
.field > span { min-width: 0; overflow-wrap: anywhere; }
.field__value.is-empty { color: var(--screen-dim); font-family: var(--font-sans); }
.field__value.is-set { color: var(--se-green); }

/* Scanner. Blue belongs to the moment of scanning and nowhere else. */
.scanner {
  position: relative;
  margin: var(--sp-4) 0;
  border: 1px solid var(--screen-line);
  border-radius: var(--radius);
  padding: var(--sp-4);
  display: grid;
  place-items: center;
  min-height: 78px;
  overflow: hidden;
}
.scanner__code { font-family: var(--font-mono); font-size: 1.05rem; letter-spacing: .06em; }
.scanner__idle { color: var(--screen-dim); font-size: var(--fs-sm); }
.scanner__bars { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-bottom: var(--sp-2); }
.scanner__bars i { display: block; height: 100%; background: var(--screen-ink); opacity: .8; }

.lines { margin-top: var(--sp-3); }
.line:last-child { border-bottom: 0; }
.line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: var(--sp-3);
  align-items: center;
  padding: .4rem 0;
  border-bottom: 1px solid var(--screen-line);
  font-size: var(--fs-sm);
}
.line__code { font-family: var(--font-mono); }
.line__qty { color: var(--screen-dim); font-family: var(--font-mono); font-size: var(--fs-xs); }
.line__state { font-size: var(--fs-xs); font-weight: 600; color: var(--se-green); }
.line.is-held .line__state { color: var(--hazard); }

.scr__note {
  margin: 0 0 var(--sp-3);
  padding: .6rem .8rem;
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  background: color-mix(in srgb, var(--se-green) 16%, transparent);
  color: var(--se-green);
}
.scr__note.is-bad {
  background: color-mix(in srgb, var(--hazard) 18%, transparent);
  color: var(--hazard);
}
.line__state.is-part { color: var(--hazard); }

/* Signature chips on the return note. */
.sigs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}
.sig {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: .3rem .6rem;
  border: 1px solid var(--screen-line);
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  color: var(--screen-dim);
}
.sig svg { width: 14px; height: 14px; }
.sig.is-signed { color: var(--se-green); border-color: var(--se-green); }

/* ---------- Pallet builder ---------- */

.pallet { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
.pallet__caption { font-size: var(--fs-xs); color: var(--screen-dim); margin: 0 0 var(--sp-2); }

.plan {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 1;
  border: 2px solid var(--screen-line);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px);
}
.slot {
  position: absolute;
  border: 1px dashed var(--screen-dim);
  background: transparent;
  cursor: pointer;
  padding: 0;

}
.slot:hover { border-color: var(--screen-ink); background: rgba(255, 255, 255, .06); }

  position: absolute;
  left: 12%; right: 12%; top: 46%;
  height: 2px;
  background: rgba(0, 0, 0, .26);
}

.elev-pallet { fill: var(--carton-deep); }
.elev-box { fill: var(--carton); stroke: var(--carton-deep); stroke-width: 1; }

.elev-seam { stroke: var(--se-green); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }

.checklist { margin-top: var(--sp-3); font-size: var(--fs-sm); }

.rack { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: var(--sp-3) 0; }
.bin {
  position: relative;
  aspect-ratio: 5 / 4;
  border: 1px solid var(--screen-line);
  background: transparent;
  color: var(--screen-dim);

  font-size: 10px;

}
.bin:hover:not([disabled]) { border-color: var(--screen-ink); color: var(--screen-ink); }
.bin[disabled] { cursor: not-allowed; }
.bin.is-occupied {
  background: repeating-linear-gradient(-45deg, var(--screen-line) 0 4px, transparent 4px 8px);
  color: var(--screen-dim);
}
.bin.is-suggested { border-color: var(--machine); color: var(--machine); }
.bin.is-selected { border-color: var(--se-green); background: rgba(61, 205, 88, .16); color: var(--se-green); }
.bin__pallet {
  position: absolute;
  inset: 22% 16%;
  background: var(--carton);
  border: 1px solid var(--carton-deep);
}

.rack__legend { display: flex; flex-wrap: wrap; gap: var(--sp-4); font-size: var(--fs-xs); color: var(--screen-dim); }
.rack__legend span { display: flex; align-items: center; gap: 6px; }
.rack__legend i { width: 10px; height: 10px; border: 1px solid currentColor; display: block; }
.rack__legend .k-suggest { color: var(--machine); }
.rack__legend .k-taken { background: var(--screen-line); }

/* ---------- Flow steps ---------- */

.flow__step {
  border: 1px solid var(--line);
  border-top: 3px solid var(--line);
  background: var(--panel-2);
  padding: var(--sp-4);
  transition: border-color var(--dur) var(--ease);
}
.flow__step.is-done { border-top-color: var(--se-green); }
.flow__step-num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-3); }
.flow__step h3 { margin: var(--sp-1) 0 var(--sp-2); }
.flow__step p { font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: var(--sp-3); }
.flow__state { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
.flow__step.is-done .flow__state { color: var(--se-green-deep); }

/* ---------- Finale overlay ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  align-items: safe center;
  padding: var(--sp-4);
  overflow-y: auto;
  background: color-mix(in srgb, var(--ink) 48%, transparent);
  backdrop-filter: var(--blur);
}
.overlay__panel {
  width: min(100%, 560px);
  background: var(--panel-2);
  border: 0;
  border-top: 4px solid var(--se-green);
  border-radius: var(--radius-lg);

}
.overlay__panel h2 { margin-bottom: var(--sp-3); }
.overlay__panel p { font-size: var(--fs-sm); color: var(--ink-2); }

.finale__route { width: 100%; height: auto; margin-bottom: var(--sp-4); }
.finale__line { stroke: var(--line); stroke-width: 2; fill: none; }
.finale__line-fill { stroke: var(--se-green); stroke-width: 2; fill: none; }
.finale__node circle { fill: var(--panel-2); stroke: var(--se-green); stroke-width: 2; }
.finale__tick { fill: none; stroke: var(--se-green-deep); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.finale__pallet rect { fill: var(--carton); }
.finale__pallet path { fill: var(--carton-deep); }

.finale__recap { margin: var(--sp-4) 0 var(--sp-5); border-top: 1px solid var(--line); }
.finale__recap li {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.finale__recap .mono { color: var(--se-green-deep); }

.overlay__actions { display: flex; gap: var(--sp-3); flex-wrap: wrap; }

/* ---------- Forklift ---------- */

.forklift-layer {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 200px;
  pointer-events: none;
  z-index: 50;
  overflow: hidden;
}
.forklift-layer:empty { display: none; }
.forklift { position: absolute; bottom: 10px; left: 0; width: 260px; }
.forklift svg { width: 100%; height: auto; }

.fk-body { fill: var(--machine); }
.fk-dark { fill: #2B3238; }
.fk-cage { stroke: #2B3238; stroke-width: 5; fill: none; stroke-linecap: round; }
.fk-mast { fill: #4A555D; }
.fk-fork { fill: #8C959B; }
.fk-tyre { fill: #1D2226; }
.fk-hub { fill: #C7CDD1; }
.fk-load { fill: var(--carton); stroke: var(--carton-deep); stroke-width: 2; }
.fk-skid { fill: var(--carton-deep); }
.fk-beacon { fill: var(--machine); }

@media (max-width: 640px) {
  .pallet { grid-template-columns: minmax(0, 1fr); }
  .forklift { width: 180px; }

  .scr__step { flex: 1 0 50%; }

  .line__state { grid-column: 1 / -1; }
  .line__code { overflow-wrap: anywhere; }
  .bin { min-height: var(--hit); }
  .overlay__panel { padding: var(--sp-4); }
}

/* css/views.css */
/* Full screen views. Nothing scrolls to reach a station. */

html, body { height: 100%; }
body { overflow: hidden; }

/* Paper grain over everything, so surfaces read as material not as chrome. */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--grain);
  pointer-events: none;
  z-index: 70;
}
body:has(#view-home.is-active)::after { background: none; }

.view {
  position: fixed;   /* load bearing: gives the view its height */
  inset: 0;
  top: var(--topbar-h);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.view:not(.is-active) { display: none; }

/* The project document scrolls within the active view. */
.view--doc { overflow-y: auto; padding-bottom: var(--sp-7); }

/* ---------- Home: a fitted warehouse canvas ----------
   The copy stays in the lower-left corner at every viewport and zoom level.
   The canvas owns its dimensions; neither the scene nor copy adds a scroll. */
#view-home.is-active {
  display: block;
  overflow: hidden;
}
#view-home .twin {
  --scene-pad: clamp(12px, 2.2vmin, 32px);
  --copy-height: 220px;
  --scene-head-height: 48px;
  position: absolute;
  inset: 0;
  border: 0;
  display: block;
  container-type: size;
}
#view-home .twin__head {
  position: absolute;
  top: var(--scene-pad);
  left: var(--scene-pad);
  width: calc(100% - 2 * var(--scene-pad));
  z-index: 2;
}
#view-home #twin-stage {
  position: absolute;
  inset: 0;
}
#view-home .twin__svg {
  width: 100%;
  height: 100%;
  max-height: none;
  display: block;
}

/* ---------- A station view ----------
   Each station carries its own colour on a painted spine and a stencilled
   number, so the three do not read as one template repeated. */

#view-gr        { --station: var(--petrol); --station-soft: var(--petrol-soft); }
#view-putaway   { --station: var(--oxide); --station-soft: var(--oxide-soft); }
#view-interlock { --station: var(--moss);  --station-soft: var(--moss-soft); }

.view[id^="view-"] .app-view { position: relative; }

/* The stencilled number, set into the background rather than printed on top. */
.app-view::before {
  content: attr(data-figure);
  position: absolute;
  right: -.06em;
  bottom: -.22em;
  font-family: var(--font-mono);
  font-size: clamp(14rem, 34vh, 26rem);
  font-weight: 700;
  line-height: .8;
  color: var(--station);
  opacity: .07;
  pointer-events: none;
  z-index: 0;
}
.app-view > * { position: relative; z-index: 1; }

/* ---------- A station view ---------- */

.app-view {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
  gap: var(--sp-6);
  align-items: center;
  /* 'safe' matters: with plain centring, content taller than the view overflows
     equally in both directions and the top half becomes unreachable. Safe
     centring falls back to start-alignment exactly when that would happen. */
  align-items: safe center;
  width: min(100% - 3rem, var(--wrap));
  margin-inline: auto;
  padding-block: var(--sp-5);
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.app-view__brief {
  min-width: 0;
  padding-left: var(--sp-5);
  border-left: 6px solid var(--station);
}

.app-view__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--station);
  margin-bottom: var(--sp-3);
}
.app-view__eyebrow .station__icon { color: var(--station); }
.app-view__brief .taglist li {
  border-color: var(--station);
  background: var(--station-soft);
  color: var(--station);
}
.app-view .back-link:hover { color: var(--station); }
.app-view__screen .terminal { border-top: 5px solid var(--station); }
.app-view__brief h2 { margin-bottom: var(--sp-2); }
.app-view__role { color: var(--ink-2); font-size: var(--fs-sm); margin-bottom: var(--sp-4); }
.app-view__brief p { font-size: var(--fs-sm); color: var(--ink-2); }
.app-view__actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }

.app-view__screen { min-width: 0; display: flex; justify-content: center; }
.app-view__screen .terminal { margin: 0; width: 100%; max-width: 640px; }
.app-view__screen .scr__body { max-height: 52vh; overflow-y: auto; }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  background: transparent;
  border: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
  font-weight: var(--weight-emphasis);
  cursor: pointer;
  padding: 0;
}
.back-link:hover { color: var(--ink); }
.back-link svg { width: 18px; height: 18px; }

/* ---------- Progress, shown on every view ---------- */

.dots { display: flex; align-items: center; gap: var(--sp-2); }
.dots__dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--line);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.dots__dot.is-filled { background: var(--se-green); transform: scale(1.25); }

/* ---------- The forklift transition ---------- */

.transition {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  overflow: hidden;
}
.transition__curtain {
  position: absolute;
  inset: 0;
  background: var(--steel);
  transform: translateX(-102%);
}
[data-theme="dark"] .transition__curtain { background: #0A0D0F; }
.transition__truck {
  position: absolute;
  bottom: 12%;
  left: 0;
  width: min(46vw, 520px);
  transform: translateX(-110%);
}
.transition__truck svg { width: 100%; height: auto; }

@media (max-width: 1100px) {
  .app-view {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--sp-4);
    align-content: start;
    align-items: start;
  }
  .app-view__screen .scr__body { max-height: none; }
  .transition__truck { width: 72vw; bottom: 16%; }

}


/* Leave the corner copy its own room in a narrow canvas. Both regions remain

@container (max-aspect-ratio: 7/5) {

    inset: var(--scene-head-height) 0 calc(var(--copy-height) + 2 * var(--scene-pad));

@media (max-width: 640px) {
  .app-view { width: calc(100% - 2rem); }
  .app-view__brief { padding-left: var(--sp-3); }
  .app-view__eyebrow { flex-wrap: wrap; }

/* css/animations.css */
/* Warehouse activity and interaction animations. */

/* Truck visibility supplies the shared clock. vehicles.js uses that clock to
   turn the actual geometry, reverse to the dock, and leave cab first. */
/* ---------- The dock cycle ----------
   One 24s clock for the receiving truck and gate. The logistics controller
   waits for this dock to open before collecting its pallet. */

.twin__hall { --dock-cycle: 24s; }

@keyframes dock-truck {
  0%   { opacity: 0; }
  4%   { opacity: 1; }
  14%, 68% { opacity: 1; }
  84%, 100% { opacity: 0; }
}
.iso-dock-truck {
  transform-box: view-box;
  animation: dock-truck var(--dock-cycle) linear infinite;
}

/* The activity renderer reads the receiving truck's clock to lift the gate.
   It also holds the gate open for a crossing forklift between deliveries. */
.iso-dock-gate {
  transform-box: view-box;
}

/* Wheels turn while a vehicle is moving. */
@keyframes wheel-roll {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.iso-wheel-spin { transform-box: fill-box; transform-origin: center; }
.iso-shipping .iso-wheel-spin,
.iso-dock-truck .iso-wheel-spin,
.iso-shuttle .iso-wheel-spin { animation: wheel-roll 900ms linear infinite; }

/* The team talking. Each bubble opens, its dots run, then it closes; the
   delays are staggered across the five so it reads as a conversation rather
   than five people speaking at once. */
@keyframes chat-pop {
  0%   { opacity: 0; transform: scale(.6); }
  3%   { opacity: 1; transform: scale(1); }
  17%  { opacity: 1; transform: scale(1); }
  21%  { opacity: 0; transform: scale(.85); }
  100% { opacity: 0; transform: scale(.85); }
}
@keyframes chat-dot {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}
.iso-chat { animation: chat-pop 17s ease-in-out infinite; }
.iso-chat-dot { animation: chat-dot 1200ms ease-in-out infinite; }
.iso-chat-dot:nth-of-type(2) { animation-delay: 180ms; }
.iso-chat-dot:nth-of-type(3) { animation-delay: 360ms; }

/* Operator joints and footfalls use the shared warehouse clock in operators.js. */
.iso-yield-light { fill: var(--machine); stroke: var(--ink); stroke-width: 1; visibility: hidden; }
.iso-shuttle.is-yielding .iso-yield-light { visibility: visible; }
.iso-stretch-film polygon { fill: #e4f2ee; fill-opacity: .12; stroke: #e4f2ee; stroke-opacity: .2; stroke-width: .35; }
.iso-stretch-film path { fill: none; stroke: #e4f2ee; stroke-opacity: .4; stroke-width: .4; }
.iso-stretch-web { fill: #e4f2ee; fill-opacity: .18; stroke: #e4f2ee; stroke-opacity: .35; stroke-width: .4; }

   to the system's reduced-motion preference. SVG timing is handled in twin.js. */

#twin-stage.is-still .iso-dock-truck { opacity: 1; transform: none; }

.scanbox__beam.is-on { animation: beam 700ms var(--ease) 1; }

@keyframes beam-screen {
  0%   { transform: translateY(-100%); opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translateY(2400%); opacity: 0; }
}
.scanner.is-scanning::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 3px;
  background: var(--scan);
  box-shadow: 0 0 14px 3px color-mix(in srgb, var(--scan) 55%, transparent);
  animation: beam-screen 620ms var(--ease) 1;
}

@keyframes code-in {
  from { opacity: 0; letter-spacing: .3em; }
  to   { opacity: 1; letter-spacing: .06em; }
}
.scanner__code.is-in { animation: code-in 340ms var(--ease) both; }

@keyframes row-in {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}
.scanbox__row { animation: row-in 240ms var(--ease) both; }

/* ---------- Scanned line arrival ---------- */

@keyframes line-in {
  from { opacity: 0; transform: translateX(-14px); }
  to   { opacity: 1; transform: none; }
}
.line.is-in { animation: line-in 260ms var(--ease) both; }

/* ---------- Carton drop onto the pallet ---------- */

@keyframes carton-drop {
  0%   { opacity: 0; transform: translateY(-34px) scale(1.06); }
  70%  { opacity: 1; transform: translateY(2px) scale(1); }
  100% { opacity: 1; transform: none; }
}
.slot.is-filled.is-in { animation: carton-drop 300ms var(--ease) both; }

@keyframes elev-rise {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: none; }
}
.elev-box.is-in {
  transform-box: fill-box;
  transform-origin: center;
  animation: elev-rise 300ms var(--ease) both;
}

/* ---------- Pallet sliding into its bin ---------- */

@keyframes bin-load {
  0%   { opacity: 0; transform: translateX(-140%); }
  100% { opacity: 1; transform: none; }
}
.bin__pallet.is-in { animation: bin-load 460ms var(--ease) both; }

/* ---------- Forklift crossing the screen ---------- */

@keyframes drive {
  from { transform: translateX(-300px); }
  to   { transform: translateX(calc(100vw + 80px)); }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25%      { transform: translateY(-2px) rotate(-.35deg); }
  75%      { transform: translateY(1px) rotate(.35deg); }
}
@keyframes roll {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes lift {
  0%   { transform: translateY(0); }
  35%  { transform: translateY(-26px); }
  70%  { transform: translateY(-26px); }
  100% { transform: translateY(0); }
}
@keyframes beacon {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}

.forklift.is-driving { animation: drive var(--dur-forklift) linear both; }
.forklift.is-driving .fk-shell { animation: bob 620ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.forklift.is-driving .fk-wheel { animation: roll 780ms linear infinite; transform-box: fill-box; transform-origin: center; }
.forklift.is-driving .fk-carriage { animation: lift var(--dur-forklift) var(--ease) both; }
.forklift.is-driving .fk-beacon { animation: beacon 520ms steps(1, end) infinite; }

/* ---------- Finale ---------- */

@keyframes overlay-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(16px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
.overlay.is-open { animation: overlay-in 200ms var(--ease) both; }
.overlay.is-open .overlay__panel { animation: panel-in 340ms var(--ease) 60ms both; }

@keyframes route-draw {
  from { stroke-dashoffset: 300; }
  to   { stroke-dashoffset: 0; }
}
.overlay.is-open .finale__line-fill {
  stroke-dasharray: 300;
  animation: route-draw 1200ms var(--ease) 220ms both;
}

@keyframes tick-draw {
  from { stroke-dashoffset: 22; }
  to   { stroke-dashoffset: 0; }
}
.overlay.is-open .finale__tick {
  stroke-dasharray: 22;
  animation: tick-draw 260ms var(--ease) both;
}
.overlay.is-open [data-node="1"] .finale__tick { animation-delay: 420ms; }
.overlay.is-open [data-node="2"] .finale__tick { animation-delay: 800ms; }
.overlay.is-open [data-node="3"] .finale__tick { animation-delay: 1180ms; }

@keyframes pallet-travel {
  0%   { transform: translate(30px, 90px); }
  100% { transform: translate(330px, 90px); }
}
.finale__pallet { transform: translate(30px, 90px); }
.overlay.is-open .finale__pallet { animation: pallet-travel 1200ms var(--ease) 220ms both; }

/* ---------- Reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

  .transition.is-running .transition__curtain,
  .transition.is-running .transition__truck,
  .transition.is-running .tf-body,
  .transition.is-running .tf-wheel-rotation,
  .transition.is-running .tf-beacon-glow,
  .iso-shipping,
  .op-walk,
  .iso-wheel-spin,
  .iso-chat,
  .iso-chat-dot,
  .iso-dock-truck,
  .iso-dock-gate,
  .op-arm,
  .op-beam,
  .iso-route-flow,
  .iso-node-ping,
  .reticle.is-live,
  .wipe.is-on,
  body.is-intro .stage-overlay h1,
  body.is-intro .stage-overlay .btn,
  body.is-intro .scanbox,
  body.is-intro .hero__h2,
  body.is-intro .hero__text .lede,
  body.is-intro .hero__text .fineprint,
  body.is-intro .hero__text .btn,
  body.is-intro .cn-label,
  body.is-intro .cn-bars,
  body.is-intro .cn-matrix,
  body.is-intro .cn-code,
  .terminal.is-open,
  .stamp.is-in,
  .scanbox__beam.is-on,
  .scanbox__row,
  .scanner__code.is-in,
  .line.is-in,
  .slot.is-filled.is-in,
  .elev-box.is-in,
  .bin__pallet.is-in,
  .overlay.is-open,
  .overlay.is-open .overlay__panel,
  .overlay.is-open .finale__line-fill,
  .overlay.is-open .finale__tick,
  .overlay.is-open .finale__pallet,
  .forklift.is-driving,
  .forklift.is-driving .fk-shell,
  .forklift.is-driving .fk-wheel,
  .forklift.is-driving .fk-carriage,
  .forklift.is-driving .fk-beacon {
    animation: none !important;
  }

  .scanner.is-scanning::after { display: none; }
  .progress__seg::after { transition: none; }
}

<script>
/* js/state.js */
/* Completion state for the three stations. In memory only: nothing about a
   visitor is stored or sent anywhere. */

(function (global) {
  'use strict';

  var APPS = ['gr', 'putaway', 'interlock'];
  var done = [];
  var listeners = [];

  function isDone(app) { return done.indexOf(app) !== -1; }
  function count() { return done.length; }
  function allDone() { return done.length === APPS.length; }

  function complete(app) {
    if (APPS.indexOf(app) === -1 || isDone(app)) { return false; }
    done.push(app);
    notify(app);
    return true;
  }

  function reset() {
    done = [];
    notify(null);
  }

  function notify(app) {
    listeners.forEach(function (fn) {
      fn({ app: app, count: count(), all: allDone() });
    });
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      listeners = listeners.filter(function (item) { return item !== fn; });
    };
  }

  global.WarehouseState = {
    apps: APPS,
    isDone: isDone,
    count: count,
    allDone: allDone,
    complete: complete,
    reset: reset,
    subscribe: subscribe
  };
})(window);

</script>

/* The reference floor plan: two rack banks between container docks, opposite

      specs.push([ox+VEH_LEN+.12,oy+side*VEH_W/2+1.3,.12,.12,4.4,'steel',base+.4,hinge]);
    });
    [ox, ox + VEH_LEN - .7].forEach(function (x) {
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base + 4.6]);
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base]);
    });
    return specs;
  }

  /* A tractor unit plus its trailer. */
  function truck(ox, oy) {
    var specs = [];
    // chassis rail
    specs.push([ox + 0.4, oy + 0.7, VEH_LEN - 0.8, VEH_W - 1.4, 0.7, 'tyre', 1.4]);
    // cab, set slightly narrower than the trailer
    specs.push([ox - 4.7, oy + 0.5, 4.3, VEH_W - 1, 4.7, 'cab', 2.1]);
    specs.push([ox - 4.8, oy + VEH_W - 0.6, 3.5, 0.3, 1.9, 'glass', 4.5]);
    specs.push([ox - 1.5, oy + 0.6, 0.4, VEH_W - 1.2, 2.2, 'tyre', 4.4]);   // exhaust stack
    // trailer
    return {
      specs: specs.concat(containerBody(ox, oy, 'cont', 2.1)),
      wheels: [2.4, 4.4, 10.6, -3.9].map(function (dx) {
        return [ox + dx + 0.85, oy + VEH_W - 0.12, 0.85, 0.85];
      })
    };
  }

  /* A stack of empty returnable crates, waiting to go back on the truck. */
  function emptyStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.1, 'empties', 0.3 + i * 1.15]);
    }
    return specs;
  }

  /* A pallet with cartons on it. */
  function palletStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.5, 'load', 0.3 + i * 1.5]);
    }
    return specs;
  }

  /* Ribbed container docks bookend the two open rack banks. The front end
     stays open so the loading aisle and receiving shutter remain visible. */
  function freightContainer(x, kind, receiving) {
    var y = 1, w = 13, d = 26, h = 14;
    var specs = [
      [x, y, w, d, .6, kind, .7],
      [x, y, .65, d, h, kind, .7],
      [x + w - .65, y, .65, d, h, kind, .7],
      [x, y, w, .65, h, kind, .7],
      [x, y, w, d, .6, kind, h + .7]
    ];
    for (var rib = 1.5; rib < d; rib += 1.6) {
      specs.push([x + w - .4, y + rib, .6, .35, h, kind, .7]);
      specs.push([x, y + rib, w, .3, .3, kind, h + 1.3]);
    }
    var out = '<g class="iso-freight-container" data-container="' + (receiving ? 'receiving' : 'shipping') + '">'
      + paint(specs);
    if (receiving) { out += dockGate(x + .65, y + d); }
    else {
      out += box(x - 3.4, y + d - .2, 3.5, .5, h, kind, .7);
      out += box(x + w - .1, y + d - .2, 3.5, .5, h, kind, .7);
    }
    out += environment.dockDetails(x,receiving ? 'D01' : 'D02');
    return out + '</g>';
  }

  function dockGate(x, y) {
    var width=11.7,height=13.4,base=1.3;
    var opening = [p(x,y,height+base),p(x+width,y,height+base),p(x+width,y+.6,height+base),
      p(x+width,y+.6,base),p(x,y+.6,base),p(x,y+.6,height+base)];
    var slats = '';
    for (var z = base; z < height+base; z+=.8) {
      slats += 'M' + p(x, y + .61, z) + 'L' + p(x + width, y + .61, z);
    }
    return '<g class="iso-dock-doorway">'
      + '<defs><clipPath id="dock-gate-opening" clipPathUnits="userSpaceOnUse">'
      + poly(opening, '') + '</clipPath></defs>'
      + '<g clip-path="url(#dock-gate-opening)"><g class="iso-dock-gate" id="dock-gate">'
      + box(x, y, width, .6, height, 'container-blue',base)
      + '<path class="iso-gate-slat" d="' + slats + '"/></g></g></g>';
  }


  /* Open orange shelves, with separate uprights and diagonal end bracing.
     Keeping the bays hollow makes them read as the reference's racks. */
  function rackBank(x) {
    var y = 3, w = 21, d = 14, h = 16;
    var rear = [], front = [], shelves = '',feet='';
    [0, w / 2, w].forEach(function (dx) {
      [y,y+d].forEach(function(py){
        var px=x+dx;
        feet+='<g class="iso-rack-foot">'
          + box(px-.4,py-.25,1.6,1.6,.16,'steel',FLOOR_Z)+'</g>';
      });
      rear.push([x + dx, y, .7, .7, h-.16, 'rack-post', FLOOR_Z+.16]);
      front.push([x + dx, y + d, .7, .7, h-.16, 'rack-post', FLOOR_Z+.16]);
    });
    [6.7, 10.5, 15.5].forEach(function (z, level) {
      shelves += '<g data-rack-level="' + ['lower','upper','top'][level] + '">';
      [0, w / 2].forEach(function (dx) {
        shelves += box(x + dx + .7, y + .7, w / 2 - .7, d - .7, .4, 'rack', z);
        shelves += box(x + dx, y + d, w / 2, .7, .85, 'rack', z - .4);
      });
      shelves += '</g>';
      shelves += environment.rackStock(x,level,z);
    });
    var braces = '';
    [x + w].forEach(function (cx) {
      [1.2, 6.2, 11.2].forEach(function (z) {
        braces += 'M' + p(cx + .8, y + .5, z) + 'L' + p(cx + .8, y + d, z + 4.1)
          + 'M' + p(cx + .8, y + d, z) + 'L' + p(cx + .8, y + .5, z + 4.1);
      });
    });
    return '<g class="iso-rack-bank">' + feet
      + paint(rear) + shelves + paint(front) + '<path class="iso-rack-brace" d="' + braces + '"/>'
      + environment.rackDetails(x,x===23 ? 'R01' : 'R02') + '</g>';
  }

  /* Stackable totes have an open rim and side ribs, unlike solid cartons. */
  function toteStack(x, y, layers, kind, w, d) {
    // Keep the deck at 1.35 while extending its plinth down to the slab.
    var out = box(x, y, w, d, 1.35-FLOOR_Z, 'rib', FLOOR_Z);
    for (var layer = 0; layer < layers; layer++) {
      var z = 1.35 + layer * 2.4;
      out += box(x, y, w, d, 1.9, kind, z);
      out += poly([p(x + .5, y + .5, z + 1.91), p(x + w - .5, y + .5, z + 1.91),
        p(x + w - .5, y + d - .5, z + 1.91), p(x + .5, y + d - .5, z + 1.91)], 'iso-tote-opening');
      out += paint([[x, y, w, .32, .4, kind, z + 1.9], [x, y + d - .32, w, .32, .4, kind, z + 1.9],
        [x, y, .32, d, .4, kind, z + 1.9], [x + w - .32, y, .32, d, .4, kind, z + 1.9]]);
      var ribs = '';
      for (var dx = 1; dx < w; dx += 1.5) {
        ribs += 'M' + p(x + dx, y + d + .01, z + .15) + 'L' + p(x + dx, y + d + .01, z + 1.7);
      }
      out += '<path class="iso-tote-rib" d="' + ribs + '"/>';
    }
    return out;
  }

  function goodsReceived() {
    var out = '<g data-layout-area="gr">';
    // Two blocks of stacked totes: pale on the left, dark on the right.
    [[12, 'tote-cream', 5], [26, 'tote-dark', 4]].forEach(function (stack) {
      [47, 53].forEach(function (y) {
        [0, 5].forEach(function (dx) { out += toteStack(stack[0] + dx, y, stack[2], stack[1], 4.6, 5.4); });
      });
    });
    return out + '</g>';
  }

  function returnables() {
    return '<g data-layout-area="returnables">'
      + toteStack(86, 48, 4, 'tote-green', 4.3, 5.2)
      + toteStack(91, 48, 4, 'tote-red', 4.3, 5.2)
      + toteStack(86, 54, 4, 'tote-yellow', 4.3, 5.2)
      + '</g>';
  }

  function table(x, y, w, d) {
    var specs = [[x, y, w, d, .55, 'table', 4.5]];
    [[x + .4, y + .4], [x + w - .9, y + .4], [x + .4, y + d - .9], [x + w - .9, y + d - .9]].forEach(function (leg) {
      specs.push([leg[0], leg[1], .5, .5, 3.8, 'steel', .7]);
    });
    return paint(specs);
  }

  function discZ(x, y, z, radius, cls) {
    var points = [];
    for (var i = 0; i < 48; i++) {
      var a = i * Math.PI / 24;
      points.push(p(x + radius * Math.cos(a), y + radius * Math.sin(a), z));
    }
    return poly(points, cls);
  }

  function turntableBody(x,y,radius) {
    var out='<g class="iso-wrapper-drum">';
    for(var i=0;i<48;i++) {
      var a=i*Math.PI/24,b=(i+1)*Math.PI/24,middle=(a+b)/2;
      if(Math.cos(middle)+Math.sin(middle)<=0) continue;
      out+=poly([p(x+radius*Math.cos(a),y+radius*Math.sin(a),FLOOR_Z),
        p(x+radius*Math.cos(b),y+radius*Math.sin(b),FLOOR_Z),
        p(x+radius*Math.cos(b),y+radius*Math.sin(b),WRAPPER_TOP),
        p(x+radius*Math.cos(a),y+radius*Math.sin(a),WRAPPER_TOP)],
        'iso-wrapper-side'+(Math.cos(middle)>Math.sin(middle)?' iso-wrapper-side--shade':''));
    }
    return out+'</g>';
  }

  function packArea() {
    var out = '<g data-layout-area="interlock">';
    out += '<g class="iso-l-table">' + table(40, 49, 4, 13) + table(44, 58, 8, 4) + '</g>';
    // Circular wrapping turntable, tall yellow mast, and the film carriage.
    out += '<g class="iso-wrapper">'
      + turntableBody(63,53,7.2)
      + discZ(63, 53, WRAPPER_TOP, 7.2, 'iso-wrapper-top')
      + discZ(63, 53, WRAPPER_TOP+.005, 2.1, 'iso-wrapper-hub')
      + discZ(63, 53, WRAPPER_TOP+.01, 4.9, 'iso-wrap-contact')
      + '<path id="wrapping-turntable-marks" class="iso-wrap-turntable-marks"/>'
      + '<g id="wrapping-pallet"></g>'
      + '<g id="wrapping-film" class="iso-stretch-film"></g>'
      + '<path id="wrapping-web" class="iso-stretch-web"/>'
      + paint([[69.5,52,2.5,2,.35,'steel',FLOOR_Z],
        [70, 49, 5, 8, .8, 'machine', FLOOR_Z], [71, 50, 3.2, 4, 23, 'machine', FLOOR_Z+.8],
        [69.8, 50.5, 1, 3, 2.3, 'steel', 1.8]])
      + '<g id="wrapping-carriage">' + filmRoll() + '</g>'
      + '</g></g>';
    return out;
  }

  function filmRoll() {
    var x=69.25,y=52.15,bottom=2.43,height=1.55,radius=.42;
    var out=paint([[69.65,51.45,.4,1.4,height+.7,'steel',bottom-.35],
      [68.7,51.8,1.1,.7,.16,'steel',bottom-.2],
      [68.7,51.8,1.1,.7,.16,'steel',bottom+height+.04]]);
    for(var i=0;i<24;i++) {
      var a=i*Math.PI/12,b=(i+1)*Math.PI/12,middle=(a+b)/2;
      if(Math.cos(middle)+Math.sin(middle)<=0) continue;
      out+=poly([p(x+Math.cos(a)*radius,y+Math.sin(a)*radius,bottom),
        p(x+Math.cos(b)*radius,y+Math.sin(b)*radius,bottom),
        p(x+Math.cos(b)*radius,y+Math.sin(b)*radius,bottom+height),
        p(x+Math.cos(a)*radius,y+Math.sin(a)*radius,bottom+height)],'iso-wrap-roll-side');
    }
    return out+discZ(x,y,bottom+height,radius,'iso-wrap-roll-top')
      +discZ(x,y,bottom+height+.01,.12,'iso-wrap-roll-core');
  }

  function layoutLabels(text) {
    var labels = [
      [37, 45, '01 · GR', 'gr'], [57, 19, '02 · PutAway', 'putaway'],
      [70, 66, '03 · Pallet Interlocking', 'interlock'], [97, 65, text('twin.returnables'), 'returnables']
    ];
    return '<g class="iso-area-labels" aria-hidden="true">' + labels.map(function (label) {
      var c = pt(label[0], label[1], 1);
      return '<text class="iso-area-label" data-area-label="' + label[3] + '" x="' + c[0] + '" y="' + c[1] + '">' + escapeHtml(label[2]) + '</text>';
    }).join('') + '</g>';
  }

  function route() {
    var d = 'M' + p(30, 40, .8) + 'L' + p(30, AISLE, .8)
      + 'L' + p(56, AISLE, .8) + 'L' + p(56, 27, .8)
      + 'M' + p(56, AISLE, .8) + 'L' + p(58, AISLE, .8) + 'L' + p(58, 43, .8);
    return '<path class="iso-route" d="' + d + '"/>'
      + '<path class="iso-route-flow" d="' + d + '"/>'
      + '<path class="iso-route-done" id="twin-route-done" d="' + d + '"/>';
  }

  // The side alleys are drawn behind their racks/containers. Movement comes
  // from the shared traffic model so a pedestrian can yield mid-route.
  var PATROLS = [
    {id:'roamer',x:18,y:5,route:[[18,5],[18,23]],speed:1.8},
    {id:'operator',x:50,y:5,route:[[50,5],[50,23]],speed:2.1},
    {id:'returns-op',x:93,y:5,route:[[93,5],[93,23]],speed:1.8},
    {id:'gr-scanner',x:37,y:41,route:[[37,41],[39,41],[39,46],[37,46]],speed:1.2,dwell:2.4,task:'scan'},
    {id:'wrapping-operator',x:64,y:62,route:[],speed:1.2,heading:-96,task:'wrap'}
  ];
  var ADMIN_ROUTE = [[27,25],[50,25],[50,39],[80,39],[98,43],[98,65],
    [76,65],[76,43],[55,43],[37,43],[37,37],[18,37],[18,28]];
  function walker(index) {
    var person=PATROLS[index];
    return '<g class="iso-figure ' + (person.id==='wrapping-operator' ? 'iso-wrapping-operator' : 'iso-roamer') + '" id="' + person.id + '">'
      + '<g class="op-walk"></g></g>';
  }

  /* The five named operators stand in clear spaces beside their work areas. */
  var TEAM = [
    { name: 'Sơn',  x: 82, y: 63, crew: 'crewA', talk: '0s', heading:-48, area: 'returnables' },
    { name: 'Ngân', x: 27, y: 25, crew: 'crewB', talk: '3.4s', ponytail: true, area: 'aisle' },
    { name: 'Minh', x: 36, y: 65, crew: 'crewC', talk: '6.8s', heading:-126, area: 'gr', task:'scan' },
    { name: 'Trí',  x: 56, y: 63, crew: 'crewD', talk: '1.7s', heading:-55, area: 'interlock' },
    { name: 'Bách', x: 89, y: 23, crew: 'crewE', talk: '5.1s', heading:-140 }
  ];

  function crew() {
    return '<g class="iso-team">' + TEAM.map(function (m, index) {
      var y = m.y;
      var base = pt(m.x, y, 0);
      var bubbleY = base[1] - 44;      // clear of the hard hat
      var nameY = base[1] - 62;        // and the name clears the bubble
      var bx = base[0] - 11;

      var dots = [0, 1, 2].map(function (n) {
        return '<circle class="iso-chat-dot" cx="' + (bx + 6 + n * 5).toFixed(1)
          + '" cy="' + (bubbleY + 8).toFixed(1) + '" r="1.6"/>';
      }).join('');

      return '<g class="iso-member" data-member="' + index + '" data-work-area="' + (m.area || 'putaway') + '" tabindex="-1" role="button" aria-label="' + m.name + '" style="--gesture-delay:' + m.talk + '">'
        + '<title>' + m.name + '</title>'
        + '<rect class="iso-member-hit" x="' + (base[0] - 14) + '" y="' + (base[1] - 34) + '" width="28" height="40" rx="5"/>'
        + '<g class="iso-member-body"></g>'
        + '<g class="iso-chat" style="animation-delay:' + m.talk + '">'
        +   '<path class="iso-chat-tail" d="M' + (bx + 8).toFixed(1) + ',' + (bubbleY + 14).toFixed(1)
        +     'l5,0l-3,6z"/>'
        +   '<rect class="iso-chat-box" x="' + bx.toFixed(1) + '" y="' + bubbleY.toFixed(1)
        +     '" width="22" height="14" rx="4"/>'
        +   dots
        + '</g>'
        + '<text class="iso-member-name" x="' + base[0].toFixed(1) + '" y="' + nameY.toFixed(1) + '">'
        +   m.name
        + '</text>'
        + '</g>';
    }).join('') + '</g>';
  }

  function nodes(labels, floorOnly) {
    return NODES.map(function (node, index) {
      var c = pt(node.x, node.y, 0.9);
      var area = node.area;
      var name = labels[node.app] || node.app;
      if (floorOnly) {
        return '<g class="iso-area-hit" data-area-app="' + node.app + '">'
          + poly([p(area[0], area[1], .8), p(area[0] + area[2], area[1], .8),
            p(area[0] + area[2], area[1] + area[3], .8), p(area[0], area[1] + area[3], .8)], 'iso-hit') + '</g>';
      }
      return '<g class="iso-node iso-node--' + (index + 1) + '" data-node-app="' + node.app + '"'
        + ' tabindex="0" role="button" aria-label="' + node.num + '. ' + name + '">'
        + '<ellipse class="iso-node-pad" cx="' + c[0] + '" cy="' + c[1] + '" rx="26" ry="15"/>'
        + '<ellipse class="iso-node-ping" cx="' + c[0] + '" cy="' + c[1] + '" rx="26" ry="15"/>'
        + '<circle class="iso-node-dot" cx="' + c[0] + '" cy="' + c[1] + '" r="5"/>'
        + '</g>';
    }).join('');
  }

  function buildTip(mount) {
    var tip = document.createElement('div');
    tip.className = 'twin__tip';
    tip.hidden = true;
    mount.appendChild(tip);
    return tip;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  var DEPART_AT = '-28.8s';  /* 60% of the 48s shipping cycle */

  function create(mount, options) {
    var opts = options || {};
    var labels = opts.labels || { gr: 'Goods Received', interlock: 'Pallet Interlocking', putaway: 'PutAway' };
    var still = opts.reducedMotion;

      '<svg class="twin__svg" viewBox="58 -45 988 690" preserveAspectRatio="xMidYMid meet" role="group" tabindex="0" aria-label="'
      + (opts.description || 'Isometric plan of the hall') + '">'
      + '<g class="twin__hall">'
      +   environment.definitions()
      +   environment.foundation()
      +   floorPlate()
      +   lighting()
      +   floorMarks()
      +   environment.floorFinish()
      +   environment.shadows()
      +   environment.areaGuides()
      +   route()
      +   nodes(labels, true)
      +   environment.shell(text('brand.name'))

      +   '<g data-layout-area="putaway">' + rackBank(63) + '</g>'

      +   '<g id="dock-truck" class="iso-dock-truck"></g>'
      +   '<g id="shipping" class="iso-shipping"></g>'
      +   '<g class="iso-shuttle" id="aisle-truck"></g>'
      +   '<g class="iso-shuttle" id="shuttle"></g>'
      +   walker(3)

    // This marker is painted on the floor behind the wrapping equipment.

    var interlockArea=mount.querySelector('[data-layout-area="interlock"]');

    var vehicles = [
      global.WarehouseVehicles.create(mount.querySelector('#dock-truck'), {vehicle:truck(0,0),project:pt,x:6,receiving:true,shadow:[-4.8,0,17.8,6]}),
      global.WarehouseVehicles.create(mount.querySelector('#shipping'), {vehicle:truck(0,0),project:pt,x:105,receiving:false,shadow:[-4.8,0,17.8,6]})
    ];
    var activity=global.WarehouseLogistics.create({people:PATROLS.concat(TEAM.map(function (m,i) {
      return {id:'member-'+i,x:m.x,y:m.y,route:i===1 ? ADMIN_ROUTE : [],speed:2.6,heading:m.heading,dwell:.35};
    }))});
    var activityRenderer=global.WarehouseLogisticsRenderer.create(mount,pt,activity);
    var hall=mount.querySelector('.twin__hall');

    var actorNodes=activity.people.map(function (person) {
      return mount.querySelector(person.id.indexOf('member-')===0 ? '[data-member="'+person.id.slice(7)+'"]' : '#'+person.id);
    });
    var actorRigs=activity.people.map(function (person,i) {
      var config=i<PATROLS.length ? PATROLS[i] : TEAM[i-PATROLS.length];
      return global.WarehouseOperators.create(actorNodes[i],pt,person,{clothes:config.crew,ponytail:config.ponytail,task:config.task,seed:i*1.73});
    });
    var actorShadows=activity.people.map(function () {

      shadow.setAttribute('class','iso-person-shadow');shadow.setAttribute('rx','5');shadow.setAttribute('ry','2.7');
      mount.querySelector('#warehouse-moving-shadows').appendChild(shadow);

    var active = true;
    var motionQuery = global.matchMedia('(prefers-reduced-motion: reduce)');
    var greeting = document.createElement('div');
    greeting.className = 'twin__greeting';

    greeting.setAttribute('aria-live', 'polite');
    greeting.hidden = true;
    mount.appendChild(greeting);
    var chatterBubble = document.createElement('div');
    chatterBubble.className = 'twin__greeting twin__chatter';
    chatterBubble.setAttribute('aria-hidden', 'true');
    chatterBubble.hidden = true;
    mount.appendChild(chatterBubble);
    var chatter = null, chatterRemaining = 0, chatterTurns = 0;
    var nextChatter = 4000 + Math.random() * 4000;
    var spokenAt = TEAM.map(function () { return 0; });
    var lastPhrase = TEAM.map(function () { return -1; });
    var PHRASES = ['Hello!', 'Xin chào!', 'I love RMIT!'];
    var greeted = null;
    var greetingTimer = null;
    var greetingCount = TEAM.map(function (_, index) { return index % 3; });
    var frameId = 0, previousFrame = 0;
    var nameLayer = document.createElement('div');
    nameLayer.className = 'twin__crew-controls';
    var leaders = document.createElementNS('http://www.w3.org/2000/svg','svg');
    leaders.setAttribute('class','twin__person-leaders');
    leaders.setAttribute('aria-hidden','true');
    nameLayer.appendChild(leaders);
    mount.appendChild(nameLayer);
    var people = TEAM.map(function (member,index) {
      var group = mount.querySelector('[data-member="' + index + '"]');
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'twin__person';
      button.dataset.crewButton = index;
      button.innerHTML = '<span>' + escapeHtml(member.name) + '</span>';
      nameLayer.appendChild(button);
      var line = document.createElementNS('http://www.w3.org/2000/svg','line');
      leaders.appendChild(line);
      var person = {group:group,button:button,line:line,hover:false,focus:false};
      [group,button].forEach(function (target) {
        target.addEventListener('pointerenter', function (event) { if (event.pointerType === 'mouse') { person.hover = true; } });
        target.addEventListener('pointerleave', function () { person.hover = false; });
        target.addEventListener('focus', function () { person.focus = true; });
        target.addEventListener('blur', function () { person.focus = false; });
      });
      button.addEventListener('click', function () { sayHello(group); });
      button.addEventListener('keydown', function (event) { if (event.key === 'Escape') { closeGreeting(); } });
      return person;
    });

    var lastPeopleLayout=0,rigElapsed=actorNodes.map(function(){return 0;});
    function positionPeople() {
      var base = mount.getBoundingClientRect();
      if (!base.width || !base.height) { return; }
      var bodies = people.map(function (person) { return person.group.querySelector('.iso-member-hit').getBoundingClientRect(); });
      var blockers = bodies.map(function (b) { return {left:b.left,top:b.top,right:b.right,bottom:b.bottom,weight:1000}; }).concat(Array.from(mount.querySelectorAll('.iso-node-dot')).map(function (dot) {
        var b = dot.getBoundingClientRect();
        return {left:b.left-9,top:b.top-9,right:b.right+9,bottom:b.bottom+9,weight:1000};
      }));
      mount.querySelectorAll('.iso-rack-bank, [data-layout-area="gr"], .iso-l-table, .iso-wrapper, [data-layout-area="returnables"], .iso-freight-container').forEach(function (object) {
        blockers.push(object.getBoundingClientRect());
      });
      document.querySelectorAll('.stage-overlay h1, .stage-overlay .btn').forEach(function (control) { blockers.push(control.getBoundingClientRect()); });
      people.forEach(function (person,index) {
        var body = bodies[index], button = person.button;
        var cx = (body.left + body.right) / 2, cy = (body.top + body.bottom) / 2;
        button.hidden = body.right < base.left || body.left > base.right || body.bottom < base.top || body.top > base.bottom;
        person.line.style.display = button.hidden ? 'none' : '';
        if (button.hidden) { return; }
        var w = button.offsetWidth, h = button.offsetHeight;
        var candidates = [[cx-w/2,body.top-h-2], [body.right+3,cy-h/2], [body.left-w-3,cy-h/2],
          [cx-w/2,body.bottom+2], [body.right+8,body.top-h], [body.left-w-8,body.top-h]];
        // A compact map may need callouts farther from a figure. Search the
        // nearby free floor rather than letting a name steal another tap.
        for (var gy=base.top;gy<=base.bottom-h;gy+=h+2) {
          for (var gx=base.left;gx<=base.right-w;gx+=w+2) { candidates.push([gx,gy]); }
        }
        var held = person.hover || (person.focus && (button.matches(':focus-visible') || person.group.matches(':focus-visible'))) || greeted === person.group;
        var best = held && person.placement ? person.placement : null;
        if (!best) { candidates.forEach(function (candidate,rank) {
          var left = Math.max(base.left,Math.min(candidate[0],base.right-w));
          var top = Math.max(base.top,Math.min(candidate[1],base.bottom-h));
          var score = rank < 6 ? rank : 6 + Math.hypot(left+w/2-cx,top+h/2-cy) * .1;
          blockers.forEach(function (b) {
            score += Math.max(0,Math.min(left+w,b.right)-Math.max(left,b.left))
              * Math.max(0,Math.min(top+h,b.bottom)-Math.max(top,b.top)) * (b.weight || 1);
          });
          if (!best || score < best.score) { best = {left:left,top:top,right:left+w,bottom:top+h,score:score}; }
        }); }
        person.placement = best;
        button.style.left = (best.left-base.left) + 'px';
        button.style.top = (best.top-base.top) + 'px';
        person.line.setAttribute('x1',cx-base.left);
        person.line.setAttribute('y1',body.top-base.top);
        person.line.setAttribute('x2',Math.max(best.left+6,Math.min(cx,best.right-6))-base.left);
        person.line.setAttribute('y2',Math.max(best.top+8,Math.min(body.top,best.bottom-8))-base.top);
        best.weight = 1000;
        blockers.push(best);
      });
    }

    function requestFrame() {
      if (!frameId) { frameId = requestAnimationFrame(renderActivity); }
    }
    function renderActivity(now) {
      frameId = 0;
      if (!active || document.hidden) { previousFrame = 0; return; }
      var dt = previousFrame ? Math.max(0,Math.min(1000,now-previousFrame)) : 0;
      previousFrame = now;
      var outbound=activity.forklifts[1];
      var needsLane=!outbound.loadingOutbound && !activity.cargo().some(function(p){return p.owner==='truck-out';}) &&
        ((outbound.cargo && outbound.x>=68 && outbound.y>=18.5 && outbound.lift<2) || outbound.x>98);
      vehicles[0].holdDock(!still && activity.loading('receiving'));
      vehicles[1].holdDock(!still && activity.loading('shipping'));
      vehicles[1].clearLane(!still && !!needsLane);
      vehicles.forEach(function (vehicle) { vehicle.update(still); });
      activity.people.forEach(function (person,i) {
        var control=people[i-PATROLS.length];
        person.paused=!!control && (control.hover || (control.focus &&
          (control.button.matches(':focus-visible') || control.group.matches(':focus-visible'))) || greeted===control.group);
      });
      // Preserve elapsed time on slower devices, using small simulation steps
      // so collision checks and fork transfers never skip over their targets.
      if (!still) {
        for(var remaining=dt;remaining>0;) {
          var step=Math.min(100,remaining);
          activity.update(step/1000,{receiving:vehicles[0].state(),shipping:vehicles[1].state()});
          remaining-=step;
        }
      }
      activityRenderer.draw({dt:still ? 0 : dt,receiving:vehicles[0].state()});
      activity.people.forEach(function (person,i) {
        var node=actorNodes[i],origin=pt(person.home.x,person.home.y,0),position=pt(person.x,person.y,0);
        node.setAttribute('transform','translate('+(position[0]-origin[0])+','+(position[1]-origin[1])+')');
        node.dataset.planX=person.x.toFixed(2);node.dataset.planY=person.y.toFixed(2);
        node.dataset.yieldingTo=person.yieldTo || '';
        var foot=pt(person.x+.5,person.y+.3,.78);
        actorShadows[i].setAttribute('cx',foot[0]);actorShadows[i].setAttribute('cy',foot[1]);
        node.classList.toggle('is-walking',!still && person.walking);
        // The feet keep their distance-based phase. Joint meshes need only
        // 30 updates/second at this scale; world movement still follows RAF.
        rigElapsed[i]+=dt;
        if(still || rigElapsed[i]>=32 || !node.dataset.operatorAction) {
          actorRigs[i].draw(rigElapsed[i],still);rigElapsed[i]=0;
        }
        var before=null,parent=hall;
        if(person.y<28 && person.x<23) before=mount.querySelectorAll('[data-layout-area="putaway"]')[0];
        else if(person.y<28 && person.x<63) before=mount.querySelectorAll('[data-layout-area="putaway"]')[1];
        else if(person.y<28 && person.x>88) before=mount.querySelector('[data-container="shipping"]');
        else if(person.y<61) before=mount.querySelector('[data-layout-area="gr"]');
        else parent=teamLayer;
        var layer=before || parent;
        if(node.depthLayer!==layer) { parent.insertBefore(node,before);node.depthLayer=layer; }
      });
      // Label collision layout is substantially more expensive than moving
      // the SVG figures. Reflow it at 10 Hz while the scene keeps animating.
      if(!lastPeopleLayout || now-lastPeopleLayout>=100 || still) {positionPeople();lastPeopleLayout=now;}
      updateChatter(dt);
      if (!still) { requestFrame(); }
    }
    new ResizeObserver(requestFrame).observe(mount);

    function closeGreeting() {
      clearTimeout(greetingTimer);
      clearChatter();
      nextChatter = Math.max(nextChatter, 5000);
      if (greeted) { greeted.classList.remove('is-greeting'); }
      people.forEach(function (person) { person.button.classList.remove('is-greeting'); });
      greeted = null;
      greeting.hidden = true;
    }

    function clearChatter() {
      if (chatter) { chatter.group.classList.remove('is-speaking'); }
      chatter = null;
      chatterBubble.hidden = true;
    }

    function speechMarkup(index, phrase) {
      return '<strong>' + escapeHtml(TEAM[index].name) + '</strong><span>' + escapeHtml(phrase) + '</span>';
    }

    function updateChatter(dt) {
      // Ambient conversation shares the warehouse clock and never interrupts
      // a greeting, a station preview, map navigation, or a completed demo.
      if (still || greeted || camera.isDragging() || !tip.hidden || document.querySelector('.overlay.is-open')) {
        clearChatter();
        return;
      }
      if (chatter) {
        chatterRemaining -= dt;
        if (chatterRemaining <= 0 || chatter.button.hidden) { clearChatter(); }
        else { positionPopover(chatter.group.querySelector('.iso-member-hit'), chatterBubble); }
        return;
      }
      nextChatter -= dt;
      if (nextChatter > 0) { return; }
      var candidates = people.map(function (person, index) { return {person:person,index:index}; }).filter(function (candidate) {
        var person = candidate.person;
        if (person.button.hidden || person.hover || person.focus) { return false; }
        var box = person.group.querySelector('.iso-member-hit').getBoundingClientRect();
        var at = document.elementFromPoint((box.left + box.right) / 2, (box.top + box.bottom) / 2);
        return !!at && person.group.contains(at);

      if (!candidates.length) { nextChatter = 1500; return; }
      // Give each visible teammate a turn, with random ordering and timing.
      var earliest = Math.min.apply(null, candidates.map(function (c) { return spokenAt[c.index]; }));
      candidates = candidates.filter(function (c) { return spokenAt[c.index] === earliest; });
      var selected = candidates[Math.floor(Math.random() * candidates.length)];
      var index = selected.index;
      var choices = PHRASES.map(function (_, i) { return i; }).filter(function (i) { return i !== lastPhrase[index]; });
      var phrase = choices[Math.floor(Math.random() * choices.length)];
      lastPhrase[index] = phrase;
      spokenAt[index] = ++chatterTurns;
      chatter = selected.person;
      chatter.group.classList.add('is-speaking');
      chatterBubble.innerHTML = speechMarkup(index, PHRASES[phrase]);
      chatterBubble.hidden = false;
      chatterRemaining = 3200 + Math.random() * 800;
      nextChatter = 5000 + Math.random() * 5000;
      positionPopover(chatter.group.querySelector('.iso-member-hit'), chatterBubble);
    }

    function sayHello(group) {
      var index = Number(group.getAttribute('data-member'));
      if (!TEAM[index]) { return; }
      clearChatter();
      nextChatter = 10000 + Math.random() * 5000;
      closeGreeting();
      hideTip();
      var phrase = PHRASES[greetingCount[index]++ % PHRASES.length];
      greeting.innerHTML = speechMarkup(index, phrase);
      greeting.hidden = false;
      greeted = group;
      people.forEach(function (person) { person.button.classList.toggle('is-greeting',person.group === group); });
      void group.getBoundingClientRect();
      group.classList.add('is-greeting');
      group.dataset.greetingSerial=String(Number(group.dataset.greetingSerial || 0)+1);
      requestFrame();
      positionPopover(group.querySelector('.iso-member-body'), greeting);
      greetingTimer = setTimeout(closeGreeting, 3200);
    }

    mount.querySelectorAll('[data-member]').forEach(function (group) {
      group.addEventListener('click', function (event) { event.stopPropagation(); sayHello(group); });
      group.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          event.stopPropagation();
          sayHello(group);
        } else if (event.key === 'Escape') { closeGreeting(); }
      });
    });

    var camera = global.WarehouseCamera.create(mount, svg, {
      text: text,
      onMove: function () {
        hideTip(); closeGreeting(); clearChatter();
        nextChatter = 6000 + Math.random() * 4000;
        people.forEach(function (person) { person.placement = null; });
        requestFrame();
      }
    });

    function labelMembers() {
      mount.querySelectorAll('[data-member]').forEach(function (group) {
        group.setAttribute('aria-label', text('twin.greet', { name: TEAM[Number(group.getAttribute('data-member'))].name }));
      });
      people.forEach(function (person,index) { person.button.setAttribute('aria-label',text('twin.greet', {name:TEAM[index].name})); });
      camera.relabel();
    }
    labelMembers();

    // Keep the paths even without motion: their first point places each actor
    // on the floor. Omitting animateMotion left figures at the SVG origin.
    function syncMotion() {
      var paused = still || !active || document.hidden;
      mount.classList.toggle('is-still', Boolean(still));
      mount.classList.toggle('is-paused', Boolean(paused));
      if (paused) { svg.pauseAnimations(); }
      else { svg.unpauseAnimations(); }
      if (still) { svg.setCurrentTime(0); }
      if (paused) {
        clearChatter();
        cancelAnimationFrame(frameId); frameId = 0; previousFrame = 0;
      }
      if (active && !document.hidden) { requestFrame(); }
    }
    motionQuery.addEventListener('change', function (event) {
      still = event.matches;
      syncMotion();
    });
    document.addEventListener('visibilitychange', syncMotion);
    syncMotion();

    function showTip(group, app) {
      if (camera.isDragging()) { return; }
      if (!opts.describe) { return; }
      var info = opts.describe(app);
      if (!info) { return; }
      tip.className = 'twin__tip is-' + (NODES.map(function (n) { return n.app; }).indexOf(app) + 1)
        + (info.done ? ' is-done' : '');
      tip.innerHTML =
        '<span class="twin__tip-step">' + escapeHtml(info.step) + '</span>'
        + '<strong class="twin__tip-name">' + escapeHtml(info.name) + '</strong>'
        + '<span class="twin__tip-role">' + escapeHtml(info.role) + '</span>'
        + '<span class="twin__tip-go">' + escapeHtml(info.action) + '</span>';
      tip.hidden = false;
      tipGroup = group;
      positionTip(group);
    }

    function positionTip(group) {
      positionPopover(group.querySelector('.iso-node-dot'), tip);
    }

    function positionPopover(anchor, popover) {
      var box = anchor.getBoundingClientRect();
      var base = mount.getBoundingClientRect();
      var size = popover.getBoundingClientRect();
      var visible = view ? view.getBoundingClientRect() : { top: 0, bottom: global.innerHeight };
      var minTop = Math.max(12, visible.top - base.top + 12);
      var maxBottom = Math.min(base.height - 12, visible.bottom - base.top - 12);
      var center = box.left + box.width / 2 - base.left;
      var left = Math.max(12, Math.min(center - size.width / 2, base.width - size.width - 12));
      var top = box.top - base.top - size.height - 22;
      var below = top < minTop;
      if (below) { top = box.bottom - base.top + 22; }
      top = Math.max(minTop, Math.min(top, maxBottom - size.height));
      popover.classList.toggle('is-below', below);
      popover.style.left = left + 'px';
      popover.style.top = top + 'px';
      popover.style.setProperty('--tip-arrow', Math.max(16, Math.min(center - left, size.width - 16)) + 'px');
    }

    function hideTip() { tip.hidden = true; tipGroup = null; }

    if (view) {
      view.addEventListener('scroll', function () {
        if (tipGroup) { positionTip(tipGroup); }
      }, { passive: true });
    }

    // Floor targets sit below the equipment, so a tall rack or tote always
    // opens its own station instead of the floor projected behind it.
    mount.querySelectorAll('[data-area-app], [data-layout-area]').forEach(function (area) {
      var app = area.getAttribute('data-area-app') || area.getAttribute('data-layout-area');
      var marker = mount.querySelector('[data-node-app="' + app + '"]');
      if (!marker) { return; }
      area.addEventListener('pointerenter', function () { showTip(marker, app); });
      area.addEventListener('pointerleave', hideTip);
      area.addEventListener('click', function () {
        hideTip();
        if (opts.onNodeClick) { opts.onNodeClick(app); }
      });
    });

    mount.querySelectorAll('[data-node-app]').forEach(function (group) {
      var app = group.getAttribute('data-node-app');
      group.addEventListener('pointerenter', function () { showTip(group, app); });
      group.addEventListener('pointerleave', hideTip);
      group.addEventListener('focus', function () { showTip(group, app); });
      group.addEventListener('blur', hideTip);
      if (opts.onNodeClick) {
        group.addEventListener('click', function () { hideTip(); opts.onNodeClick(app); });
        group.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();

            opts.onNodeClick(app);
          }
        });
      }
    });

    window.addEventListener('resize', hideTip);

    return {
      /* Light the aisle up to the last finished node. */
      setActive: function (value) {

        syncMotion();
      },
      setProgress: function (doneApps) {
        mount.querySelectorAll('[data-node-app]').forEach(function (group) {
          group.classList.toggle('is-done', doneApps.indexOf(group.getAttribute('data-node-app')) !== -1);
        });
        var reached = 0;
        NODES.forEach(function (node, i) {
          if (doneApps.indexOf(node.app) !== -1) { reached = Math.max(reached, i + 1); }
        });

          done.style.strokeDasharray = '1000';
          done.style.strokeDashoffset = String(1000 - 1000 * fraction);
        }
      },
      hideTip: hideTip,
      members: function () { return TEAM.map(function (m) { return m.name; }); },

      /* The shipping lane runs continuously. Finishing the last station jumps
         the cycle to the moment the loaded truck pulls out, so the departure
         reads as a consequence of the pallet rather than a coincidence. */
      departTruck: function () {
        ['shipping'].forEach(function (id) {
          var node = document.getElementById(id);
          if (!node) { return; }
