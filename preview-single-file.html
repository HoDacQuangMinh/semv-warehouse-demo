          void node.getBoundingClientRect();
          node.style.animation = '';
          node.style.animationDelay = DEPART_AT;
        });
      },
      relabel: function (newLabels) {
        closeGreeting();
        labelMembers();
        mount.querySelector('[data-area-label="returnables"]').textContent = text('twin.returnables');
        mount.querySelector('.iso-building-sign').textContent = text('brand.name');
        NODES.forEach(function (node) {
          var group = mount.querySelector('[data-node-app="' + node.app + '"]');
          if (group) { group.setAttribute('aria-label', node.num + '. ' + newLabels[node.app]); }
        });
      }
    };
  }

  global.Twin = { create: create };
})(window);

</script>
<script>
/* js/router.js */
/* Full screen views with a forklift transition between them.
   Only one view is in the document flow at a time, so nothing scrolls to reach
   another station. The truck drives across pushing a curtain; the view is
   swapped behind the curtain at the halfway point, so the change is never
   seen. */

(function (global) {
  'use strict';

  var TRANSITION_MS = 1700;
  var SWAP_AT = 780;

  var current = 'home';
  var busy = false;
  var listeners = [];
  var swapTimer = null;
  var finishTimer = null;

  function valid(id) {
    var view = document.getElementById('view-' + id);
    return !!view && view.classList.contains('view');
  }

  // Fragments work both on a web server and in the offline single-file demo.
  function locationView() {
    var id = location.hash.slice(1).replace(/^view-/, '');
    return valid(id) ? id : 'home';
  }

  function record(id, replace) {
    var state = Object.assign({}, history.state, { warehouseView: id });
    history[replace ? 'replaceState' : 'pushState'](state, '', '#' + id);
  }

  function cancelTransition() {
    clearTimeout(swapTimer);
    clearTimeout(finishTimer);
    swapTimer = finishTimer = null;
    var layer = document.getElementById('transition');
    layer.classList.remove('is-running');
    layer.hidden = true;
    layer.innerHTML = '';
    busy = false;
  }

  function cancelHandoff() {
    if (global.WarehouseHandoff && global.WarehouseHandoff.isActive()) {
      global.WarehouseHandoff.cancel();
    }
  }

  function restore(force) {
    var id = locationView();
    var interrupted = busy || (global.WarehouseHandoff && global.WarehouseHandoff.isActive());
    cancelTransition();
    cancelHandoff();
    if (location.hash !== '#' + id) { record(id, true); }
    if (force || interrupted || id !== current) { apply(id); }
  }

  function views() {
    return Array.prototype.slice.call(document.querySelectorAll('.view'));
  }

  function apply(id) {
    views().forEach(function (view) {
      var active = view.id === 'view-' + id;
      view.classList.toggle('is-active', active);
      view.hidden = !active;
    });
    document.body.setAttribute('data-view', id);
    document.querySelectorAll('.topbar__nav [data-goto]').forEach(function (link) {
      if (link.getAttribute('data-goto') === id) { link.setAttribute('aria-current', 'page'); }
      else { link.removeAttribute('aria-current'); }
    });
    current = id;
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
    var heading = document.querySelector('#view-' + id + ' [data-view-heading], #view-' + id + ' h1');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
    listeners.forEach(function (fn) { fn(id); });
  }

  function go(id, options) {
    var opts = options || {};
    if (!valid(id) || (busy && !opts.instant)) { return; }
    if (busy) { cancelTransition(); }
    cancelHandoff();
    if (id === current && locationView() === id) { return; }
    record(id, !!opts.replace);

    if (opts.instant || global.Forklift.prefersReducedMotion()) {
      apply(id);
      return;
    }

    busy = true;
    var layer = document.getElementById('transition');
    layer.innerHTML =
      '<div class="transition__curtain"></div>'
      + '<div class="transition__truck">' + global.TransitionForklift.markup() + '</div>';
    layer.hidden = false;
    void layer.offsetWidth;
    layer.classList.add('is-running');

    swapTimer = setTimeout(function () { apply(id); }, SWAP_AT);
    finishTimer = setTimeout(cancelTransition, TRANSITION_MS);
  }

  function init() {
    document.addEventListener('click', function (event) {
      var link = event.target.closest('[data-goto]');
      if (!link) { return; }
      if (event.button || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) { return; }
      event.preventDefault();
      go(link.getAttribute('data-goto'));
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && current !== 'home') {
        var overlay = document.getElementById('finale');
        if (overlay && !overlay.hidden) { return; }
        go('home');
      }
    });

    global.addEventListener('popstate', function () { restore(false); });
    global.addEventListener('hashchange', function () { restore(false); });
    // Returning from another document can restore a suspended animation from
    // the browser cache. Clear transient layers and resume the active view.
    global.addEventListener('pagehide', function () { cancelTransition(); cancelHandoff(); });
    global.addEventListener('pageshow', function (event) { if (event.persisted) { restore(true); } });

    var initial = locationView();
    record(initial, true);
    apply(initial);
  }

  global.Router = {
    init: init,
    go: go,
    current: function () { return current; },
    onChange: function (fn) { listeners.push(fn); }
  };
})(window);

</script>
<script>
/* js/challenge.js */
/* The manual challenge, web version. Match cartons to docket lines by hand,
   against a clock, with two discrepancies planted. */

(function (global) {
  'use strict';

  var t = function (key, vars) { return global.I18N.t(key, vars); };

  var LINES = [
    { id: 'L1', item: 'SE-A4021-88', qty: 24 },
    { id: 'L2', item: 'SE-B1190-04', qty: 12 },
    { id: 'L3', item: 'SE-C7745-20', qty: 30 },
    { id: 'L4', item: 'SE-D3308-11', qty: 6 }
  ];

  // Two of these do not agree with the docket: BX-00004 is short by two units
  // and BX-00002 carries a transposed item code.
  var CARTONS = [
    { code: 'BX-00003', item: 'SE-C7745-20', qty: 30, line: 'L3', bad: false },
    { code: 'BX-00002', item: 'SE-B1190-40', qty: 12, line: 'L2', bad: true },
    { code: 'BX-00004', item: 'SE-D3308-11', qty: 4, line: 'L4', bad: true },
    { code: 'BX-00001', item: 'SE-A4021-88', qty: 24, line: 'L1', bad: false }
  ];

  function esc(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function clock(ms) {
    var total = Math.round(ms / 1000);
    var mins = Math.floor(total / 60);
    var secs = total % 60;
    return mins + ':' + (secs < 10 ? '0' : '') + secs;
  }

  function create(mount) {
    var s = {
      phase: 'idle',
      startedAt: 0,
      elapsed: 0,
      picked: null,
      flagMode: false,
      assigned: {},
      message: null
    };
    var ticker = null;
    var active=false,lastTick=0;
    function focus(selector) { var node=mount.querySelector(selector);if(node)node.focus({preventScroll:true}); }
    function syncClock() {
      clearInterval(ticker);ticker=null;lastTick=Date.now();
      if(active && !document.hidden && s.phase==='play') ticker=setInterval(tick,250);
    }
    document.addEventListener('visibilitychange',syncClock);

    function assignedCount() { return Object.keys(s.assigned).length; }

    function missedCount() {
      return CARTONS.filter(function (carton) {
        var record = s.assigned[carton.code];
        return carton.bad && (!record || !record.flagged);
      }).length;
    }

    function render() {
      if (s.phase === 'idle') {
        mount.innerHTML =
          '<div class="ch ch--idle">'
          + '<button class="btn btn-primary" type="button" data-act="start">' + esc(t('challenge.start')) + '</button>'
          + '</div>';
        return;
      }

      if (s.phase === 'done') {
        var missed = missedCount();
        var score=CARTONS.filter(function(c){return s.assigned[c.code].flagged===c.bad;}).length;
        var review=CARTONS.map(function(c){
          var correct=s.assigned[c.code].flagged===c.bad;
          return '<li class="'+(correct?'is-good':'')+'"><strong>'+esc(c.code)+' · '+esc(correct?t('challenge.correct'):t('challenge.flag'))+'</strong>'
            +esc(t(c.code==='BX-00002'?'challenge.error.item':c.code==='BX-00004'?'challenge.error.qty':'challenge.error.clear'))+'</li>';
        }).join('');
        mount.innerHTML =
          '<div class="ch ch--result">'
          + '<h3>' + esc(t('challenge.done.title')) + '</h3>'
          + '<p class="ch__verdict">' + esc(t('challenge.done.time', { time: clock(s.elapsed) })) + '</p>'
          + '<p class="ch__verdict ' + (missed ? 'is-bad' : 'is-good') + '">'
          +   esc(missed ? t('challenge.done.missed', { n: missed }) : t('challenge.done.caught'))
          + '</p>'
          + '<p><strong>' + esc(t('challenge.score',{n:score})) + '</strong></p><ul class="ch__review">'+review+'</ul>'
          + '<p>' + esc(t('challenge.done.note')) + '</p>'
          + '<button class="btn btn-primary" type="button" data-goto="gr">'+esc(t('gr.name'))+'</button> '
          + '<button class="btn btn-ghost" type="button" data-act="reset">' + esc(t('challenge.reset')) + '</button>'
          + '</div>';
        return;
      }

      var boxes = CARTONS.map(function (carton) {
        var record = s.assigned[carton.code];
        var cls = 'ch-box';
        if (record) { cls += record.flagged ? ' is-flagged' : ' is-matched'; }
        if (s.picked === carton.code) { cls += ' is-picked'; }
        return '<button class="' + cls + '" type="button" data-carton="' + carton.code + '"' + (record ? ' disabled' : '') + '>'
          + '<span class="ch-box__code mono">' + esc(carton.code) + '</span>'
          + '<span class="ch-box__item mono">' + esc(carton.item) + '</span>'
          + '<span class="ch-box__qty mono">' + carton.qty + '</span>'
          + '</button>';
      }).join('');

      var rows = LINES.map(function (line) {
        var taken = Object.keys(s.assigned).some(function (code) { return s.assigned[code].line === line.id; });
        return '<button class="ch-line' + (taken ? ' is-taken' : '') + '" type="button" data-line="' + line.id + '"'
          + (taken || !s.picked ? ' disabled' : '') + '>'
          + '<span class="mono">' + esc(line.id) + '</span>'
          + '<span class="mono">' + esc(line.item) + '</span>'
          + '<span class="mono">' + line.qty + '</span>'
          + '</button>';
      }).join('');

      mount.innerHTML =
        '<div class="ch">'
        + '<div class="ch__bar">'
        +   '<span class="ch__time mono" data-time>' + esc(t('challenge.time')) + ' ' + clock(s.elapsed) + '</span>'
        +   '<button class="btn-flag' + (s.flagMode ? ' is-on' : '') + '" type="button" data-act="flag" aria-pressed="'+s.flagMode+'">'
        +     esc(t(s.flagMode ? 'challenge.flagged' : 'challenge.flag')) + '</button>'
        + '</div>'
        + '<p class="ch__hint" role="status">' + esc(s.message || t('challenge.pick')) + '</p>'
        + '<div class="ch__grid">'
        +   '<div><p class="ch__cap">' + esc(t('challenge.boxes')) + '</p><div class="ch__boxes">' + boxes + '</div></div>'
        +   '<div><p class="ch__cap">' + esc(t('challenge.paper')) + '</p><div class="ch__paper">' + rows + '</div></div>'
        + '</div>'
        + '</div>';
    }

    function tick() {
      var now=Date.now();
      if(active && !document.hidden && s.phase==='play') s.elapsed+=now-lastTick;
      lastTick=now;
      var node = mount.querySelector('[data-time]');
      if (node) { node.textContent = t('challenge.time') + ' ' + clock(s.elapsed); }
    }

    function start() {
      s.phase = 'play';
      s.startedAt = Date.now();
      s.elapsed = 0;
      s.assigned = {};
      s.picked = null;
      s.flagMode = false;
      s.message = null;
      render();
      syncClock();focus('[data-carton]:not(:disabled)');
    }

    function stop() {
      clearInterval(ticker);
      ticker = null;
      tick();
      s.phase = 'done';
      render();
      mount.querySelector('h3').tabIndex=-1;focus('h3');
    }

    mount.addEventListener('click', function (event) {
      var act = event.target.closest('[data-act]');
      if (act) {
        var name = act.getAttribute('data-act');
        if (name === 'start') { start(); return; }
        if (name === 'reset') { s.phase = 'idle'; syncClock();render();focus('[data-act=start]');return; }
        if (name === 'flag') { s.flagMode = !s.flagMode; render();focus('[data-act=flag]');return; }
      }

      var box = event.target.closest('[data-carton]');
      if (box && !box.disabled) {
        s.picked = box.getAttribute('data-carton');
        s.message = t('challenge.picked', { code: s.picked });
        render();
        focus('[data-act=flag]');
        return;
      }

      var line = event.target.closest('[data-line]');
      if (line && !line.disabled && s.picked) {
        if(CARTONS.find(function(c){return c.code===s.picked;}).line!==line.dataset.line) {
          s.message=t('challenge.wrongLine');render();focus('[data-line="'+line.dataset.line+'"]');return;
        }
        s.assigned[s.picked] = { line: line.getAttribute('data-line'), flagged: s.flagMode };
        s.message = t('challenge.matched', { code: s.picked });
        s.picked = null;
        s.flagMode=false;
        if (assignedCount() === CARTONS.length) { stop(); return; }
        render();
        focus('[data-carton]:not(:disabled)');
      }
    });

    return {
      render: render,
      setActive:function(value){tick();active=value;syncClock();},
      reset: function () { clearInterval(ticker); s.phase = 'idle'; render(); }
    };
  }

  global.Challenge = { create: create };
})(window);

</script>
<script>
/* js/demos.js */
/* The three app simulations.
   Goods Received and Pallet Interlocking follow the real systems described in
   the two architecture maps: an inbound supplier receipt posted to SAP, and an
   outbound pallet verified two labels per carton against its packing list.
   PutAway is illustrative and marked as such, since no specification exists. */

(function (global) {
  'use strict';

  var t = function (key, vars) { return global.I18N.t(key, vars); };

  function esc(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function barcodeBars(seed, count) {
    var out = '';
    var value = seed;
    for (var i = 0; i < count; i++) {
      value = (value * 1103515245 + 12345) % 2147483648;
      out += '<i style="width:' + (1 + (value % 3)) + 'px"></i>';
    }
    return out;
  }

  function scanner(code, flashing, idleKey) {
    return '<div class="scanner' + (flashing ? ' is-scanning' : '') + '">'
      + (code
        ? '<div class="scanner__bars">' + barcodeBars(code.length + 7, 26) + '</div>'
          + '<span class="scanner__code' + (flashing ? ' is-in' : '') + '">' + esc(code) + '</span>'
        : '<span class="scanner__idle">' + esc(t(idleKey)) + '</span>')
      + '</div>';
  }

  function field(labelKey, value, emptyKey) {
    var set = value !== null && value !== undefined && value !== '';
    return '<div class="field"><span class="field__label">' + esc(t(labelKey)) + '</span>'
      + '<span class="field__value ' + (set ? 'is-set' : 'is-empty') + '">'
      + esc(set ? value : t(emptyKey)) + '</span></div>';
  }

  /* ---------------------------------------------------------- Goods Received */

  var GR_LINES = [
    { material: 'C2030-WE', po: '4500912 / 10', spq: 24, boxes: 2 },
    { material: 'A9F5-BL', po: '4500912 / 20', spq: 24, boxes: 1 }
  ];
  /* What the supplier takes back on the same truck. Types are the real
     returnable codes from the box master. */
  var GR_EMPTIES = [
    { code: 'S00', qty: 12 },
    { code: 'K03', qty: 8 },
    { code: 'WPALLET', qty: 2 }
  ];
  var GR_SIGNS = ['receiver', 'guard', 'leader'];

  var GR_BOXES = [
    { sscc: '589352611036539718', line: 0 },
    { sscc: '589352611036539725', line: 0 },
    { sscc: '589352611036539732', line: 1 }
  ];

  function GoodsReceived(mount, onComplete) {
    var s;

    function reset() {
      s = { step: 1, session: null, docket: null, scanned: [], last: null, note: null, flash: false,
            empties: [], noteRef: null, signed: [] };
    }
    reset();

    function receivedOn(index) {
      return s.scanned.filter(function (b) { return b.line === index; }).length;
    }

    function render() {
      var steps = [1, 2, 3, 4, 5].map(function (n) {
        var cls = 'scr__step' + (n === s.step ? ' is-active' : '') + (n < s.step ? ' is-done' : '');
        return '<span class="' + cls + '">' + esc(t('gr.step.' + n)) + '</span>';
      }).join('');

      var lines = s.step === 5 ? s.empties.map(function (e) {
        return '<div class="line">'
          + '<span class="line__code">' + esc(e.code) + '</span>'
          + '<span class="line__qty">' + esc(t('gr.col.boxtype')) + '</span>'
          + '<span class="line__state">' + e.qty + '</span>'
          + '</div>';
      }).join('') : s.docket ? GR_LINES.map(function (line, index) {
        var got = receivedOn(index) * line.spq;
        var want = line.boxes * line.spq;
        return '<div class="line">'
          + '<span class="line__code">' + esc(line.material) + '</span>'
          + '<span class="line__qty">' + esc(line.po) + '</span>'
          + '<span class="line__state' + (got >= want ? '' : ' is-part') + '">' + got + ' / ' + want + '</span>'
          + '</div>';
      }).join('') : '';

      var actions = '';
      if (s.step === 1) {
        actions = '<button class="btn-screen" type="button" data-act="open">' + esc(t('gr.btn.open')) + '</button>';
      } else if (s.step === 2) {
        actions = '<button class="btn-screen" type="button" data-act="docket">' + esc(t('gr.btn.scanDo')) + '</button>';
      } else if (s.step === 3) {
        actions = '<button class="btn-screen" type="button" data-act="box">' + esc(t('gr.btn.scanBox')) + '</button>';
        if (s.scanned.length) {
          actions += '<button class="btn-screen-alt" type="button" data-act="dup">' + esc(t('gr.btn.rescan')) + '</button>';
        }
      } else if (s.step === 4) {
        actions = '<button class="btn-screen" type="button" data-act="finalize">' + esc(t('gr.btn.finalize')) + '</button>';
      } else if (s.empties.length < GR_EMPTIES.length) {
        actions = '<button class="btn-screen" type="button" data-act="empty">' + esc(t('gr.btn.empties')) + '</button>';
      } else if (!s.noteRef) {
        actions = '<button class="btn-screen" type="button" data-act="note">' + esc(t('gr.btn.note')) + '</button>';
      } else {
        actions = '<button class="btn-screen" type="button" data-act="sign">' + esc(t('gr.btn.sign')) + '</button>';
      }

      var signatures = s.noteRef
        ? '<div class="sigs">' + GR_SIGNS.map(function (role) {
            var done = s.signed.indexOf(role) !== -1;
            return '<span class="sig' + (done ? ' is-signed' : '') + '">'
              + '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
              + (done
                ? '<path d="M3 8.4l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
                : '<circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.6"/>')
              + '</svg>' + esc(t('gr.sig.' + role))
              + '</span>';
          }).join('') + '</div>'
        : '';

      mount.innerHTML =
        '<div class="scr">'
        + '<div class="scr__steps">' + steps + '</div>'
        + '<div class="scr__body">'
        +   field('gr.f.session', s.session, 'gr.empty')
        +   field('gr.f.supplier', s.session ? 'SOVI' : '', 'gr.empty')
        +   field('gr.f.truck', s.session ? '51D-97647' : '', 'gr.empty')
        +   field('gr.f.do', s.docket, 'gr.empty')
        +   scanner(s.last, s.flash, 'gr.scan.idle')
        +   (s.note ? '<p class="scr__note' + (s.note.bad ? ' is-bad' : '') + '">' + esc(s.note.text) + '</p>' : '')
        +   (s.step === 5 ? field('gr.f.note', s.noteRef, 'gr.empty') : '')
        +   '<div class="lines">' + lines + '</div>'
        +   signatures
        + '</div>'
        + '<div class="scr__foot"><p class="scr__hint">'
        +   esc(t('gr.hint.' + (s.step === 5 && s.noteRef ? 6 : s.step))) + '</p>' + actions + '</div>'
        + '</div>';

      s.flash = false;
    }

    mount.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-act]');
      if (!btn) { return; }
      var act = btn.getAttribute('data-act');
      s.note = null;

      if (act === 'open') {
        s.session = 'GR-2601-0148';
        s.step = 2;
      } else if (act === 'docket') {
        s.docket = 'DO-88413';
        s.last = 'DO-88413';
        s.flash = true;
        s.step = 3;
      } else if (act === 'box') {
        var next = GR_BOXES[s.scanned.length];
        if (!next) { return; }
        s.scanned.push(next);
        s.last = next.sscc;
        s.flash = true;
        if (s.scanned.length === GR_BOXES.length) { s.step = 4; }
      } else if (act === 'dup') {
        s.last = s.scanned[s.scanned.length - 1].sscc;
        s.flash = true;
        s.note = { text: t('gr.msg.dup'), bad: true };
      } else if (act === 'finalize') {
        s.step = 5;
      } else if (act === 'empty') {
        var next = GR_EMPTIES[s.empties.length];
        if (!next) { return; }
        s.empties.push(next);
        s.last = next.code;
        s.flash = true;
      } else if (act === 'note') {
        s.noteRef = 'RN-2601-0219';
        s.note = { text: t('gr.msg.note'), bad: false };
      } else if (act === 'sign') {
        s.signed.push(GR_SIGNS[s.signed.length]);
        if (s.signed.length === GR_SIGNS.length) {
          s.note = { text: t('gr.msg.signed'), bad: false };
          render();
          var completedState=s;
          setTimeout(function(){if(s===completedState)onComplete();}, 550);
          return;
        }
      }
      render();
    });

    return { render: render, reset: function () { reset(); render(); } };
  }

  /* ------------------------------------------------------ Pallet Interlocking */

  var PALLET_HU = '689352611035827974';
  var PACKING_LIST = [
    { box: '589352611036539718', ean: '19311554004511', product: 'C2030-WE' },
    { box: '589352611036539725', ean: '19311554004528', product: 'C2030-WE' },
    { box: '589352611036539732', ean: '19311554004535', product: 'A9F5-BL' }
  ];
  var WRONG_EAN = '19311554009999';

  function Interlocking(mount, onComplete) {
    var s;

    function reset() {
      s = { pallet: null, done: [], pending: null, last: null, status: null, flash: false, green: false };
    }
    reset();

    function isDone(box) { return s.done.indexOf(box) !== -1; }
    function nextBox() {
      for (var i = 0; i < PACKING_LIST.length; i++) {
        if (!isDone(PACKING_LIST[i].box)) { return PACKING_LIST[i]; }
      }
      return null;
    }

    function render() {
      var step = !s.pallet ? 1 : (s.done.length === PACKING_LIST.length ? 3 : 2);
      var steps = [1, 2, 3].map(function (n) {
        var cls = 'scr__step' + (n === step ? ' is-active' : '') + (n < step ? ' is-done' : '');
        return '<span class="' + cls + '">' + esc(t('il.step.' + n)) + '</span>';
      }).join('');

      var rows = s.pallet ? PACKING_LIST.map(function (item) {
        var state = isDone(item.box) ? 'done' : (s.pending === item.box ? 'await' : 'pending');
        return '<div class="line' + (state === 'done' ? '' : ' is-held') + '">'
          + '<span class="line__code">' + esc(item.box.slice(-8)) + '</span>'
          + '<span class="line__qty">' + esc(item.product) + '</span>'
          + '<span class="line__state">' + esc(t('il.state.' + state)) + '</span>'
          + '</div>';
      }).join('') : '';

      var actions = '';
      if (!s.pallet) {
        actions = '<button class="btn-screen" type="button" data-act="pallet">' + esc(t('il.btn.scanPallet')) + '</button>';
      } else if (s.done.length < PACKING_LIST.length) {
        actions = s.pending
          ? '<button class="btn-screen" type="button" data-act="ean">' + esc(t('il.btn.scanEan')) + '</button>'
            + '<button class="btn-screen-alt" type="button" data-act="wrong">' + esc(t('il.btn.wrong')) + '</button>'
          : '<button class="btn-screen" type="button" data-act="hu2">' + esc(t('il.btn.scanHu2')) + '</button>';
      } else {
        actions = '<button class="btn-screen" type="button" data-act="green">' + esc(t('il.btn.green')) + '</button>';
      }

      mount.innerHTML =
        '<div class="scr">'
        + '<div class="scr__steps">' + steps + '</div>'
        + '<div class="scr__body">'
        +   field('il.f.pallet', s.pallet, 'il.empty')
        +   '<div class="field"><span class="field__label">' + esc(t('il.f.progress')) + '</span>'
        +     '<span class="field__value">' + s.done.length + ' / ' + PACKING_LIST.length + '</span></div>'
        +   scanner(s.last, s.flash, 'gr.scan.idle')
        +   (s.status ? '<p class="scr__note' + (s.status.bad ? ' is-bad' : '') + '">' + esc(s.status.text) + '</p>' : '')
        +   '<div class="lines">' + rows + '</div>'
        + '</div>'
        + '<div class="scr__foot"><p class="scr__hint">' + esc(t('il.hint.' + step)) + '</p>' + actions + '</div>'
        + '</div>';

      s.flash = false;
    }

    mount.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-act]');
      if (!btn) { return; }
      var act = btn.getAttribute('data-act');

      if (act === 'pallet') {
        s.pallet = PALLET_HU;
        s.last = PALLET_HU;
        s.flash = true;
        s.status = null;
      } else if (act === 'hu2') {
        var item = nextBox();
        if (!item) { return; }
        s.pending = item.box;
        s.last = item.box;
        s.flash = true;
        s.status = { text: t('il.st.await'), bad: false };
      } else if (act === 'ean') {
        var match = PACKING_LIST.filter(function (x) { return x.box === s.pending; })[0];
        s.done.push(match.box);
        s.pending = null;
        s.last = match.ean;
        s.flash = true;
        s.status = { text: t('il.st.200'), bad: false };
      } else if (act === 'wrong') {
        s.last = WRONG_EAN;
        s.flash = true;
        s.status = { text: t('il.st.401'), bad: true };
      } else if (act === 'green') {
        if (s.done.length < PACKING_LIST.length) {
          s.status = { text: t('il.green.blocked'), bad: true };
          render();
          return;
        }
        s.green = true;
        onComplete();
        return;
      }
      render();
    });

    return { render: render, reset: function () { reset(); render(); } };
  }

  /* ------------------------------------------------------------------ PutAway */

  var OCCUPIED = ['A-01-01', 'A-02-01', 'A-05-01', 'A-01-03', 'A-04-03'];
  var SUGGESTED = 'A-03-02';

  function PutAway(mount, onComplete) {
    var s = { pallet: null, selected: null, justPlaced: false, flash: false };

    function render() {
      var bins = '';
      for (var level = 3; level >= 1; level--) {
        for (var bay = 1; bay <= 5; bay++) {
          var code = 'A-0' + bay + '-0' + level;
          var occupied = OCCUPIED.indexOf(code) !== -1;
          var cls = 'bin';
          if (occupied) { cls += ' is-occupied'; }
          if (!occupied && s.pallet && code === SUGGESTED && s.selected !== code) { cls += ' is-suggested'; }
          if (s.selected === code) { cls += ' is-selected'; }
          bins += '<button class="' + cls + '" type="button" data-bin="' + code + '"'
            + (occupied || !s.pallet ? ' disabled' : '') + '>' + code
            + (s.selected === code ? '<span class="bin__pallet' + (s.justPlaced ? ' is-in' : '') + '"></span>' : '')
            + '</button>';
        }
      }

      var hint = !s.pallet ? 'pa.hint.1' : (s.selected ? 'pa.hint.3' : 'pa.hint.2');
      var action = !s.pallet
        ? '<button class="btn-screen" type="button" data-act="scan">' + esc(t('pa.btn.scan')) + '</button>'
        : '<button class="btn-screen" type="button" data-act="confirm"' + (s.selected ? '' : ' disabled') + '>'
          + esc(t('pa.btn.confirm')) + '</button>';

      mount.innerHTML =
        '<div class="scr">'
        + '<div class="scr__body">'
        +   field('pa.f.pallet', s.pallet, 'pa.empty')
        +   field('pa.f.bin', s.selected, 'pa.empty')
        +   scanner(s.pallet, s.flash, 'gr.scan.idle')
        +   '<div class="rack">' + bins + '</div>'
        +   '<div class="rack__legend">'
        +     '<span><i></i>' + esc(t('pa.legend.free')) + '</span>'
        +     '<span class="k-suggest"><i></i>' + esc(t('pa.legend.suggested')) + '</span>'
        +     '<span><i class="k-taken"></i>' + esc(t('pa.legend.taken')) + '</span>'
        +   '</div>'
        + '</div>'
        + '<div class="scr__foot"><p class="scr__hint">' + esc(t(hint)) + '</p>' + action + '</div>'
        + '</div>';

      s.flash = false;
      s.justPlaced = false;
    }

    mount.addEventListener('click', function (event) {
      var bin = event.target.closest('[data-bin]');
      if (bin && !bin.disabled) {
        s.selected = bin.getAttribute('data-bin');
        s.justPlaced = true;
        render();
        return;
      }
      var btn = event.target.closest('[data-act]');
      if (!btn || btn.disabled) { return; }
      if (btn.getAttribute('data-act') === 'scan') {
        s.pallet = 'PL-004182';
        s.flash = true;
        render();
      } else if (btn.getAttribute('data-act') === 'confirm') {
        onComplete(s.selected);
      }
    });

    return {
      render: render,
      reset: function () {
        s = { pallet: null, selected: null, justPlaced: false, flash: false };
        render();
      }
    };
  }

  global.Demos = {
    create: function (app, mount, onComplete) {
      if (app === 'gr') { return GoodsReceived(mount, onComplete); }
      if (app === 'interlock') { return Interlocking(mount, onComplete); }
      if (app === 'putaway') { return PutAway(mount, onComplete); }
      return null;
    },
    suggestedBin: SUGGESTED
  };
})(window);

<script>
/* js/main.js */
/* Wiring: theme, language, the opening sequence, the hero scan, the three
   stations, the flow board and the finale. */

(function () {
  'use strict';

  var t = function (key, vars) { return window.I18N.t(key, vars); };
  var State = window.WarehouseState;

  var demos = {};
  var challenge = null;
  var lastBin = window.Demos.suggestedBin;
  var hero = null;
  var handoffBusy=false;

  /* ------------------------------------------------------------- Theme */

  function initTheme() {
    var toggle = document.getElementById('theme-toggle');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');

    toggle.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var toggle = document.getElementById('theme-toggle');
    var label = document.getElementById('theme-label');
    toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    label.setAttribute('data-i18n', theme === 'dark' ? 'theme.toLight' : 'theme.toDark');
    label.textContent = t(theme === 'dark' ? 'theme.toLight' : 'theme.toDark');
    syncToolLabels();
  }

  /* The two header buttons drop their visible labels on narrow screens, where
     there is no room for them beside the brand. Mirror whatever the label
     currently says onto aria-label so the button keeps its name either way. */
  function syncToolLabels() {
    ['theme-toggle', 'lang-toggle'].forEach(function (id) {
      var btn = document.getElementById(id);
      if (!btn) { return; }
      var span = btn.querySelector('span');
      if (span && span.textContent.trim()) { btn.setAttribute('aria-label', span.textContent.trim()); }
    });
  }

  /* ---------------------------------------------------------- Language */

  function initLanguage() {
    document.getElementById('lang-toggle').addEventListener('click', function () {
      window.I18N.setLanguage(window.I18N.getLanguage() === 'vi' ? 'en' : 'vi');
    });

    document.addEventListener('languagechange', function () {
      Object.keys(demos).forEach(function (key) { demos[key].render(); });
      if (challenge) { challenge.render(); }
      buildTeam();
      updateProgressLabel();
      updateFinaleBody();
      setTheme(document.documentElement.getAttribute('data-theme'));
      if (hero) { hero.relabel(); }
      if (twin) { twin.relabel(appLabels()); twin.hideTip(); }
      syncToolLabels();
      paintBoard();
    });
  }

  /* -------------------------------------------------------- Hero scan */

  function drawCartonLabel() {
    var bars = document.getElementById('carton-bars');
    var matrix = document.getElementById('carton-matrix');
    var out = '';
    var x = 166;
    var seed = 7;
    for (var i = 0; i < 22 && x < 214; i++) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      var w = 1 + (seed % 3);
      out += '<rect x="' + x + '" y="96" width="' + w + '" height="26"/>';
      x += w + 1 + (seed % 2);
    }
    bars.innerHTML = out;

    // A stylised data matrix. It is a graphic, not a readable code.
    var cells = '';
    var value = 91;
    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 8; col++) {
        value = (value * 1103515245 + 12345) % 2147483648;
        var on = (row === 0 || col === 0 || row === 7 || col === 7)
          ? ((row + col) % 2 === 0)
          : (value % 100 > 46);
        if (on) {
          cells += '<rect x="' + (222 + col * 5) + '" y="' + (96 + row * 5) + '" width="4.4" height="4.4"/>';
        }
      }
    }
    matrix.innerHTML = cells;
  }

  function initHeroScan() {
    var btn = document.getElementById('scan-btn');
    var beam = document.getElementById('scan-beam');
    var status = document.getElementById('scan-status');
    var out = document.getElementById('scan-out');
    var scanned = false;
    var idleTimer = null;

    function sweep() {
      beam.classList.remove('is-on');
      void beam.offsetWidth;
      beam.classList.add('is-on');
    }

    function reveal() {
      scanned = true;
      stopIdle();
      status.setAttribute('data-i18n', 'hero.state.ok');
      status.textContent = t('hero.state.ok');
      status.classList.add('is-verified');
      out.hidden = false;
      out.innerHTML = [
        ['hero.f.asset', 'BX-00001'],
        ['hero.f.item', 'SE-A4021-88'],
        ['hero.f.po', 'PO-4500912'],
        ['hero.f.qty', '24'],
        ['hero.f.state', t('hero.state.ok')]
      ].map(function (pair, i) {
        return '<div class="scanbox__row" style="animation-delay:' + (i * 55) + 'ms">'
          + '<dt>' + t(pair[0]) + '</dt><dd class="mono">' + pair[1] + '</dd></div>';
      }).join('');
      btn.setAttribute('data-i18n', 'hero.again');
      btn.textContent = t('hero.again');
    }

    var reticle = document.querySelector('.reticle');

    function startIdle() {
      if (reticle && !window.Forklift.prefersReducedMotion()) { reticle.classList.add('is-live'); }
      // The label keeps catching the light until someone scans it. It stops
      // for good on the first tap, and never runs under reduced motion.
      if (window.Forklift.prefersReducedMotion()) { return; }
      stopIdle();
      idleTimer = setInterval(function () {
        if (!scanned) { sweep(); }
      }, 6000);
    }

    function stopIdle() {
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
      if (reticle) { reticle.classList.remove('is-live'); }
    }

    btn.addEventListener('click', function () {
      stopIdle();
      if (window.Forklift.prefersReducedMotion()) { reveal(); return; }
      status.textContent = t('hero.scanning');
      sweep();
      btn.disabled = true;
      setTimeout(function () {
        btn.disabled = false;
        reveal();
      }, 700);
    });

    hero = {
      sweep: sweep,
      startIdle: startIdle,
      setActive: function(active) { if(active && !scanned) startIdle();else stopIdle(); },
      relabel: function () { if (scanned) { reveal(); } }
    };
  }

  /* ------------------------------------------------------- Booth stage */

  var twin = null;

  var PREFIX = { gr: 'gr', interlock: 'il', putaway: 'pa' };

  /* What the hover card says about a station. Words come from the dictionary
     so the card follows the language switch like everything else. */
  function describeStation(app) {
    var p = PREFIX[app];
    if (!p) { return null; }
    return {
      step: t('app.station', { n: State.apps.indexOf(app) + 1 }),
      name: t(p + '.name'),
      role: t(p + '.role'),
      action: t('twin.hint'),
      done: State.isDone(app)
    };
  }

  function appLabels() {
    return { gr: t('gr.name'), interlock: t('il.name'), putaway: t('pa.name') };
  }

  function initStage() {
    var stage = document.getElementById('twin-stage');
    if (!stage) { return; }
    twin = window.Twin.create(stage, {
      text: t,
      labels: appLabels(),
      description: t('twin.alt'),
      reducedMotion: window.Forklift.prefersReducedMotion(),
      onNodeClick: openStation,
      describe: describeStation
    });
  }

  /* A node on the plan drives straight to that station's view. */
  function openStation(app) {
    window.Router.go(app);
  }

  function flashWipe() {
    var wipe = document.getElementById('wipe');
    if (!wipe || window.Forklift.prefersReducedMotion()) { return; }
    wipe.classList.remove('is-on');
    void wipe.offsetWidth;
    wipe.classList.add('is-on');
  }

  /* --------------------------------------------------- Opening sequence */

  function runIntro() {
    if (window.Forklift.prefersReducedMotion()) { return; }

    // One orchestrated moment on load: the hero settles, the label is read,
    // and a forklift crosses the floor. The warehouse actors run independently.
    document.body.classList.add('is-intro');

    // The dock runs on its own loop now, so nothing needs starting here.
  }

  /* ------------------------------------------------------- The stations */

  function mountDemo(app) {
    var terminal = document.getElementById('terminal-' + app);
    if (!terminal) { return; }
    var mount = terminal.querySelector('[data-mount]');
    if (!demos[app]) {
      demos[app] = window.Demos.create(app, mount, function (bin) {
        if (app === 'putaway' && bin) { lastBin = bin; }
        finishStation(app);
      });
    }
    demos[app].render();
  }

  function initRouter() {
    window.Router.onChange(function (id) {
      if (twin) { twin.setActive(id === 'home'); }
      if (hero) { hero.setActive(id==='more'); }
      if (challenge) { challenge.setActive(id==='more'); }
      if (window.WarehouseHandoff.isActive()) window.WarehouseHandoff.cancel();
      if (id === 'gr' || id === 'interlock' || id === 'putaway') { mountDemo(id); }
      paintBoard();
    });
    window.Router.init();
  }

  function finishStation(app) {
    if (!State.complete(app)) { return; }

    var view = document.getElementById('view-' + app);
    var stamp = view && view.querySelector('[data-stamp]');
    if (stamp) {
      stamp.hidden = false;
      stamp.classList.remove('is-in');
      void stamp.offsetWidth;
      stamp.classList.add('is-in');
    }

    // A delayed demo callback must not pull someone back from another view.
    if(window.Router.current()!==app || handoffBusy) return;
    if(State.allDone()) {
      if(twin) twin.departTruck();
      window.Router.go('home');
      return;
    }
    var next=app==='gr' ? 'putaway' : app==='putaway' ? 'interlock' : null;
    if(next) {
      handoffBusy=true;
      window.WarehouseHandoff.play(app).then(function(completed){
        handoffBusy=false;
        if(completed && window.Router.current()===app) window.Router.go(next,{instant:true});
      });
    }
  }

  /* -------------------------------------------------- Progress and flow */

  function updateProgressLabel() {
    var label = document.getElementById('progress-label');
    var n = State.count();
    label.textContent = n === 0 ? t('progress.none')
      : (n === 3 ? t('progress.all') : t('progress.some', { done: n }));
  }

  function paintDots() {
    var done = State.apps.map(function (app) { return State.isDone(app); });
    document.querySelectorAll('[data-dots]').forEach(function (group) {
      group.innerHTML = done.map(function (isDone) {
        return '<span class="dots__dot' + (isDone ? ' is-filled' : '') + '"></span>';
      }).join('');
    });
    document.querySelectorAll('[data-station-label]').forEach(function (node) {
      node.textContent = t('app.station', { n: node.getAttribute('data-station-label') });
    });
  }

  function paintBoard() {
    paintJourneyButtons();
    paintDots();
    State.apps.forEach(function (app) {
      var done = State.isDone(app);
      var homeStep=document.querySelector('[data-home-step="'+app+'"]');
      if(homeStep){homeStep.classList.toggle('is-done',done);homeStep.setAttribute('aria-label',t(PREFIX[app]+'.name')+(done?' · '+t('station.done'):''));}
      var seg = document.querySelector('.progress__seg[data-seg="' + app + '"]');
      if (seg) { seg.classList.toggle('is-filled', done); }

      var step = document.querySelector('.flow__step[data-flow="' + app + '"]');
      if (step) {
        step.classList.toggle('is-done', done);
        var state = step.querySelector('[data-flow-state]');
        state.setAttribute('data-i18n', done ? 'flow.state.done' : 'flow.state.waiting');
        state.textContent = t(done ? 'flow.state.done' : 'flow.state.waiting');
      }
    });
    updateProgressLabel();
    if (twin) {
      twin.setProgress(State.apps.filter(function (app) { return State.isDone(app); }));
    }
  }

  /* --------------------------------------------------------- The finale */

  function updateFinaleBody() {
    document.getElementById('finale-body').textContent = t('finale.body', { bin: lastBin });
  }

  function openFinale() {
    var overlay = document.getElementById('finale');
    updateFinaleBody();
    overlay.hidden = false;
    overlay.classList.remove('is-open');
    void overlay.offsetWidth;
    overlay.classList.add('is-open');
    document.getElementById('finale-close').focus();
    document.addEventListener('keydown', onEscape);
  }

  function closeFinale() {
    var overlay = document.getElementById('finale');
    overlay.hidden = true;
    overlay.classList.remove('is-open');
    document.removeEventListener('keydown', onEscape);
    window.Router.go('home', { instant: true });
  }

  function onEscape(event) {
    if (event.key === 'Escape') { closeFinale(); }
  }

  function resetAll() {
    window.WarehouseHandoff.cancel();
    State.reset();
    Object.keys(demos).forEach(function (app) { demos[app].reset(); });
    document.querySelectorAll('[data-stamp]').forEach(function (stamp) {
      stamp.hidden = true;
      stamp.classList.remove('is-in');
    });
    lastBin = window.Demos.suggestedBin;
    closeFinale();
    ['shipping'].forEach(function (id) {
      var node = document.getElementById(id);
      if (node) { node.style.animationDelay = ''; }
    });
  }

  /* ------------------------------------------------------------- Team */

  function buildTeam() {
    var list = document.getElementById('team-list');
    if (!list) { return; }
    // Real names, not numbered placeholders, and the same five that stand on
    // the plan. Roles and links are still blanks for the team to fill in.
    var names = (twin && twin.members) ? twin.members()
      : ['Sơn', 'Ngân', 'Minh', 'Trí', 'Bách'];
    list.innerHTML = names.map(function (name,index) {
      return '<li class="team__card">'
        + '<span class="team__avatar" aria-hidden="true">' + name.slice(0,1) + '</span>'
        + '<span class="team__slot">' + name + '</span>'
        + '<span class="team__role">Syntax Squad · 0' + (index+1) + '</span>'
        + '</li>';
    }).join('');
  }

  function paintJourneyButtons() {
    document.querySelectorAll('[data-journey]').forEach(function(button){
      button.textContent=t(State.allDone()?'project.replay':State.count()?'project.resume':'project.start');
    });
  }
  function startJourney() {
    if(State.allDone()) resetAll();
    window.Router.go(State.apps.find(function(app){return !State.isDone(app);}) || 'gr');
  }

  /* --------------------------------------------------- Header height */

  /* Every full screen view offsets itself by --topbar-h. CSS declares 62px,
     56px narrow, and the header is styled to fit that. This measures the bar
     as actually rendered and corrects the token if a translation, a font
     fallback or a zoom level makes it taller, so the views can never end up
     tucked underneath it. */
  function trackHeaderHeight() {
    var bar = document.querySelector('.topbar');
    if (!bar) { return; }
    var apply = function () {
      document.documentElement.style.setProperty('--topbar-h', Math.round(bar.getBoundingClientRect().height) + 'px');
    };
    apply();
    if (window.ResizeObserver) { new ResizeObserver(apply).observe(bar); }
    else { window.addEventListener('resize', apply); }
    document.addEventListener('languagechange', apply);
  }

  /* Fit the corner caption inside the canvas without changing its anchor.
     Measuring the translated copy also keeps the diagram clear on phones. */
  function fitHomeCanvas() {
    var canvas = document.getElementById('twin');
    var copy = canvas.querySelector('.stage-overlay');
    var head = canvas.querySelector('.twin__head');
    function fit() {
      if (!canvas.clientWidth || !canvas.clientHeight) { return; }
      var style = getComputedStyle(copy);
      var left = parseFloat(style.left) || 12;
      var bottom = parseFloat(style.bottom) || 12;
      var headHeight = head.offsetTop + head.offsetHeight + left;
      var scale = Math.min(1,
        (canvas.clientWidth - left * 2) / Math.max(1, copy.offsetWidth),
        (canvas.clientHeight - headHeight - bottom) / Math.max(1, copy.offsetHeight));
      scale = Math.max(.05, scale);
      copy.style.setProperty('--copy-scale', scale);
      canvas.style.setProperty('--copy-height', (copy.offsetHeight * scale) + 'px');
      canvas.style.setProperty('--scene-head-height', headHeight + 'px');
    }
    fit();
    if (window.ResizeObserver) {
      var observer = new ResizeObserver(fit);
      [canvas, copy, head].forEach(function (node) { observer.observe(node); });
    } else { window.addEventListener('resize', fit); }
    document.addEventListener('languagechange', fit);
    window.Router.onChange(function (id) { if (id === 'home') { fit(); } });
  }

  /* ------------------------------------------------------------- Start */

  document.addEventListener('DOMContentLoaded', function () {
    window.I18N.setLanguage('vi');
    initTheme();
    initLanguage();
    drawCartonLabel();
    initStage();
    initHeroScan();
    buildTeam();

    challenge = window.Challenge.create(document.getElementById('challenge-mount'));
    challenge.render();

    State.subscribe(paintBoard);
    paintBoard();

    document.getElementById('finale-close').addEventListener('click', closeFinale);
    document.getElementById('finale-again').addEventListener('click', function () {
      resetAll();
      window.Router.go('gr');
    });
    var reset = document.getElementById('reset-all');
    if (reset) { reset.addEventListener('click', resetAll); }

    initRouter();
    document.querySelectorAll('[data-journey]').forEach(function(button){button.addEventListener('click',startJourney);});
    document.querySelectorAll('[data-project-section]').forEach(function(button){button.addEventListener('click',function(){
      var section=document.getElementById(button.dataset.projectSection);
      section.scrollIntoView({behavior:window.Forklift.prefersReducedMotion()?'instant':'smooth',block:'start'});
      var heading=section.querySelector('h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}
    });});
    trackHeaderHeight();
    fitHomeCanvas();

    runIntro();
  });
})();

</script>
</body>
</html>
