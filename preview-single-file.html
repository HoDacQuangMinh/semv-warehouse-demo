/* css/tokens.css */
/* Design tokens.
   Colour keeps the Schneider anchor and the spec's semantic rules. Type,
   spacing, radius, materials and motion follow Apple's Human Interface
   Guidelines: a real type scale, an 8pt grid, translucent materials for
   layering, and 44px minimum hit targets.

   One deliberate departure: HIG uses capsule buttons. Ours stay rectangular
   with a soft radius, because pill buttons are banned in this project. */

:root {
  /* Brand */
  --se-green:      #3DCD58;
  --se-green-mid:  #2FA847;
  --se-green-deep: #1F6F4A;
  --se-green-wash: #E3F5E8;

  /* Materials, taken from the warehouse itself */
  --carton:      #C8A57B;
  --carton-deep: #8A6A42;
  --floor:       #EFEAE0;   /* kraft paper */
  --panel:       #E3DCCB;   /* concrete */
  --panel-2:     #FBF8F1;   /* elevated surface, still warm */
  --ink:         #17150F;   /* label */
  --ink-2:       #5C574F;   /* secondary label */
  --ink-3:       #8E8880;   /* tertiary label */
  --line:        #D4CFC6;   /* separator */
  --line-soft:   #E4E0D8;   /* opaque separator */
  --steel:       #33383B;

  /* Semantic, information only */
  --hazard:        #F2B705;
  --hazard-deep:   #8A6800;
  --hazard-wash:   #FDF3D6;
  --verified:      var(--se-green);
  --verified-deep: var(--se-green-deep);
  --verified-wash: var(--se-green-wash);
  --scan:          #0B5FFF;
  --scan-wash:     #E4EDFF;
  --machine:       #E9A93C;
  --machine-deep:  #7A5410;

  /* Station identity. Deliberately OUTSIDE the semantic trio: green, hazard
     yellow and scan blue keep their meanings, so identity has to come from
     somewhere else. These three are earthy and industrial and cannot be
     mistaken for a status. */
  --petrol:      #0E4B4F;   /* the dock */
  --petrol-soft: #D3E2E1;
  --oxide:       #A8451F;   /* the build area */
  --oxide-soft:  #F3DFD6;
  --moss:        #4A5A2B;   /* the racks */
  --moss-soft:   #E2E6D2;

  /* Vehicles. Silver cab, weathered steel container, dark glass and rubber. */
  --truck-cab:   #D8D3C7;
  --truck-glass: #6F8E99;
  --cont-body:   #3E5F6B;
  --tyre:        #1B1E20;
  --op-trouser:  #2A3138;
  --op-skin:     #C89A73;
  --op-helmet:   #F4F1E8;
  --hair:        #241C15;
  --crew-a:      #2A3138;
  --crew-b:      #4A3A52;
  --crew-c:      #23404A;
  --crew-d:      #4A3226;
  --crew-e:      #2E3A2C;

  /* The hall itself. Daylight concrete, not a black void. */
  --hall-bg:     #E3E9EC;
  --hall-top:    #CAD2D3;
  --hall-left:   #7F9198;
  --hall-right:  #9DADB2;
  --hall-grid:   #ADBCC1;
  --hall-steel:  #4A5558;
  --hall-steel-2:#333C3F;
  --hall-steel-3:#3F4A4D;
  --hall-lamp:   #F6F2E6;
  --hall-haze:   rgba(248, 253, 255, .9);
  --wall:        #B4C4CB;
  --wall-rib:    #8CA1AD;
  --column:      #647C88;
  --paint-lane:  #D9A812;
  --paint-walk:  #ADC7BE;
  --pool:        rgba(247, 253, 255, .36);

  /* Surface texture, built from gradients so nothing has to be downloaded. */
  --grain: repeating-linear-gradient(
             45deg,
             rgba(28, 26, 23, .018) 0 2px,
             transparent 2px 4px);
  --tape: repeating-linear-gradient(
            -45deg,
            var(--machine) 0 8px,
            var(--ink) 8px 16px);

  /* Terminal screens */
  --screen-bg:   #1A1E20;
  --screen-ink:  #F2F0EC;
  --screen-dim:  #948E86;
  --screen-line: #33393C;

  /* Radius. Soft, never a capsule. */

  --radius-lg:  14px;  /* cards and sheets */

  --fs-h2:   clamp(1.375rem, 1.2rem + .7vw, 1.75rem); /* title 2 */
  --fs-h3:   1.25rem;                                  /* title 3 */
  --fs-body: 1.0625rem;                                /* body, 17px */
  --fs-sm:   .9375rem;                                 /* subhead, 15px */
  --fs-xs:   .8125rem;                                 /* footnote, 13px */

  --lh-body: 1.47;
  --lh-tight: 1.12;
  --tracking-tight: -.022em;   /* HIG tightens as size grows */
  --weight-emphasis: 590;

  --sp-1: .25rem;   /*  4 */
  --sp-2: .5rem;    /*  8 */
  --sp-3: .75rem;   /* 12 */
  --sp-4: 1rem;     /* 16 */
  --sp-5: 1.5rem;   /* 24 */
  --sp-6: 2rem;     /* 32 */
  --sp-7: 3rem;     /* 48 */
  --sp-8: 4rem;     /* 64 */

  --hit: 44px;      /* minimum touch target */
  --wrap: 1120px;

  --dur: 300ms;
  --dur-slow: 520ms;

/* css/base.css */
/* Reset and base typography. */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--floor);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);

  letter-spacing: var(--tracking-tight);
  font-family: var(--font-display);
  font-weight: 700;
  text-wrap: balance;

h1 { font-size: var(--fs-hero); letter-spacing: -.032em; max-width: 15ch; }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); letter-spacing: -.018em; font-weight: var(--weight-emphasis); }

p { margin: 0 0 var(--sp-4); max-width: 66ch; }
p:last-child { margin-bottom: 0; }

ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }

svg { display: block; }

button { font: inherit; color: inherit; }

.mono {
  font-family: var(--font-mono);
  font-size: .93em;
  letter-spacing: .01em;
}

.wrap {
  width: min(100% - 2.5rem, var(--wrap));
  margin-inline: auto;
}

.lede {
  font-size: clamp(1rem, .95rem + .25vw, 1.125rem);
  color: var(--ink-2);
  max-width: 54ch;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: var(--panel-2);
  padding: var(--sp-3) var(--sp-4);
  z-index: 100;
}
.skip-link:focus { left: var(--sp-4); top: var(--sp-4); }

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--se-green) 55%, transparent);
  outline-offset: 3px;
  border-radius: var(--radius-sm);

button, a.btn, .bin, .slot, .ch-box, .ch-line, .icon-btn {

.bin { min-height: 0; }

[hidden] { display: none !important; }

<style>
/* css/layout.css */
/* Page level layout. */

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--material-thick);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line);
}

.topbar__inner {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  min-height: var(--topbar-base);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  text-decoration: none;
  margin-right: auto;
  min-width: 0;
}
.brand__mark { width: 26px; height: 26px; flex: none; color: var(--se-green-deep); }
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__name { font-weight: 600; letter-spacing: -.01em; }
.brand__sub { font-size: var(--fs-xs); color: var(--ink-3); }

.topbar__nav { display: flex; gap: var(--sp-5); }
.topbar__nav a {
  display: inline-flex;
  align-items: center;
  min-height: var(--hit);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  text-decoration: none;
  padding-block: var(--sp-2);
  border-bottom: 2px solid transparent;
}
.topbar__nav a:hover { color: var(--ink); border-bottom-color: var(--se-green); }
.topbar__nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--se-green); }

.topbar__tools { display: flex; flex: none; gap: var(--sp-2); }

/* ---------- Section bands ---------- */

.band { padding-block: var(--sp-7); border-top: 1px solid var(--line); }
.band--alt { background: var(--panel); }
.band > .wrap > h2 { margin-bottom: var(--sp-3); }

.section-lede {
  color: var(--ink-2);
  max-width: 60ch;
  margin-bottom: var(--sp-6);
}

.note {
  margin-top: var(--sp-5);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  border-left: 2px solid var(--line);
  padding-left: var(--sp-3);
}

.fineprint { font-size: var(--fs-xs); color: var(--ink-3); }

/* ---------- Hero ---------- */

.hero { padding-block: var(--sp-7) var(--sp-6); }

.hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--sp-7);
  align-items: center;
}

.hero__text h1 { margin-bottom: var(--sp-4); }
.hero__text .lede { margin-bottom: var(--sp-3); }
.hero__text .btn { margin-top: var(--sp-4); }

/* ---------- Stations ---------- */

.station {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr);
  border-top: 1px solid var(--line);
}
.station:last-of-type { border-bottom: 1px solid var(--line); }

.station__rail {
  position: relative;
  display: flex;
  justify-content: center;
  padding-top: var(--sp-6);
}
.station__rail::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 8px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(
    -45deg,
    var(--machine) 0 6px,
    transparent 6px 12px
  );
  opacity: .32;
}
.station__num {
  position: relative;
  width: 30px; height: 30px;
  display: grid;
  place-items: center;
  background: var(--floor);
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.band--alt .station__num { background: var(--panel); }
.station.is-done .station__num {
  background: var(--verified-wash);
  border-color: var(--se-green);
  color: var(--se-green-deep);
}

.station__body { padding: var(--sp-6) 0 var(--sp-7) var(--sp-5); }

.station__head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
}
.station__icon { width: 32px; height: 32px; color: var(--steel); margin-top: 2px; }
.station__title h3 { font-size: var(--fs-h2); margin-bottom: var(--sp-1); }
.station__role { color: var(--ink-2); font-size: var(--fs-sm); margin: 0; }

/* ---------- Flow board ---------- */

.flow__steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-4);
}
.flow__reset { margin-top: var(--sp-6); }

/* ---------- Footer ---------- */

.footer { border-top: 1px solid var(--line); padding-block: var(--sp-5); }
.footer__inner {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-4);
  align-items: baseline;
  justify-content: space-between;
}
.footer__note { font-size: var(--fs-sm); color: var(--ink-3); margin: 0; max-width: 60ch; }
.footer__links { display: flex; gap: var(--sp-4); font-size: var(--fs-sm); }
.footer__links a { color: var(--ink-2); }

/* ---------- Responsive ---------- */

@media (max-width: 1100px) {
  .topbar__inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0 var(--sp-3);
    padding-top: var(--sp-2);
  }
  .topbar__nav { grid-column: 1 / -1; grid-row: 2; gap: var(--sp-5); }
  .topbar__tools { grid-column: 2; grid-row: 1; }
  .brand__sub { display: none; }
}

@media (max-width: 900px) {
  .hero__inner { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
  h1 { max-width: 20ch; }
  .flow__steps { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 640px) {
  /* The bar has to fit --topbar-base, because that is what the views offset by.
     The subtitle is the first thing to go: it is the longest string in the
     header and the only one that wraps to a third line in Vietnamese. */
  :root { --topbar-base: 56px; --topbar-h: 56px; }
  .brand__sub { display: none; }
  .station { grid-template-columns: 40px minmax(0, 1fr); }
  .station__body { padding-left: var(--sp-4); }
  .station__head { grid-template-columns: auto minmax(0, 1fr); }
  .station__head .stamp { grid-column: 2; justify-self: start; }
  .band { padding-block: var(--sp-6); }
}

/* Below this the two tool buttons cannot keep their labels and still leave the
   brand a readable width, so they fall back to icons. The accessible name comes
   from aria-label, set alongside the label text in main.js. */
@media (max-width: 460px) {
  .icon-btn { padding: .42rem; min-width: var(--hit); justify-content: center; }
  .icon-btn span { display: none; }
  .brand { gap: var(--sp-2); }
  .brand__name { font-size: var(--fs-sm); }
  .topbar__tools { gap: var(--sp-1); }
}

}
.line__code { font-family: var(--font-mono); }

.scr__note {

  padding: .6rem .8rem;
  border-radius: var(--radius-sm);

.overlay {

  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  align-items: safe center;

/* css/views.css */
/* Full screen views. Nothing scrolls to reach a station. */

html, body { height: 100%; }
body { overflow: hidden; }

/* Paper grain over everything, so surfaces read as material not as chrome. */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--grain);
  pointer-events: none;
  z-index: 70;
}
body:has(#view-home.is-active)::after { background: none; }

.view {
  position: fixed;   /* load bearing: gives the view its height */
  inset: 0;
  top: var(--topbar-h);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.view:not(.is-active) { display: none; }

/* The project document scrolls within the active view. */
.view--doc { overflow-y: auto; padding-bottom: var(--sp-7); }

/* ---------- Home: a fitted warehouse canvas ----------
   The copy stays in the lower-left corner at every viewport and zoom level.
   The canvas owns its dimensions; neither the scene nor copy adds a scroll. */
#view-home.is-active {
  display: block;
  overflow: hidden;
}
#view-home .twin {
  --scene-pad: clamp(12px, 2.2vmin, 32px);
  --copy-height: 220px;
  --scene-head-height: 48px;
  position: absolute;
  inset: 0;
  border: 0;
  display: block;
  container-type: size;
}
#view-home .twin__head {
  position: absolute;
  top: var(--scene-pad);
  left: var(--scene-pad);
  width: calc(100% - 2 * var(--scene-pad));
  z-index: 2;
}
#view-home #twin-stage {
  position: absolute;
  inset: 0;
}
#view-home .twin__svg {
  width: 100%;
  height: 100%;
  max-height: none;
  display: block;
}

/* ---------- A station view ----------
   Each station carries its own colour on a painted spine and a stencilled
   number, so the three do not read as one template repeated. */

#view-gr        { --station: var(--petrol); --station-soft: var(--petrol-soft); }
#view-putaway   { --station: var(--oxide); --station-soft: var(--oxide-soft); }
#view-interlock { --station: var(--moss);  --station-soft: var(--moss-soft); }

.view[id^="view-"] .app-view { position: relative; }

/* The stencilled number, set into the background rather than printed on top. */
.app-view::before {
  content: attr(data-figure);
  position: absolute;
  right: -.06em;
  bottom: -.22em;
  font-family: var(--font-mono);
  font-size: clamp(14rem, 34vh, 26rem);
  font-weight: 700;
  line-height: .8;
  color: var(--station);
  opacity: .07;
  pointer-events: none;
  z-index: 0;
}
.app-view > * { position: relative; z-index: 1; }

/* ---------- A station view ---------- */

.app-view {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
  gap: var(--sp-6);
  align-items: center;
  /* 'safe' matters: with plain centring, content taller than the view overflows
     equally in both directions and the top half becomes unreachable. Safe
     centring falls back to start-alignment exactly when that would happen. */
  align-items: safe center;
  width: min(100% - 3rem, var(--wrap));
  margin-inline: auto;
  padding-block: var(--sp-5);
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.app-view__brief {
  min-width: 0;
  padding-left: var(--sp-5);
  border-left: 6px solid var(--station);
}

.app-view__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--station);
  margin-bottom: var(--sp-3);
}
.app-view__eyebrow .station__icon { color: var(--station); }
.app-view__brief .taglist li {
  border-color: var(--station);
  background: var(--station-soft);
  color: var(--station);
}
.app-view .back-link:hover { color: var(--station); }
.app-view__screen .terminal { border-top: 5px solid var(--station); }
.app-view__brief h2 { margin-bottom: var(--sp-2); }
.app-view__role { color: var(--ink-2); font-size: var(--fs-sm); margin-bottom: var(--sp-4); }
.app-view__brief p { font-size: var(--fs-sm); color: var(--ink-2); }
.app-view__actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }

.app-view__screen { min-width: 0; display: flex; justify-content: center; }
.app-view__screen .terminal { margin: 0; width: 100%; max-width: 640px; }
.app-view__screen .scr__body { max-height: 52vh; overflow-y: auto; }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  background: transparent;
  border: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
  font-weight: var(--weight-emphasis);
  cursor: pointer;
  padding: 0;
}
.back-link:hover { color: var(--ink); }
.back-link svg { width: 18px; height: 18px; }

/* ---------- Progress, shown on every view ---------- */

.dots { display: flex; align-items: center; gap: var(--sp-2); }
.dots__dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--line);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.dots__dot.is-filled { background: var(--se-green); transform: scale(1.25); }

/* ---------- The forklift transition ---------- */

.transition {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  overflow: hidden;
}
.transition__curtain {
  position: absolute;
  inset: 0;
  background: var(--steel);
  transform: translateX(-102%);
}
[data-theme="dark"] .transition__curtain { background: #0A0D0F; }
.transition__truck {
  position: absolute;
  bottom: 12%;
  left: 0;
  width: min(46vw, 520px);
  transform: translateX(-40vw);
}
.transition__truck svg { width: 100%; height: auto; }

@media (max-width: 1100px) {
  .app-view {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--sp-4);
    align-content: start;
    align-items: start;
  }
  .app-view__screen .scr__body { max-height: none; }
  .transition__truck { width: 72vw; bottom: 16%; }

}


/* Leave the corner copy its own room in a narrow canvas. Both regions remain
   fitted to the same screen instead of forming a taller, scrolling page. */
@container (max-aspect-ratio: 7/5) {
  #view-home #twin-stage {
    inset: var(--scene-head-height) 0 calc(var(--copy-height) + 2 * var(--scene-pad));
  }
}
@container (max-height: 340px) and (min-aspect-ratio: 7/5) {
  #view-home #twin-stage { inset: var(--scene-head-height) 0 0 46%; }
}

@media (max-width: 640px) {
  .app-view { width: calc(100% - 2rem); }
  .app-view__brief { padding-left: var(--sp-3); }
  .app-view__eyebrow { flex-wrap: wrap; }
}

/* css/animations.css */
/* Warehouse activity and interaction animations. */

/* Truck visibility supplies the shared clock. vehicles.js uses that clock to
   turn the actual geometry, reverse to the dock, and leave cab first. */
/* ---------- The dock cycle ----------
   One 24s clock for the receiving truck and gate. The logistics controller
   waits for this dock to open before collecting its pallet. */

.twin__hall { --dock-cycle: 24s; }

@keyframes dock-truck {
  0%   { opacity: 0; }
  4%   { opacity: 1; }
  14%, 68% { opacity: 1; }
  84%, 100% { opacity: 0; }
}
.iso-dock-truck {
  transform-box: view-box;
  animation: dock-truck var(--dock-cycle) linear infinite;
}

/* The activity renderer reads the receiving truck's clock to lift the gate.
   It also holds the gate open for a crossing forklift between deliveries. */
.iso-dock-gate {
  transform-box: view-box;
}

/* Wheels turn while a vehicle is moving. */
@keyframes wheel-roll {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.iso-wheel-spin { transform-box: fill-box; transform-origin: center; }
.iso-shipping .iso-wheel-spin,
.iso-dock-truck .iso-wheel-spin,
.iso-shuttle .iso-wheel-spin { animation: wheel-roll 900ms linear infinite; }

/* The team talking. Each bubble opens, its dots run, then it closes; the
   delays are staggered across the five so it reads as a conversation rather
   than five people speaking at once. */
@keyframes chat-pop {
  0%   { opacity: 0; transform: scale(.6); }
  3%   { opacity: 1; transform: scale(1); }
  17%  { opacity: 1; transform: scale(1); }
  21%  { opacity: 0; transform: scale(.85); }
  100% { opacity: 0; transform: scale(.85); }
}
@keyframes chat-dot {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}
.iso-chat { animation: chat-pop 17s ease-in-out infinite; }
.iso-chat-dot { animation: chat-dot 1200ms ease-in-out infinite; }
.iso-chat-dot:nth-of-type(2) { animation-delay: 180ms; }
.iso-chat-dot:nth-of-type(3) { animation-delay: 360ms; }

/* Operator joints and footfalls use the shared warehouse clock in operators.js. */
.iso-yield-light { fill: var(--machine); stroke: var(--ink); stroke-width: 1; visibility: hidden; }
.iso-shuttle.is-yielding .iso-yield-light { visibility: visible; }
.iso-stretch-film polygon { fill: #e4f2ee; fill-opacity: .14; stroke: #e4f2ee; stroke-opacity: .35; stroke-width: .55; }
.iso-stretch-film path { fill: none; stroke: #e4f2ee; stroke-opacity: .65; stroke-width: .65; }
.iso-stretch-web { fill: #e4f2ee; fill-opacity: .28; stroke: #e4f2ee; stroke-opacity: .55; stroke-width: .6; }

   to the system's reduced-motion preference. SVG timing is handled in twin.js. */
#twin-stage.is-paused .twin__svg * { animation-play-state: paused !important; }

#twin-stage.is-still .iso-dock-truck { opacity: 1; transform: none; }
#twin-stage.is-still .iso-chat { opacity: 1; }
#twin-stage.is-still .iso-dock-gate { transform: translateY(-54px); }

@media (prefers-reduced-motion: reduce) {

@keyframes ship-cycle {

  80%, 100% { opacity: 0; }

.iso-shipping {

  function poly(points, cls) {
    return '<polygon class="' + cls + '" points="' + points.join(' ') + '"/>';
  }

  /* A box standing on the floor at height z0, drawn as three faces. */
  function box(x, y, w, d, h, kind, z0) {
    var base = z0 || 0;
    var top = base + h;
    var out = poly([p(x, y, top), p(x + w, y, top), p(x + w, y + d, top), p(x, y + d, top)], 'iso-' + kind + '-top')
      + poly([p(x + w, y, top), p(x + w, y + d, top), p(x + w, y + d, base), p(x + w, y, base)], 'iso-' + kind + '-right')
      + poly([p(x, y + d, top), p(x + w, y + d, top), p(x + w, y + d, base), p(x, y + d, base)], 'iso-' + kind + '-left');
    return /^(rack|container-|tote-|table|film)/.test(kind)
      ? '<g class="iso-material iso-material--' + kind + '">' + out + '</g>' : out;
  }

  var W = 112, D = 66;          // hall footprint in plan units
  var AISLE = 33;               // the aisle everything runs along
  var NODES = [
    { app: 'gr', x: 30, y: 40, num: '01', area: [10, 42, 26, 22] },
    { app: 'putaway', x: 56, y: 27, num: '02', area: [22, 2, 65, 27] },
    { app: 'interlock', x: 58, y: 43, num: '03', area: [38, 42, 42, 22] }
  ];
  var environment=global.WarehouseEnvironment.create({point:pt,box:box});


  /* Paint on the floor: the walking lane, the aisle edges, and hazard
     chevrons across the dock approach. */
  function floorMarks() {
    var out = zone(0, 29, W, 12, 'iso-main-aisle');
    out += zone(45, 0, 11, 29, 'iso-main-aisle');
    out += zone(15, 0, 7, 29, 'iso-main-aisle');
    out += zone(88, 0, 9, 29, 'iso-main-aisle');
    [[22, 19, 23, 3], [59, 19, 28, 3], [10, 62, 27, 3]].forEach(function (a) {
      out += zone(a[0], a[1], a[2], a[3], 'iso-pedestrian-strip');
    });
    out += '<path class="iso-lane" d="M' + p(0, 29, .8) + 'L' + p(W, 29, .8)
      + 'M' + p(0, 41, .8) + 'L' + p(W, 41, .8) + '"/>';
    [[22, 22, 22, 6], [59, 22, 28, 6], [11, 45, 12, 16], [25, 45, 11, 16],
      [85, 47, 11, 15], [98, 47, 11, 15]].forEach(function (a) {
      out += palletPad(a[0], a[1], a[2], a[3]);
    });
    return out;
  }

  function palletPad(x, y, w, d) {
    var out = zone(x, y, w, d, 'iso-pallet-pad');
    var slats = '';
    for (var sy = y + 1; sy < y + d; sy += 1.8) {
      slats += 'M' + p(x + .7, sy, .85) + 'L' + p(x + w - .7, sy, .85);
    }
    return out + '<path class="iso-pallet-slats" d="' + slats + '"/>';
  }

  /* High bay lighting: a fitting overhead and the pool it throws. */
  function lighting() {
    var out = '<defs><radialGradient id="pool" cx="50%" cy="50%" r="50%">'
      + '<stop offset="0%" class="pool-in"/><stop offset="100%" class="pool-out"/>'
      + '</radialGradient></defs>';
    [[20, 20], [56, 20], [92, 20], [20, 48], [56, 48], [92, 48]].forEach(function (c) {
      var s = pt(c[0], c[1], 0.76);
      out += '<ellipse class="iso-pool" cx="' + s[0] + '" cy="' + s[1] + '" rx="86" ry="50"/>';
    });
    return out;
  }

  function floorPlate() {
    var out = box(0, 0, W, D, 0.7, 'floor');
    var lines = [];
    for (var gx = 0; gx <= W; gx += 8) {
      lines.push('M' + p(gx, 0, 0.72) + 'L' + p(gx, D, 0.72));
    }
    for (var gy = 0; gy <= D; gy += 8) {
      lines.push('M' + p(0, gy, 0.72) + 'L' + p(W, gy, 0.72));
    }
    return out + '<path class="iso-grid" d="' + lines.join('') + '"/>';
  }

  function zone(x, y, w, d, cls) {
    return poly([p(x, y, 0.75), p(x + w, y, 0.75), p(x + w, y + d, 0.75), p(x, y + d, 0.75)], cls);
  }

  /* Painter's algorithm: in this projection a larger (x + y) is nearer the
     viewer, so a shape with a larger centre sum must be drawn later or it will
     be painted over by something behind it. */
  function paint(specs) {
    return specs.slice().sort(function (a, b) {
      var ka = (a[0] + a[2] / 2) + (a[1] + a[3] / 2);
      var kb = (b[0] + b[2] / 2) + (b[1] + b[3] / 2);
      if (ka !== kb) { return ka - kb; }
      return (a[6] || 0) - (b[6] || 0);
    }).map(function (s) {
      return box(s[0], s[1], s[2], s[3], s[4], s[5], s[6]);
    }).join('');
  }

  /* A wheel is a circle standing in the x-z plane, so it has to be built from
     projected points rather than an <ellipse>: the two screen axes are not
     perpendicular, so an axis aligned ellipse would look wrong. */
  function discX(cx, cy, cz, r, cls) {
    var pts = [];
    for (var i = 0; i < 18; i++) {
      var a = i / 18 * Math.PI * 2;
      pts.push(p(cx + r * Math.cos(a), cy, cz + r * Math.sin(a)));
    }
    return '<polygon class="' + cls + '" points="' + pts.join(' ') + '"/>';
  }

  function wheels(list) {
    return list.map(function (w) {
      return '<g class="iso-wheel">'
        + discX(w[0], w[1], w[2], w[3], 'iso-tyre-disc')
        + '<g class="iso-wheel-spin">'
        +   discX(w[0], w[1], w[2], w[3] * 0.42, 'iso-hub-disc')
        +   '<path class="iso-spoke" d="M' + p(w[0] - w[3] * 0.7, w[1], w[2])
        +     'L' + p(w[0] + w[3] * 0.7, w[1], w[2]) + '"/>'
        + '</g>'
        + '</g>';
    }).join('');
  }

  var VEH_W = 6;      // across the vehicle
  var VEH_LEN = 13;   // trailer length

  /* A shipping container: ribbed sides, a door pair on the visible end, and a
     corner casting at each end, which is what separates it from a plain box. */
  function containerBody(ox, oy, kind, z0) {
    var base = z0 || 0;
    var specs = [[ox, oy, VEH_LEN, VEH_W, 5.2, kind, base]];
    for (var i = 1; i < 9; i++) {
      specs.push([ox + i * 1.4, oy + VEH_W - .12, .32, .22, 4.9, 'rib', base + .15]);
    }
    // Full-height corrugated sides, roof rails, and the paired rear doors.
    specs.push([ox, oy + VEH_W - .14, VEH_LEN, .26, .42, 'rib', base + 4.75]);
    specs.push([ox, oy + VEH_W - .14, VEH_LEN, .26, .36, 'rib', base]);
    specs.push([ox + VEH_LEN - .12, oy + .45, .22, VEH_W / 2 - .55, 4.5, 'rib', base + .35]);
    specs.push([ox + VEH_LEN - .12, oy + VEH_W / 2 + .1, .22, VEH_W / 2 - .55, 4.5, 'rib', base + .35]);
    [ox, ox + VEH_LEN - .7].forEach(function (x) {
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base + 4.6]);
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base]);
    });
    return specs;
  }

  /* A tractor unit plus its trailer. */
  function truck(ox, oy) {
    var specs = [];
    // chassis rail
    specs.push([ox + 0.4, oy + 0.7, VEH_LEN - 0.8, VEH_W - 1.4, 0.7, 'tyre', 1.4]);
    // cab, set slightly narrower than the trailer
    specs.push([ox - 4.7, oy + 0.5, 4.3, VEH_W - 1, 4.7, 'cab', 2.1]);
    specs.push([ox - 4.8, oy + VEH_W - 0.6, 3.5, 0.3, 1.9, 'glass', 4.5]);
    specs.push([ox - 1.5, oy + 0.6, 0.4, VEH_W - 1.2, 2.2, 'tyre', 4.4]);   // exhaust stack
    // trailer
    return {
      specs: specs.concat(containerBody(ox, oy, 'cont', 2.1)),
      wheels: [2.4, 4.4, 10.6, -3.9].map(function (dx) {
        return [ox + dx + 0.85, oy + VEH_W - 0.12, 0.85, 0.85];
      })
    };
  }

  /* A stack of empty returnable crates, waiting to go back on the truck. */
  function emptyStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.1, 'empties', 0.3 + i * 1.15]);
    }
    return specs;
  }

  /* A pallet with cartons on it. */
  function palletStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.5, 'load', 0.3 + i * 1.5]);
    }
    return specs;
  }

  /* Ribbed container docks bookend the two open rack banks. The front end
     stays open so the loading aisle and receiving shutter remain visible. */
  function freightContainer(x, kind, receiving) {
    var y = 1, w = 13, d = 26, h = 14;
    var specs = [
      [x, y, w, d, .6, kind, .7],
      [x, y, .65, d, h, kind, .7],
      [x + w - .65, y, .65, d, h, kind, .7],
      [x, y, w, .65, h, kind, .7],
      [x, y, w, d, .6, kind, h + .7]
    ];
    for (var rib = 1.5; rib < d; rib += 1.6) {
      specs.push([x + w - .4, y + rib, .6, .35, h, kind, .7]);
      specs.push([x, y + rib, w, .3, .3, kind, h + 1.3]);
    }
    var out = '<g class="iso-freight-container" data-container="' + (receiving ? 'receiving' : 'shipping') + '">'
      + paint(specs);
    out += box(x - 3.4, y + d - .2, 3.5, .5, h, kind, .7);
    out += box(x + w - .1, y + d - .2, 3.5, .5, h, kind, .7);
    if (receiving) { out += dockGate(x + 2.5, y + d); }
    out += environment.dockDetails(x,receiving ? 'D01' : 'D02');
    return out + '</g>';
  }

  function dockGate(x, y) {
    var opening = [p(x, y, 8), p(x + 8, y, 8), p(x + 8, y + .6, 8),
      p(x + 8, y + .6, 0), p(x, y + .6, 0), p(x, y + .6, 8)];
    var slats = '';
    for (var z = 1; z < 8; z++) {
      slats += 'M' + p(x, y + .61, z) + 'L' + p(x + 8, y + .61, z);
    }
    return '<g class="iso-dock-doorway">'
      + '<defs><clipPath id="dock-gate-opening" clipPathUnits="userSpaceOnUse">'
      + poly(opening, '') + '</clipPath></defs>'
      + box(x, y, 8, .6, 8, 'doorway')
      + '<g clip-path="url(#dock-gate-opening)"><g class="iso-dock-gate" id="dock-gate">'
      + box(x, y, 8, .6, 8, 'shadow')
      + '<path class="iso-gate-slat" d="' + slats + '"/></g></g></g>';
  }


  /* Open orange shelves, with separate uprights and diagonal end bracing.
     Keeping the bays hollow makes them read as the reference's racks. */
  function rackBank(x) {
    var y = 3, w = 21, d = 14, h = 16;
    var rear = [], front = [], shelves = '';
    [0, w / 2, w].forEach(function (dx) {
      rear.push([x + dx, y, .7, .7, h, 'rack-post', .7]);
      front.push([x + dx, y + d, .7, .7, h, 'rack-post', .7]);
    });
    [6.7, 10.5, 15.5].forEach(function (z, level) {
      shelves += '<g data-rack-level="' + ['lower','upper','top'][level] + '">';
      [0, w / 2].forEach(function (dx) {
        shelves += box(x + dx + .7, y + .7, w / 2 - .7, d - .7, .4, 'rack', z);
        shelves += box(x + dx, y + d, w / 2, .7, .85, 'rack', z - .4);
      });
      shelves += '</g>';
      shelves += environment.rackStock(x,level,z);
    });
    var braces = '';
    [x + w].forEach(function (cx) {
      [1.2, 6.2, 11.2].forEach(function (z) {
        braces += 'M' + p(cx + .8, y + .5, z) + 'L' + p(cx + .8, y + d, z + 4.1)
          + 'M' + p(cx + .8, y + d, z) + 'L' + p(cx + .8, y + .5, z + 4.1);
      });
    });
    return '<g class="iso-rack-bank">' + palletPad(x - 1, y - 1, w + 3, d + 3)
      + paint(rear) + shelves + paint(front) + '<path class="iso-rack-brace" d="' + braces + '"/>'
      + environment.rackDetails(x,x===23 ? 'R01' : 'R02') + '</g>';
  }

  /* Stackable totes have an open rim and side ribs, unlike solid cartons. */
  function toteStack(x, y, layers, kind, w, d) {
    var out = box(x, y, w, d, .45, 'rib', .9);
    for (var layer = 0; layer < layers; layer++) {
      var z = 1.35 + layer * 2.4;
      out += box(x, y, w, d, 1.9, kind, z);
      out += poly([p(x + .5, y + .5, z + 1.91), p(x + w - .5, y + .5, z + 1.91),
        p(x + w - .5, y + d - .5, z + 1.91), p(x + .5, y + d - .5, z + 1.91)], 'iso-tote-opening');
      out += paint([[x, y, w, .32, .4, kind, z + 1.9], [x, y + d - .32, w, .32, .4, kind, z + 1.9],
        [x, y, .32, d, .4, kind, z + 1.9], [x + w - .32, y, .32, d, .4, kind, z + 1.9]]);
      var ribs = '';
      for (var dx = 1; dx < w; dx += 1.5) {
        ribs += 'M' + p(x + dx, y + d + .01, z + .15) + 'L' + p(x + dx, y + d + .01, z + 1.7);
      }
      out += '<path class="iso-tote-rib" d="' + ribs + '"/>';
    }
    return out;
  }

  function goodsReceived() {
    var out = '<g data-layout-area="gr">';
    // Two blocks of stacked totes: pale on the left, dark on the right.
    [[12, 'tote-cream', 5], [26, 'tote-dark', 4]].forEach(function (stack) {
      [47, 53].forEach(function (y) {
        [0, 5].forEach(function (dx) { out += toteStack(stack[0] + dx, y, stack[2], stack[1], 4.6, 5.4); });
      });
    });
    return out + '</g>';
  }

  function returnables() {
    return '<g data-layout-area="returnables">'
      + toteStack(86, 48, 4, 'tote-green', 4.3, 5.2)
      + toteStack(91, 48, 4, 'tote-red', 4.3, 5.2)
      + toteStack(86, 54, 4, 'tote-yellow', 4.3, 5.2)
      + '</g>';
  }

  function table(x, y, w, d) {
    var specs = [[x, y, w, d, .55, 'table', 4.5]];
    [[x + .4, y + .4], [x + w - .9, y + .4], [x + .4, y + d - .9], [x + w - .9, y + d - .9]].forEach(function (leg) {
      specs.push([leg[0], leg[1], .5, .5, 3.8, 'steel', .7]);
    });
    return paint(specs);
  }

  function discZ(x, y, z, radius, cls) {
    var points = [];
    for (var i = 0; i < 48; i++) {
      var a = i * Math.PI / 24;
      points.push(p(x + radius * Math.cos(a), y + radius * Math.sin(a), z));
    }
    return poly(points, cls);
  }

  function packArea() {
    var out = '<g data-layout-area="interlock">';
    out += '<g class="iso-l-table">' + table(40, 49, 4, 13) + table(44, 58, 8, 4) + '</g>';
    // Circular wrapping turntable, tall yellow mast, and the film carriage.
    out += '<g class="iso-wrapper">'
      + discZ(63, 53, 1, 7.2, 'iso-wrapper-base')
      + discZ(63, 53, 1.7, 7.2, 'iso-wrapper-top')
      + discZ(63, 53, 1.72, 2.1, 'iso-wrapper-hub')
      + '<g id="wrapping-pallet"></g>'
      + '<g id="wrapping-film" class="iso-stretch-film"></g>'
      + '<path id="wrapping-web" class="iso-stretch-web"/>'
      + paint([[70, 49, 5, 8, .8, 'machine', .7], [71, 50, 3.2, 4, 23, 'machine', 1.5],
        [69.8, 50.5, 1, 3, 2.3, 'steel', 1.8]])
      + '<g id="wrapping-carriage">' + paint([[68.7, 51, 1.1, 2.3, 1.5, 'film', 2]]) + '</g>'
      + '</g></g>';
    return out;
  }

  function layoutLabels(text) {
    var labels = [
      [37, 45, '01 · GR', 'gr'], [57, 19, '02 · PutAway', 'putaway'],
      [70, 66, '03 · Pallet Interlocking', 'interlock'], [97, 65, text('twin.returnables'), 'returnables']
    ];
    return '<g class="iso-area-labels" aria-hidden="true">' + labels.map(function (label) {

      return '<text class="iso-area-label" data-area-label="' + label[3] + '" x="' + c[0] + '" y="' + c[1] + '">' + escapeHtml(label[2]) + '</text>';
    }).join('') + '</g>';
  }

  function route() {
    var d = 'M' + p(30, 40, .8) + 'L' + p(30, AISLE, .8)
      + 'L' + p(56, AISLE, .8) + 'L' + p(56, 27, .8)

      + '<path class="iso-route-flow" d="' + d + '"/>'

  // The side alleys are drawn behind their racks/containers. Movement comes
  // from the shared traffic model so a pedestrian can yield mid-route.
  var PATROLS = [
    {id:'roamer',x:18,y:5,route:[[18,5],[18,23]],speed:1.8},
    {id:'operator',x:50,y:5,route:[[50,5],[50,23]],speed:2.1},
    {id:'returns-op',x:93,y:5,route:[[93,5],[93,23]],speed:1.8},
    {id:'gr-scanner',x:37,y:41,route:[[37,41],[39,41],[39,46],[37,46]],speed:1.2,dwell:2.4,task:'scan'},
    {id:'wrapping-operator',x:64,y:62,route:[],speed:1.2,heading:-96,task:'wrap'}
  ];
  var ADMIN_ROUTE = [[27,25],[50,25],[50,39],[80,39],[98,43],[98,65],
    [76,65],[76,43],[55,43],[37,43],[37,37],[18,37],[18,28]];
  function walker(index) {
    var person=PATROLS[index];
    return '<g class="iso-figure ' + (person.id==='wrapping-operator' ? 'iso-wrapping-operator' : 'iso-roamer') + '" id="' + person.id + '">'
      + '<g class="op-walk"></g></g>';
  }

  /* The five named operators stand in clear spaces beside their work areas. */
  var TEAM = [
    { name: 'Sơn',  x: 82, y: 63, crew: 'crewA', talk: '0s', heading:-48, area: 'returnables' },
    { name: 'Ngân', x: 27, y: 25, crew: 'crewB', talk: '3.4s', ponytail: true, area: 'aisle' },
    { name: 'Minh', x: 36, y: 65, crew: 'crewC', talk: '6.8s', heading:-126, area: 'gr', task:'scan' },
    { name: 'Trí',  x: 56, y: 63, crew: 'crewD', talk: '1.7s', heading:-55, area: 'interlock' },
    { name: 'Bách', x: 89, y: 23, crew: 'crewE', talk: '5.1s', heading:-140 }
  ];

  function crew() {
    return '<g class="iso-team">' + TEAM.map(function (m, index) {
      var y = m.y;
      var base = pt(m.x, y, 0);
      var bubbleY = base[1] - 44;      // clear of the hard hat
      var nameY = base[1] - 62;        // and the name clears the bubble
      var bx = base[0] - 11;

      var dots = [0, 1, 2].map(function (n) {
        return '<circle class="iso-chat-dot" cx="' + (bx + 6 + n * 5).toFixed(1)
          + '" cy="' + (bubbleY + 8).toFixed(1) + '" r="1.6"/>';
      }).join('');

      return '<g class="iso-member" data-member="' + index + '" data-work-area="' + (m.area || 'putaway') + '" tabindex="-1" role="button" aria-label="' + m.name + '" style="--gesture-delay:' + m.talk + '">'
