/* css/tokens.css */
/* Design tokens.
   Colour keeps the Schneider anchor and the spec's semantic rules. Type,
   spacing, radius, materials and motion follow Apple's Human Interface
   Guidelines: a real type scale, an 8pt grid, translucent materials for
   layering, and 44px minimum hit targets.

   One deliberate departure: HIG uses capsule buttons. Ours stay rectangular
   with a soft radius, because pill buttons are banned in this project. */

:root {
  /* Brand */
  --se-green:      #3DCD58;
  --se-green-mid:  #2FA847;
  --se-green-deep: #1F6F4A;
  --se-green-wash: #E3F5E8;

  /* Materials, taken from the warehouse itself */
  --carton:      #C8A57B;
  --carton-deep: #8A6A42;
  --floor:       #EFEAE0;   /* kraft paper */
  --panel:       #E3DCCB;   /* concrete */
  --panel-2:     #FBF8F1;   /* elevated surface, still warm */
  --ink:         #17150F;   /* label */
  --ink-2:       #5C574F;   /* secondary label */
  --ink-3:       #8E8880;   /* tertiary label */
  --line:        #D4CFC6;   /* separator */
  --line-soft:   #E4E0D8;   /* opaque separator */
  --steel:       #33383B;

  /* Semantic, information only */
  --hazard:        #F2B705;
  --hazard-deep:   #8A6800;
  --hazard-wash:   #FDF3D6;
  --verified:      var(--se-green);
  --verified-deep: var(--se-green-deep);
  --verified-wash: var(--se-green-wash);
  --scan:          #0B5FFF;
  --scan-wash:     #E4EDFF;
  --machine:       #E9A93C;
  --machine-deep:  #7A5410;

  /* Station identity. Deliberately OUTSIDE the semantic trio: green, hazard
     yellow and scan blue keep their meanings, so identity has to come from
     somewhere else. These three are earthy and industrial and cannot be
     mistaken for a status. */
  --petrol:      #0E4B4F;   /* the dock */
  --petrol-soft: #D3E2E1;
  --oxide:       #A8451F;   /* the build area */
  --oxide-soft:  #F3DFD6;
  --moss:        #4A5A2B;   /* the racks */
  --moss-soft:   #E2E6D2;

  /* Vehicles. Silver cab, weathered steel container, dark glass and rubber. */
  --truck-cab:   #D8D3C7;
  --truck-glass: #6F8E99;
  --cont-body:   #3E5F6B;
  --tyre:        #1B1E20;
  --op-trouser:  #2A3138;
  --op-skin:     #C89A73;
  --op-helmet:   #F4F1E8;
  --hair:        #241C15;
  --crew-a:      #2A3138;
  --crew-b:      #4A3A52;
  --crew-c:      #23404A;
  --crew-d:      #4A3226;
  --crew-e:      #2E3A2C;

  /* The hall itself. Daylight concrete, not a black void. */
  --hall-bg:     #E3E9EC;
  --hall-top:    #CAD2D3;
  --hall-left:   #7F9198;
  --hall-right:  #9DADB2;
  --hall-grid:   #ADBCC1;
  --hall-steel:  #4A5558;
  --hall-steel-2:#333C3F;
  --hall-steel-3:#3F4A4D;
  --hall-lamp:   #F6F2E6;
  --hall-haze:   rgba(248, 253, 255, .9);
  --wall:        #B4C4CB;
  --wall-rib:    #8CA1AD;
  --column:      #647C88;
  --paint-lane:  #D9A812;
  --paint-walk:  #ADC7BE;
  --pool:        rgba(247, 253, 255, .36);

  /* Surface texture, built from gradients so nothing has to be downloaded. */
  --grain: repeating-linear-gradient(
             45deg,
             rgba(28, 26, 23, .018) 0 2px,
             transparent 2px 4px);
  --tape: repeating-linear-gradient(
            -45deg,
            var(--machine) 0 8px,
            var(--ink) 8px 16px);

  /* Terminal screens */
  --screen-bg:   #1A1E20;
  --screen-ink:  #F2F0EC;
  --screen-dim:  #948E86;
  --screen-line: #33393C;

  /* Radius. Soft, never a capsule. */

  --radius-lg:  14px;  /* cards and sheets */

  --fs-h2:   clamp(1.375rem, 1.2rem + .7vw, 1.75rem); /* title 2 */
  --fs-h3:   1.25rem;                                  /* title 3 */
  --fs-body: 1.0625rem;                                /* body, 17px */
  --fs-sm:   .9375rem;                                 /* subhead, 15px */
  --fs-xs:   .8125rem;                                 /* footnote, 13px */

  --lh-body: 1.47;
  --lh-tight: 1.12;
  --tracking-tight: -.022em;   /* HIG tightens as size grows */
  --weight-emphasis: 590;

  --sp-1: .25rem;   /*  4 */
  --sp-2: .5rem;    /*  8 */
  --sp-3: .75rem;   /* 12 */
  --sp-4: 1rem;     /* 16 */
  --sp-5: 1.5rem;   /* 24 */
  --sp-6: 2rem;     /* 32 */
  --sp-7: 3rem;     /* 48 */
  --sp-8: 4rem;     /* 64 */

  --hit: 44px;      /* minimum touch target */
  --wrap: 1120px;

  --dur: 300ms;
  --dur-slow: 520ms;

/* css/base.css */
/* Reset and base typography. */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--floor);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);

  letter-spacing: var(--tracking-tight);
  font-family: var(--font-display);
  font-weight: 700;
  text-wrap: balance;

h1 { font-size: var(--fs-hero); letter-spacing: -.032em; max-width: 15ch; }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); letter-spacing: -.018em; font-weight: var(--weight-emphasis); }

p { margin: 0 0 var(--sp-4); max-width: 66ch; }
p:last-child { margin-bottom: 0; }

ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }

svg { display: block; }

button { font: inherit; color: inherit; }

.mono {
  font-family: var(--font-mono);
  font-size: .93em;
  letter-spacing: .01em;
}

.wrap {
  width: min(100% - 2.5rem, var(--wrap));
  margin-inline: auto;
}

.lede {
  font-size: clamp(1rem, .95rem + .25vw, 1.125rem);
  color: var(--ink-2);
  max-width: 54ch;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: var(--panel-2);
  padding: var(--sp-3) var(--sp-4);
  z-index: 100;
}
.skip-link:focus { left: var(--sp-4); top: var(--sp-4); }

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--se-green) 55%, transparent);
  outline-offset: 3px;
  border-radius: var(--radius-sm);

button, a.btn, .bin, .slot, .ch-box, .ch-line, .icon-btn {

.bin { min-height: 0; }

[hidden] { display: none !important; }

<style>
/* css/layout.css */
/* Page level layout. */

/* ---------- Top bar ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--material-thick);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line);
}

.topbar__inner {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  min-height: var(--topbar-base);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  text-decoration: none;
  margin-right: auto;
  min-width: 0;
}
.brand__mark { width: 26px; height: 26px; flex: none; color: var(--se-green-deep); }
.brand__text { display: flex; flex-direction: column; line-height: 1.2; }
.brand__name { font-weight: 600; letter-spacing: -.01em; }
.brand__sub { font-size: var(--fs-xs); color: var(--ink-3); }

.topbar__nav { display: flex; gap: var(--sp-5); }
.topbar__nav a {
  display: inline-flex;
  align-items: center;
  min-height: var(--hit);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  text-decoration: none;
  padding-block: var(--sp-2);
  border-bottom: 2px solid transparent;
}
.topbar__nav a:hover { color: var(--ink); border-bottom-color: var(--se-green); }
.topbar__nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--se-green); }

.topbar__tools { display: flex; flex: none; gap: var(--sp-2); }

/* ---------- Section bands ---------- */

.band { padding-block: var(--sp-7); border-top: 1px solid var(--line); }
.band--alt { background: var(--panel); }
.band > .wrap > h2 { margin-bottom: var(--sp-3); }

.section-lede {
  color: var(--ink-2);
  max-width: 60ch;
  margin-bottom: var(--sp-6);
}

.note {
  margin-top: var(--sp-5);
  font-size: var(--fs-sm);
  color: var(--ink-3);
  border-left: 2px solid var(--line);
  padding-left: var(--sp-3);
}

.fineprint { font-size: var(--fs-xs); color: var(--ink-3); }

/* ---------- Hero ---------- */

.hero { padding-block: var(--sp-7) var(--sp-6); }

.hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--sp-7);
  align-items: center;
}

.hero__text h1 { margin-bottom: var(--sp-4); }
.hero__text .lede { margin-bottom: var(--sp-3); }
.hero__text .btn { margin-top: var(--sp-4); }

/* ---------- Stations ---------- */

.station {
  display: grid;
  grid-template-columns: 62px minmax(0, 1fr);
  border-top: 1px solid var(--line);
}
.station:last-of-type { border-bottom: 1px solid var(--line); }

.station__rail {
  position: relative;
  display: flex;
  justify-content: center;
  padding-top: var(--sp-6);
}
.station__rail::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 8px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(
    -45deg,
    var(--machine) 0 6px,
    transparent 6px 12px
  );
  opacity: .32;
}
.station__num {
  position: relative;
  width: 30px; height: 30px;
  display: grid;
  place-items: center;
  background: var(--floor);
  border: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.band--alt .station__num { background: var(--panel); }
.station.is-done .station__num {
  background: var(--verified-wash);
  border-color: var(--se-green);
  color: var(--se-green-deep);
}

.station__body { padding: var(--sp-6) 0 var(--sp-7) var(--sp-5); }

.station__head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: var(--sp-4);
  margin-bottom: var(--sp-4);
}
.station__icon { width: 32px; height: 32px; color: var(--steel); margin-top: 2px; }
.station__title h3 { font-size: var(--fs-h2); margin-bottom: var(--sp-1); }
.station__role { color: var(--ink-2); font-size: var(--fs-sm); margin: 0; }

/* ---------- Flow board ---------- */

.flow__steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--sp-4);
}
.flow__reset { margin-top: var(--sp-6); }

/* ---------- Footer ---------- */

.footer { border-top: 1px solid var(--line); padding-block: var(--sp-5); }
.footer__inner {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-4);
  align-items: baseline;
  justify-content: space-between;
}
.footer__note { font-size: var(--fs-sm); color: var(--ink-3); margin: 0; max-width: 60ch; }
.footer__links { display: flex; gap: var(--sp-4); font-size: var(--fs-sm); }
.footer__links a { color: var(--ink-2); }

/* ---------- Responsive ---------- */

@media (max-width: 1100px) {
  .topbar__inner {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0 var(--sp-3);
    padding-top: var(--sp-2);
  }
  .topbar__nav { grid-column: 1 / -1; grid-row: 2; gap: var(--sp-5); }
  .topbar__tools { grid-column: 2; grid-row: 1; }
  .brand__sub { display: none; }
}

@media (max-width: 900px) {
  .hero__inner { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
  h1 { max-width: 20ch; }
  .flow__steps { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 640px) {
  /* The bar has to fit --topbar-base, because that is what the views offset by.
     The subtitle is the first thing to go: it is the longest string in the
     header and the only one that wraps to a third line in Vietnamese. */
  :root { --topbar-base: 56px; --topbar-h: 56px; }
  .brand__sub { display: none; }
  .station { grid-template-columns: 40px minmax(0, 1fr); }
  .station__body { padding-left: var(--sp-4); }
  .station__head { grid-template-columns: auto minmax(0, 1fr); }
  .station__head .stamp { grid-column: 2; justify-self: start; }
  .band { padding-block: var(--sp-6); }
}

/* Below this the two tool buttons cannot keep their labels and still leave the
   brand a readable width, so they fall back to icons. The accessible name comes
   from aria-label, set alongside the label text in main.js. */
@media (max-width: 460px) {
  .icon-btn { padding: .42rem; min-width: var(--hit); justify-content: center; }
  .icon-btn span { display: none; }
  .brand { gap: var(--sp-2); }
  .brand__name { font-size: var(--fs-sm); }
  .topbar__tools { gap: var(--sp-1); }
}

}
.line__code { font-family: var(--font-mono); }

.scr__note {

  padding: .6rem .8rem;
  border-radius: var(--radius-sm);

.overlay {

  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  align-items: safe center;

@media (max-width: 640px) {

/* css/views.css */
/* Full screen views. Nothing scrolls to reach a station. */

html, body { height: 100%; }
body { overflow: hidden; }

/* Paper grain over everything, so surfaces read as material not as chrome. */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--grain);
  pointer-events: none;
  z-index: 70;
}
body:has(#view-home.is-active)::after { background: none; }

.view {
  position: fixed;   /* load bearing: gives the view its height */
  inset: 0;
  top: var(--topbar-h);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.view:not(.is-active) { display: none; }

/* The project document scrolls within the active view. */
.view--doc { overflow-y: auto; padding-bottom: var(--sp-7); }

/* ---------- Home: a fitted warehouse canvas ----------
   The copy stays in the lower-left corner at every viewport and zoom level.
   The canvas owns its dimensions; neither the scene nor copy adds a scroll. */
#view-home.is-active {
  display: block;
  overflow: hidden;
}
#view-home .twin {
  --scene-pad: clamp(12px, 2.2vmin, 32px);
  --copy-height: 220px;
  --scene-head-height: 48px;
  position: absolute;
  inset: 0;
  border: 0;
  display: block;
  container-type: size;
}
#view-home .twin__head {
  position: absolute;
  top: var(--scene-pad);
  left: var(--scene-pad);
  width: calc(100% - 2 * var(--scene-pad));
  z-index: 2;
}
#view-home #twin-stage {
  position: absolute;
  inset: 0;
}
#view-home .twin__svg {
  width: 100%;
  height: 100%;
  max-height: none;
  display: block;
}

/* ---------- A station view ----------
   Each station carries its own colour on a painted spine and a stencilled
   number, so the three do not read as one template repeated. */

#view-gr        { --station: var(--petrol); --station-soft: var(--petrol-soft); }
#view-putaway   { --station: var(--oxide); --station-soft: var(--oxide-soft); }
#view-interlock { --station: var(--moss);  --station-soft: var(--moss-soft); }

.view[id^="view-"] .app-view { position: relative; }

/* The stencilled number, set into the background rather than printed on top. */
.app-view::before {
  content: attr(data-figure);
  position: absolute;
  right: -.06em;
  bottom: -.22em;
  font-family: var(--font-mono);
  font-size: clamp(14rem, 34vh, 26rem);
  font-weight: 700;
  line-height: .8;
  color: var(--station);
  opacity: .07;
  pointer-events: none;
  z-index: 0;
}
.app-view > * { position: relative; z-index: 1; }

/* ---------- A station view ---------- */

.app-view {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
  gap: var(--sp-6);
  align-items: center;
  /* 'safe' matters: with plain centring, content taller than the view overflows
     equally in both directions and the top half becomes unreachable. Safe
     centring falls back to start-alignment exactly when that would happen. */
  align-items: safe center;
  width: min(100% - 3rem, var(--wrap));
  margin-inline: auto;
  padding-block: var(--sp-5);
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.app-view__brief {
  min-width: 0;
  padding-left: var(--sp-5);
  border-left: 6px solid var(--station);
}

.app-view__eyebrow {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--station);
  margin-bottom: var(--sp-3);
}
.app-view__eyebrow .station__icon { color: var(--station); }
.app-view__brief .taglist li {
  border-color: var(--station);
  background: var(--station-soft);
  color: var(--station);
}
.app-view .back-link:hover { color: var(--station); }
.app-view__screen .terminal { border-top: 5px solid var(--station); }
.app-view__brief h2 { margin-bottom: var(--sp-2); }
.app-view__role { color: var(--ink-2); font-size: var(--fs-sm); margin-bottom: var(--sp-4); }
.app-view__brief p { font-size: var(--fs-sm); color: var(--ink-2); }
.app-view__actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }

.app-view__screen { min-width: 0; display: flex; justify-content: center; }
.app-view__screen .terminal { margin: 0; width: 100%; max-width: 640px; }
.app-view__screen .scr__body { max-height: 52vh; overflow-y: auto; }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  background: transparent;
  border: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
  font-weight: var(--weight-emphasis);
  cursor: pointer;
  padding: 0;
}
.back-link:hover { color: var(--ink); }
.back-link svg { width: 18px; height: 18px; }

/* ---------- Progress, shown on every view ---------- */

.dots { display: flex; align-items: center; gap: var(--sp-2); }
.dots__dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--line);
  transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.dots__dot.is-filled { background: var(--se-green); transform: scale(1.25); }

/* ---------- The forklift transition ---------- */

.transition {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  overflow: hidden;
}
.transition__curtain {
  position: absolute;
  inset: 0;
  background: var(--steel);
  transform: translateX(-102%);
}
[data-theme="dark"] .transition__curtain { background: #0A0D0F; }
.transition__truck {
  position: absolute;
  bottom: 12%;
  left: 0;
  width: min(46vw, 520px);
  transform: translateX(-110%);
}
.transition__truck svg { width: 100%; height: auto; }

@media (max-width: 1100px) {
  .app-view {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--sp-4);
    align-content: start;
    align-items: start;
  }
  .app-view__screen .scr__body { max-height: none; }
  .transition__truck { width: 72vw; bottom: 16%; }

}


/* Leave the corner copy its own room in a narrow canvas. Both regions remain
   fitted to the same screen instead of forming a taller, scrolling page. */
@container (max-aspect-ratio: 7/5) {
  #view-home #twin-stage {
    inset: var(--scene-head-height) 0 calc(var(--copy-height) + 2 * var(--scene-pad));
  }
}
@container (max-height: 340px) and (min-aspect-ratio: 7/5) {
  #view-home #twin-stage { inset: var(--scene-head-height) 0 0 46%; }
}

@media (max-width: 640px) {
  .app-view { width: calc(100% - 2rem); }
  .app-view__brief { padding-left: var(--sp-3); }
  .app-view__eyebrow { flex-wrap: wrap; }
}

/* css/animations.css */
/* Warehouse activity and interaction animations. */

/* Truck visibility supplies the shared clock. vehicles.js uses that clock to
   turn the actual geometry, reverse to the dock, and leave cab first. */
/* ---------- The dock cycle ----------
   One 24s clock for the receiving truck and gate. The logistics controller
   waits for this dock to open before collecting its pallet. */

.twin__hall { --dock-cycle: 24s; }

@keyframes dock-truck {
  0%   { opacity: 0; }
  4%   { opacity: 1; }
  14%, 68% { opacity: 1; }
  84%, 100% { opacity: 0; }
}
.iso-dock-truck {
  transform-box: view-box;
  animation: dock-truck var(--dock-cycle) linear infinite;
}

/* The activity renderer reads the receiving truck's clock to lift the gate.
   It also holds the gate open for a crossing forklift between deliveries. */
.iso-dock-gate {
  transform-box: view-box;
}

/* Wheels turn while a vehicle is moving. */
@keyframes wheel-roll {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.iso-wheel-spin { transform-box: fill-box; transform-origin: center; }
.iso-shipping .iso-wheel-spin,
.iso-dock-truck .iso-wheel-spin,
.iso-shuttle .iso-wheel-spin { animation: wheel-roll 900ms linear infinite; }

/* The team talking. Each bubble opens, its dots run, then it closes; the
   delays are staggered across the five so it reads as a conversation rather
   than five people speaking at once. */
@keyframes chat-pop {
  0%   { opacity: 0; transform: scale(.6); }
  3%   { opacity: 1; transform: scale(1); }
  17%  { opacity: 1; transform: scale(1); }
  21%  { opacity: 0; transform: scale(.85); }
  100% { opacity: 0; transform: scale(.85); }
}
@keyframes chat-dot {
  0%, 100% { opacity: .25; }
  50%      { opacity: 1; }
}
.iso-chat { animation: chat-pop 17s ease-in-out infinite; }
.iso-chat-dot { animation: chat-dot 1200ms ease-in-out infinite; }
.iso-chat-dot:nth-of-type(2) { animation-delay: 180ms; }
.iso-chat-dot:nth-of-type(3) { animation-delay: 360ms; }

/* Operator joints and footfalls use the shared warehouse clock in operators.js. */
.iso-yield-light { fill: var(--machine); stroke: var(--ink); stroke-width: 1; visibility: hidden; }
.iso-shuttle.is-yielding .iso-yield-light { visibility: visible; }
.iso-stretch-film polygon { fill: #e4f2ee; fill-opacity: .12; stroke: #e4f2ee; stroke-opacity: .2; stroke-width: .35; }
.iso-stretch-film path { fill: none; stroke: #e4f2ee; stroke-opacity: .4; stroke-width: .4; }
.iso-stretch-web { fill: #e4f2ee; fill-opacity: .18; stroke: #e4f2ee; stroke-opacity: .35; stroke-width: .4; }
/* CSS and SVG path animations both pause offscreen and follow live changes
   to the system's reduced-motion preference. SVG timing is handled in twin.js. */
#twin-stage.is-paused .twin__svg * { animation-play-state: paused !important; }
#twin-stage.is-still .twin__svg * { animation: none !important; }
#twin-stage.is-still .iso-shipping,
#twin-stage.is-still .iso-dock-truck { opacity: 1; transform: none; }
#twin-stage.is-still .iso-chat { opacity: 1; }
#twin-stage.is-still .iso-dock-gate { transform: translateY(-54px); }

@media (prefers-reduced-motion: reduce) {
  .op-leg, .op-arm-back, .iso-member-body, .iso-member-arm,
  #returns-op, #roamer, #operator { animation: none !important; }
}

@keyframes ship-cycle {
  0%   { opacity: 0; }
  5%   { opacity: 1; }
  20%, 60% { opacity: 1; }
  80%, 100% { opacity: 0; }
}
.iso-shipping {
  transform-box: view-box;
  animation: ship-cycle 48s linear infinite;
}

.iso-truck { transform-box: view-box; }

/* ---------- View transition ----------
   The curtain covers, the view swaps behind it, the curtain leaves. The truck
   runs ahead of the curtain the whole way. */

@keyframes curtain-sweep {
  0%   { transform: translateX(-102%); }
  46%  { transform: translateX(0); }
  54%  { transform: translateX(0); }
  100% { transform: translateX(102%); }

@keyframes truck-sweep {

  100% { transform: translateX(110vw); }

.transition.is-running .transition__curtain { animation: curtain-sweep 1700ms var(--ease-out) both; }

@keyframes route-flow {

  to   { stroke-dashoffset: -52; }

.iso-route-flow { animation: route-flow 1.9s linear infinite; }

@keyframes node-ping {

/* ---------- Opening sequence ----------

@keyframes hero-settle {

  to   { opacity: 1; transform: none; }

.terminal.is-open { animation: terminal-in var(--dur) var(--ease) both; }

/* ---------- Station completion stamp ---------- */

@keyframes stamp-in {

.scanner.is-scanning::after {

.forklift.is-driving .fk-shell { animation: bob 620ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.forklift.is-driving .fk-wheel { animation: roll 780ms linear infinite; transform-box: fill-box; transform-origin: center; }
.forklift.is-driving .fk-carriage { animation: lift var(--dur-forklift) var(--ease) both; }
.forklift.is-driving .fk-beacon { animation: beacon 520ms steps(1, end) infinite; }

/* ---------- Finale ---------- */

@keyframes overlay-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes panel-in {
  from { opacity: 0; transform: translateY(16px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
.overlay.is-open { animation: overlay-in 200ms var(--ease) both; }
.overlay.is-open .overlay__panel { animation: panel-in 340ms var(--ease) 60ms both; }

@keyframes route-draw {
  from { stroke-dashoffset: 300; }
  to   { stroke-dashoffset: 0; }
}
.overlay.is-open .finale__line-fill {
  stroke-dasharray: 300;
  animation: route-draw 1200ms var(--ease) 220ms both;
}

@keyframes tick-draw {
  from { stroke-dashoffset: 22; }
  to   { stroke-dashoffset: 0; }
}
.overlay.is-open .finale__tick {
  stroke-dasharray: 22;
  animation: tick-draw 260ms var(--ease) both;
}
.overlay.is-open [data-node="1"] .finale__tick { animation-delay: 420ms; }
.overlay.is-open [data-node="2"] .finale__tick { animation-delay: 800ms; }
.overlay.is-open [data-node="3"] .finale__tick { animation-delay: 1180ms; }

@keyframes pallet-travel {
  0%   { transform: translate(30px, 90px); }
  100% { transform: translate(330px, 90px); }
}
.finale__pallet { transform: translate(30px, 90px); }
.overlay.is-open .finale__pallet { animation: pallet-travel 1200ms var(--ease) 220ms both; }

/* ---------- Reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

  .transition.is-running .transition__curtain,
  .transition.is-running .transition__truck,
  .transition.is-running .tf-body,
  .transition.is-running .tf-wheel-rotation,
  .transition.is-running .tf-beacon-glow,
  .iso-shipping,
  .op-walk,
  .iso-wheel-spin,
  .iso-chat,
  .iso-chat-dot,
  .iso-dock-truck,
  .iso-dock-gate,
  .op-arm,
  .op-beam,
  .iso-route-flow,
  .iso-node-ping,
  .reticle.is-live,
  .wipe.is-on,
  body.is-intro .stage-overlay h1,
  body.is-intro .stage-overlay .btn,
  body.is-intro .scanbox,
  body.is-intro .hero__h2,
  body.is-intro .hero__text .lede,
  body.is-intro .hero__text .fineprint,
  body.is-intro .hero__text .btn,
  body.is-intro .cn-label,
  body.is-intro .cn-bars,
  body.is-intro .cn-matrix,
  body.is-intro .cn-code,
  .terminal.is-open,
  .stamp.is-in,
  .scanbox__beam.is-on,
  .scanbox__row,
  .scanner__code.is-in,
  .line.is-in,
  .slot.is-filled.is-in,
  .elev-box.is-in,
  .bin__pallet.is-in,
  .overlay.is-open,
  .overlay.is-open .overlay__panel,
  .overlay.is-open .finale__line-fill,
  .overlay.is-open .finale__tick,
  .overlay.is-open .finale__pallet,
  .forklift.is-driving,
  .forklift.is-driving .fk-shell,
  .forklift.is-driving .fk-wheel,
  .forklift.is-driving .fk-carriage,
  .forklift.is-driving .fk-beacon {
    animation: none !important;
  }

  .scanner.is-scanning::after { display: none; }
  .progress__seg::after { transition: none; }
}

/* js/state.js */
/* Completion state for the three stations. In memory only: nothing about a
   visitor is stored or sent anywhere. */

(function (global) {
  'use strict';

  var APPS = ['gr', 'putaway', 'interlock'];
  var done = [];
  var listeners = [];

  function isDone(app) { return done.indexOf(app) !== -1; }
  function count() { return done.length; }
  function allDone() { return done.length === APPS.length; }

  function complete(app) {
    if (APPS.indexOf(app) === -1 || isDone(app)) { return false; }
    done.push(app);
    notify(app);
    return true;
  }

  function reset() {
    done = [];
    notify(null);
  }

  function notify(app) {
    listeners.forEach(function (fn) {
      fn({ app: app, count: count(), all: allDone() });
    });
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      listeners = listeners.filter(function (item) { return item !== fn; });
    };
  }

  global.WarehouseState = {
    apps: APPS,
    isDone: isDone,
    count: count,
    allDone: allDone,
    complete: complete,
    reset: reset,
    subscribe: subscribe
  };
})(window);

</script>

      }

        var delta=ankle.map(function(v,j){return v-hip[j];}),length=Math.hypot.apply(null,delta);
        var bend=Math.sqrt(Math.max(0,.72*.72-length*length/4));
        var forward=normal([0,-delta[2],delta[1]]);

      });

      var chest=2.91+bob+breath;
      cuboid(torso,[0,lean,chest],[1.45,.83,1.26]);
      cuboid(belt,[0,lean,chest-.31],[1.47,.86,.11]);
      [-1,1].forEach(function (side,i) {cuboid(stripes[i],[side*.41,lean+.425,chest+.2],[.12,.025,.78]);});
      cuboid(neck,[0,lean,3.6+bob+breath],[.34,.35,.25]);
      var hc=Math.cos(headAngle),hs=Math.sin(headAngle),headAxes=[[hc,hs,0],[-hs,hc,0],[0,0,1]];
      var nod=task*.065;
      cuboid(head,[0,lean+nod,3.89+bob+breath],[.81,.73,.61],headAxes);
      cuboid(brim,[0,lean+.05+nod,4.23+bob+breath],[1.09,1.01,.12],headAxes);
      cuboid(helmet,[0,lean+nod,4.38+bob+breath],[.94,.86,.22],headAxes);
      if(hair) cuboid(hair,[0,lean-.46,3.64+bob+breath],[.42,.25,.66],headAxes);
      var hands=[];
      arms.forEach(function (arm,i) {
        var side=i ? 1 : -1;
        var swing=Math.sin(phase+i*Math.PI)*.34*weight;
        var target=swing;
        if(!walking) target=task*(opts.task==='scan' ? 1.0 : .62)*(i ? 1 : .35);
        if(speaking && !still) target+=(.32+Math.sin(clock*3)*.12)*(i ? 1 : .3);
        if(i===1 && wave) target=wave*(2.4+Math.sin(greetingTime*TAU*2.1)*.21);

        var elbow=[shoulder[0]+side*wave*(i ? .16 : 0),shoulder[1]+Math.sin(angle)*.56,shoulder[2]-Math.cos(angle)*.56];
        var foreAngle=angle+.16+task*.46;
        var hand=[elbow[0]+(i ? wave*.24 : 0),elbow[1]+Math.sin(foreAngle)*.51,elbow[2]-Math.cos(foreAngle)*.51];
        if(person.carrying) {
          elbow=[side*.72,.48,3.02+bob];
          hand=[side*.66,1.04,(person.carryHeight || 2.3)+.4];
        }
        bone(arm.upper,shoulder,elbow,.29,.34);bone(arm.lower,elbow,hand,.25,.28);
        cuboid(arm.hand,hand,[.27,.3,.27]);hands.push(hand);
      });
      if(scanner) {
        cuboid(scanner,add(hands[1],[0,.16,.13]),[.34,.42,.22]);
        cuboid(screen,add(hands[1],[0,.16,.245]),[.24,.28,.015]);
      }
      var ordered=parts.slice().sort(function(a,b){return a.depth-b.depth;});
      var order=ordered.map(function(p){return p.id;}).join(',');
      if(order!==lastOrder) {ordered.forEach(function(p){body.appendChild(p.group);});lastOrder=order;}
      node.dataset.operatorHeading=facing.toFixed(1);
      node.dataset.operatorAction=greeting ? 'greeting' : person.yieldTo ? (walking ? 'stepping-aside' : 'waiting')
        : walking ? 'walking' : person.turning ? 'turning' : task>.05 ? (opts.task==='wrap' ? 'wrapping' : 'checking') : 'idle';

<script>
/* js/twin.js */
/* The reference floor plan: two rack banks between container docks, opposite
   Goods Received, the wrapping station, and returnable crates across one aisle.
   SVG geometry keeps the plan sharp while retaining the existing map controls. */

(function (global) {
  'use strict';

  // Isometric projection. Plan coordinates go in, screen coordinates come out.
  var COS = 0.866, SIN = 0.5, SCALE = 6.1, OX = 430, OY = 74;
  var FLOOR_Z=.7,WRAPPER_TOP=1.75;

  function p(x, y, z) {
    var sx = (x - y) * COS * SCALE + OX;
    var sy = (x + y) * SIN * SCALE - (z || 0) * SCALE + OY;
    return sx.toFixed(1) + ',' + sy.toFixed(1);
  }

  function pt(x, y, z) {
    return [Math.round(((x-y)*COS*SCALE+OX)*10)/10,
      Math.round(((x+y)*SIN*SCALE-(z || 0)*SCALE+OY)*10)/10];
  }

  function poly(points, cls) {
    return '<polygon class="' + cls + '" points="' + points.join(' ') + '"/>';
  }

  /* A box standing on the floor at height z0, drawn as three faces. */
  function box(x, y, w, d, h, kind, z0) {
    var base = z0 || 0;
    var top = base + h;
    var out = poly([p(x, y, top), p(x + w, y, top), p(x + w, y + d, top), p(x, y + d, top)], 'iso-' + kind + '-top')
      + poly([p(x + w, y, top), p(x + w, y + d, top), p(x + w, y + d, base), p(x + w, y, base)], 'iso-' + kind + '-right')
      + poly([p(x, y + d, top), p(x + w, y + d, top), p(x + w, y + d, base), p(x, y + d, base)], 'iso-' + kind + '-left');
    return /^(rack|container-|tote-|table|film)/.test(kind)
      ? '<g class="iso-material iso-material--' + kind + '">' + out + '</g>' : out;
  }

  var W = 112, D = 66;          // hall footprint in plan units
  var AISLE = 33;               // the aisle everything runs along
  var NODES = [
    { app: 'gr', x: 30, y: 40, num: '01', area: [10, 42, 26, 22] },
    { app: 'putaway', x: 56, y: 27, num: '02', area: [22, 2, 65, 27] },
    { app: 'interlock', x: 58, y: 43, num: '03', area: [38, 42, 42, 22] }
  ];
  var environment=global.WarehouseEnvironment.create({point:pt,box:box});


  /* Paint on the floor: the walking lane, the aisle edges, and hazard
     chevrons across the dock approach. */
  function floorMarks() {
    var out = zone(0, 29, W, 12, 'iso-main-aisle');
    out += zone(45, 0, 11, 29, 'iso-main-aisle');
    out += zone(15, 0, 7, 29, 'iso-main-aisle');
    out += zone(88, 0, 9, 29, 'iso-main-aisle');
    [[22, 19, 23, 3], [59, 19, 28, 3], [10, 62, 27, 3]].forEach(function (a) {
      out += zone(a[0], a[1], a[2], a[3], 'iso-pedestrian-strip');
    });
    out += '<path class="iso-lane" d="M' + p(0, 29, .8) + 'L' + p(W, 29, .8)
      + 'M' + p(0, 41, .8) + 'L' + p(W, 41, .8) + '"/>';
    [[22, 22, 22, 6], [59, 22, 28, 6], [11, 45, 12, 16], [25, 45, 11, 16],
      [85, 47, 11, 15], [98, 47, 11, 15]].forEach(function (a) {
      out += palletPad(a[0], a[1], a[2], a[3]);
    });
    // These are painted floor markings. Keep them below the rack shadows,
    // rather than repainting a bright, shadowless floor inside each rack.
    [23,63].forEach(function(x){out+='<g class="iso-rack-floor">'+palletPad(x-1,2,24,17)+'</g>';});
    return out;
  }

  function palletPad(x, y, w, d) {
    var out = zone(x, y, w, d, 'iso-pallet-pad');
    var slats = '';
    for (var sy = y + 1; sy < y + d; sy += 1.8) {
      slats += 'M' + p(x + .7, sy, .85) + 'L' + p(x + w - .7, sy, .85);
    }
    return out + '<path class="iso-pallet-slats" d="' + slats + '"/>';
  }

  /* High bay lighting: a fitting overhead and the pool it throws. */
  function lighting() {
    var out = '<defs><radialGradient id="pool" cx="50%" cy="50%" r="50%">'
      + '<stop offset="0%" class="pool-in"/><stop offset="100%" class="pool-out"/>'
      + '</radialGradient></defs>';
    [[20, 20], [56, 20], [92, 20], [20, 48], [56, 48], [92, 48]].forEach(function (c) {
      var s = pt(c[0], c[1], 0.76);
      out += '<ellipse class="iso-pool" cx="' + s[0] + '" cy="' + s[1] + '" rx="86" ry="50"/>';
    });
    return out;
  }

  function floorPlate() {
    var out = box(0, 0, W, D, FLOOR_Z, 'floor');
    var lines = [];
    for (var gx = 0; gx <= W; gx += 8) {
      lines.push('M' + p(gx, 0, 0.72) + 'L' + p(gx, D, 0.72));
    }
    for (var gy = 0; gy <= D; gy += 8) {
      lines.push('M' + p(0, gy, 0.72) + 'L' + p(W, gy, 0.72));
    }
    return out + '<path class="iso-grid" d="' + lines.join('') + '"/>';
  }

  function zone(x, y, w, d, cls) {
    return poly([p(x, y, 0.75), p(x + w, y, 0.75), p(x + w, y + d, 0.75), p(x, y + d, 0.75)], cls);
  }

  /* Painter's algorithm: in this projection a larger (x + y) is nearer the
     viewer, so a shape with a larger centre sum must be drawn later or it will
     be painted over by something behind it. */
  function paint(specs) {
    return specs.slice().sort(function (a, b) {
      var ka = (a[0] + a[2] / 2) + (a[1] + a[3] / 2);
      var kb = (b[0] + b[2] / 2) + (b[1] + b[3] / 2);
      if (ka !== kb) { return ka - kb; }
      return (a[6] || 0) - (b[6] || 0);
    }).map(function (s) {
      return box(s[0], s[1], s[2], s[3], s[4], s[5], s[6]);
    }).join('');
  }

  /* A wheel is a circle standing in the x-z plane, so it has to be built from
     projected points rather than an <ellipse>: the two screen axes are not
     perpendicular, so an axis aligned ellipse would look wrong. */
  function discX(cx, cy, cz, r, cls) {
    var pts = [];
    for (var i = 0; i < 18; i++) {
      var a = i / 18 * Math.PI * 2;
      pts.push(p(cx + r * Math.cos(a), cy, cz + r * Math.sin(a)));
    }
    return '<polygon class="' + cls + '" points="' + pts.join(' ') + '"/>';
  }

  function wheels(list) {
    return list.map(function (w) {
      return '<g class="iso-wheel">'
        + discX(w[0], w[1], w[2], w[3], 'iso-tyre-disc')
        + '<g class="iso-wheel-spin">'
        +   discX(w[0], w[1], w[2], w[3] * 0.42, 'iso-hub-disc')
        +   '<path class="iso-spoke" d="M' + p(w[0] - w[3] * 0.7, w[1], w[2])
        +     'L' + p(w[0] + w[3] * 0.7, w[1], w[2]) + '"/>'
        + '</g>'
        + '</g>';
    }).join('');
  }

  var VEH_W = 6;      // across the vehicle
  var VEH_LEN = 13;   // trailer length

  /* A shipping container: ribbed sides, a door pair on the visible end, and a
     corner casting at each end, which is what separates it from a plain box. */
  function containerBody(ox, oy, kind, z0) {
    var base = z0 || 0;
    // Hollow trailer: the rear opening is real geometry, not a painted face.
    var specs = [[ox, oy, VEH_LEN, VEH_W, .2, kind, base],
      [ox, oy, .2, VEH_W, 5.2, kind, base],
      [ox, oy, VEH_LEN, .18, 5.2, kind, base],
      [ox, oy + VEH_W - .18, VEH_LEN, .18, 5.2, kind, base],
      [ox, oy, VEH_LEN, VEH_W, .18, kind, base + 5.02]];
    for (var i = 1; i < 9; i++) {
      specs.push([ox + i * 1.4, oy + VEH_W - .12, .32, .22, 4.9, 'rib', base + .15]);
    }
    // Full-height corrugated sides, roof rails, and the paired rear doors.
    specs.push([ox, oy + VEH_W - .14, VEH_LEN, .26, .42, 'rib', base + 4.75]);
    specs.push([ox, oy + VEH_W - .14, VEH_LEN, .26, .36, 'rib', base]);
    [0,1].forEach(function (side) {
      var hinge={x:ox+VEH_LEN,y:oy+side*VEH_W,sign:side ? 1 : -1};
      specs.push([ox+VEH_LEN-.12,oy+side*VEH_W/2,.22,VEH_W/2,4.8,'cont',base+.2,hinge]);
      specs.push([ox+VEH_LEN+.12,oy+side*VEH_W/2+1.3,.12,.12,4.4,'steel',base+.4,hinge]);
    });
    [ox, ox + VEH_LEN - .7].forEach(function (x) {
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base + 4.6]);
      specs.push([x, oy + VEH_W - .3, .7, .3, .6, 'tyre', base]);
    });
    return specs;
  }

  /* A tractor unit plus its trailer. */
  function truck(ox, oy) {
    var specs = [];
    // chassis rail
    specs.push([ox + 0.4, oy + 0.7, VEH_LEN - 0.8, VEH_W - 1.4, 0.7, 'tyre', 1.4]);
    // cab, set slightly narrower than the trailer
    specs.push([ox - 4.7, oy + 0.5, 4.3, VEH_W - 1, 4.7, 'cab', 2.1]);
    specs.push([ox - 4.8, oy + VEH_W - 0.6, 3.5, 0.3, 1.9, 'glass', 4.5]);
    specs.push([ox - 1.5, oy + 0.6, 0.4, VEH_W - 1.2, 2.2, 'tyre', 4.4]);   // exhaust stack
    // trailer
    return {
      specs: specs.concat(containerBody(ox, oy, 'cont', 2.1)),
      wheels: [2.4, 4.4, 10.6, -3.9].map(function (dx) {
        return [ox + dx + 0.85, oy + VEH_W - 0.12, 0.85, 0.85];
      })
    };
  }

  /* A stack of empty returnable crates, waiting to go back on the truck. */
  function emptyStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.1, 'empties', 0.3 + i * 1.15]);
    }
    return specs;
  }

  /* A pallet with cartons on it. */
  function palletStack(x, y, layers) {
    var specs = [[x - 0.1, y - 0.1, 2.8, 2.6, 0.3, 'rib', 0]];
    for (var i = 0; i < layers; i++) {
      specs.push([x, y, 2.6, 2.4, 1.5, 'load', 0.3 + i * 1.5]);
    }
    return specs;
  }

  /* Ribbed container docks bookend the two open rack banks. The front end
     stays open so the loading aisle and receiving shutter remain visible. */
  function freightContainer(x, kind, receiving) {
    var y = 1, w = 13, d = 26, h = 14;
    var specs = [
      [x, y, w, d, .6, kind, .7],
      [x, y, .65, d, h, kind, .7],
      [x + w - .65, y, .65, d, h, kind, .7],
      [x, y, w, .65, h, kind, .7],
      [x, y, w, d, .6, kind, h + .7]
    ];
    for (var rib = 1.5; rib < d; rib += 1.6) {
      specs.push([x + w - .4, y + rib, .6, .35, h, kind, .7]);
      specs.push([x, y + rib, w, .3, .3, kind, h + 1.3]);
    }
    var out = '<g class="iso-freight-container" data-container="' + (receiving ? 'receiving' : 'shipping') + '">'
      + paint(specs);
    if (receiving) { out += dockGate(x + .65, y + d); }
    else {
      out += box(x - 3.4, y + d - .2, 3.5, .5, h, kind, .7);
      out += box(x + w - .1, y + d - .2, 3.5, .5, h, kind, .7);
    }
    out += environment.dockDetails(x,receiving ? 'D01' : 'D02');
    return out + '</g>';
  }

  function dockGate(x, y) {
    var width=11.7,height=13.4,base=1.3;
    var opening = [p(x,y,height+base),p(x+width,y,height+base),p(x+width,y+.6,height+base),
      p(x+width,y+.6,base),p(x,y+.6,base),p(x,y+.6,height+base)];
    var slats = '';
    for (var z = base; z < height+base; z+=.8) {
      slats += 'M' + p(x, y + .61, z) + 'L' + p(x + width, y + .61, z);
    }

      + '<defs><clipPath id="dock-gate-opening" clipPathUnits="userSpaceOnUse">'
      + poly(opening, '') + '</clipPath></defs>'
      + '<g clip-path="url(#dock-gate-opening)"><g class="iso-dock-gate" id="dock-gate">'
      + box(x, y, width, .6, height, 'container-blue',base)
      + '<path class="iso-gate-slat" d="' + slats + '"/></g></g></g>';
  }


  /* Open orange shelves, with separate uprights and diagonal end bracing.
     Keeping the bays hollow makes them read as the reference's racks. */
  function rackBank(x) {
    var y = 3, w = 21, d = 14, h = 16;
    var rear = [], front = [], shelves = '',feet='';
    [0, w / 2, w].forEach(function (dx) {
      [y,y+d].forEach(function(py){
        var px=x+dx;
        feet+='<g class="iso-rack-foot">'
          + box(px-.4,py-.25,1.6,1.6,.16,'steel',FLOOR_Z)+'</g>';
      });
      rear.push([x + dx, y, .7, .7, h-.16, 'rack-post', FLOOR_Z+.16]);
      front.push([x + dx, y + d, .7, .7, h-.16, 'rack-post', FLOOR_Z+.16]);
    });
    [6.7, 10.5, 15.5].forEach(function (z, level) {
      shelves += '<g data-rack-level="' + ['lower','upper','top'][level] + '">';
      [0, w / 2].forEach(function (dx) {
        shelves += box(x + dx + .7, y + .7, w / 2 - .7, d - .7, .4, 'rack', z);
        shelves += box(x + dx, y + d, w / 2, .7, .85, 'rack', z - .4);
      });
      shelves += '</g>';
      shelves += environment.rackStock(x,level,z);
    });
    var braces = '';
    [x + w].forEach(function (cx) {
      [1.2, 6.2, 11.2].forEach(function (z) {
        braces += 'M' + p(cx + .8, y + .5, z) + 'L' + p(cx + .8, y + d, z + 4.1)
          + 'M' + p(cx + .8, y + d, z) + 'L' + p(cx + .8, y + .5, z + 4.1);
      });
    });
    return '<g class="iso-rack-bank">' + feet
      + paint(rear) + shelves + paint(front) + '<path class="iso-rack-brace" d="' + braces + '"/>'
      + environment.rackDetails(x,x===23 ? 'R01' : 'R02') + '</g>';
  }

  /* Stackable totes have an open rim and side ribs, unlike solid cartons. */
  function toteStack(x, y, layers, kind, w, d) {
    // Keep the deck at 1.35 while extending its plinth down to the slab.
    var out = box(x, y, w, d, 1.35-FLOOR_Z, 'rib', FLOOR_Z);
    for (var layer = 0; layer < layers; layer++) {
      var z = 1.35 + layer * 2.4;
      out += box(x, y, w, d, 1.9, kind, z);
      out += poly([p(x + .5, y + .5, z + 1.91), p(x + w - .5, y + .5, z + 1.91),
        p(x + w - .5, y + d - .5, z + 1.91), p(x + .5, y + d - .5, z + 1.91)], 'iso-tote-opening');
      out += paint([[x, y, w, .32, .4, kind, z + 1.9], [x, y + d - .32, w, .32, .4, kind, z + 1.9],
        [x, y, .32, d, .4, kind, z + 1.9], [x + w - .32, y, .32, d, .4, kind, z + 1.9]]);
      var ribs = '';
      for (var dx = 1; dx < w; dx += 1.5) {
        ribs += 'M' + p(x + dx, y + d + .01, z + .15) + 'L' + p(x + dx, y + d + .01, z + 1.7);
      }
      out += '<path class="iso-tote-rib" d="' + ribs + '"/>';
    }
    return out;
  }

  function goodsReceived() {
    var out = '<g data-layout-area="gr">';
    // Two blocks of stacked totes: pale on the left, dark on the right.
    [[12, 'tote-cream', 5], [26, 'tote-dark', 4]].forEach(function (stack) {
      [47, 53].forEach(function (y) {
        [0, 5].forEach(function (dx) { out += toteStack(stack[0] + dx, y, stack[2], stack[1], 4.6, 5.4); });
      });
    });
    return out + '</g>';
  }

  function returnables() {
    return '<g data-layout-area="returnables">'
      + toteStack(86, 48, 4, 'tote-green', 4.3, 5.2)
      + toteStack(91, 48, 4, 'tote-red', 4.3, 5.2)
      + toteStack(86, 54, 4, 'tote-yellow', 4.3, 5.2)
      + '</g>';
  }

  function table(x, y, w, d) {
    var specs = [[x, y, w, d, .55, 'table', 4.5]];
    [[x + .4, y + .4], [x + w - .9, y + .4], [x + .4, y + d - .9], [x + w - .9, y + d - .9]].forEach(function (leg) {
      specs.push([leg[0], leg[1], .5, .5, 3.8, 'steel', .7]);
    });
    return paint(specs);
  }

  function discZ(x, y, z, radius, cls) {
    var points = [];
    for (var i = 0; i < 48; i++) {
      var a = i * Math.PI / 24;
      points.push(p(x + radius * Math.cos(a), y + radius * Math.sin(a), z));
    }
    return poly(points, cls);
  }

  function turntableBody(x,y,radius) {
    var out='<g class="iso-wrapper-drum">';
    for(var i=0;i<48;i++) {
      var a=i*Math.PI/24,b=(i+1)*Math.PI/24,middle=(a+b)/2;
      if(Math.cos(middle)+Math.sin(middle)<=0) continue;

        chatterRemaining -= dt;
        if (chatterRemaining <= 0 || chatter.button.hidden) { clearChatter(); }
        else { positionPopover(chatter.group.querySelector('.iso-member-hit'), chatterBubble); }
        return;
      }
      nextChatter -= dt;
      if (nextChatter > 0) { return; }
      var candidates = people.map(function (person, index) { return {person:person,index:index}; }).filter(function (candidate) {
        var person = candidate.person;
        if (person.button.hidden || person.hover || person.focus) { return false; }
        var box = person.group.querySelector('.iso-member-hit').getBoundingClientRect();
        var at = document.elementFromPoint((box.left + box.right) / 2, (box.top + box.bottom) / 2);
        return !!at && person.group.contains(at);
      });
      if (!candidates.length) { nextChatter = 1500; return; }
      // Give each visible teammate a turn, with random ordering and timing.
      var earliest = Math.min.apply(null, candidates.map(function (c) { return spokenAt[c.index]; }));
      candidates = candidates.filter(function (c) { return spokenAt[c.index] === earliest; });
      var selected = candidates[Math.floor(Math.random() * candidates.length)];
      var index = selected.index;
      var choices = PHRASES.map(function (_, i) { return i; }).filter(function (i) { return i !== lastPhrase[index]; });
      var phrase = choices[Math.floor(Math.random() * choices.length)];
      lastPhrase[index] = phrase;
      spokenAt[index] = ++chatterTurns;
      chatter = selected.person;
      chatter.group.classList.add('is-speaking');
      chatterBubble.innerHTML = speechMarkup(index, PHRASES[phrase]);
      chatterBubble.hidden = false;
      chatterRemaining = 3200 + Math.random() * 800;
      nextChatter = 5000 + Math.random() * 5000;
      positionPopover(chatter.group.querySelector('.iso-member-hit'), chatterBubble);
    }

    function sayHello(group) {
      var index = Number(group.getAttribute('data-member'));
      if (!TEAM[index]) { return; }
      clearChatter();
      nextChatter = 10000 + Math.random() * 5000;
      closeGreeting();
      hideTip();
      var phrase = PHRASES[greetingCount[index]++ % PHRASES.length];
      greeting.innerHTML = speechMarkup(index, phrase);
      greeting.hidden = false;
      greeted = group;
      people.forEach(function (person) { person.button.classList.toggle('is-greeting',person.group === group); });
      void group.getBoundingClientRect();
      group.classList.add('is-greeting');
      group.dataset.greetingSerial=String(Number(group.dataset.greetingSerial || 0)+1);
      requestFrame();
      positionPopover(group.querySelector('.iso-member-body'), greeting);
      greetingTimer = setTimeout(closeGreeting, 3200);
    }

    mount.querySelectorAll('[data-member]').forEach(function (group) {
      group.addEventListener('click', function (event) { event.stopPropagation(); sayHello(group); });
      group.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          event.stopPropagation();
          sayHello(group);
        } else if (event.key === 'Escape') { closeGreeting(); }
      });
    });

    var camera = global.WarehouseCamera.create(mount, svg, {
      text: text,
      onMove: function () {
        hideTip(); closeGreeting(); clearChatter();
        nextChatter = 6000 + Math.random() * 4000;
        people.forEach(function (person) { person.placement = null; });
        requestFrame();
      }
    });

    function labelMembers() {
      mount.querySelectorAll('[data-member]').forEach(function (group) {
        group.setAttribute('aria-label', text('twin.greet', { name: TEAM[Number(group.getAttribute('data-member'))].name }));
      });
      people.forEach(function (person,index) { person.button.setAttribute('aria-label',text('twin.greet', {name:TEAM[index].name})); });
      camera.relabel();
    }
    labelMembers();

    // Keep the paths even without motion: their first point places each actor
    // on the floor. Omitting animateMotion left figures at the SVG origin.
    function syncMotion() {
      var paused = still || !active || document.hidden;
      mount.classList.toggle('is-still', Boolean(still));
      mount.classList.toggle('is-paused', Boolean(paused));
      if (paused) { svg.pauseAnimations(); }
      else { svg.unpauseAnimations(); }
      if (still) { svg.setCurrentTime(0); }
      if (paused) {
        clearChatter();
        cancelAnimationFrame(frameId); frameId = 0; previousFrame = 0;
      }
      if (active && !document.hidden) { requestFrame(); }
    }
    motionQuery.addEventListener('change', function (event) {
      still = event.matches;
      syncMotion();
    });
    document.addEventListener('visibilitychange', syncMotion);
    syncMotion();

    function showTip(group, app) {
      if (camera.isDragging()) { return; }
      if (!opts.describe) { return; }
      var info = opts.describe(app);
      if (!info) { return; }
      tip.className = 'twin__tip is-' + (NODES.map(function (n) { return n.app; }).indexOf(app) + 1)
        + (info.done ? ' is-done' : '');
      tip.innerHTML =
        '<span class="twin__tip-step">' + escapeHtml(info.step) + '</span>'
        + '<strong class="twin__tip-name">' + escapeHtml(info.name) + '</strong>'
        + '<span class="twin__tip-role">' + escapeHtml(info.role) + '</span>'
        + '<span class="twin__tip-go">' + escapeHtml(info.action) + '</span>';
      tip.hidden = false;
      tipGroup = group;
      positionTip(group);
    }

    function positionTip(group) {
      positionPopover(group.querySelector('.iso-node-dot'), tip);
    }

    function positionPopover(anchor, popover) {
      var box = anchor.getBoundingClientRect();
      var base = mount.getBoundingClientRect();
      var size = popover.getBoundingClientRect();
      var visible = view ? view.getBoundingClientRect() : { top: 0, bottom: global.innerHeight };
      var minTop = Math.max(12, visible.top - base.top + 12);
      var maxBottom = Math.min(base.height - 12, visible.bottom - base.top - 12);
      var center = box.left + box.width / 2 - base.left;
      var left = Math.max(12, Math.min(center - size.width / 2, base.width - size.width - 12));
      var top = box.top - base.top - size.height - 22;
      var below = top < minTop;
      if (below) { top = box.bottom - base.top + 22; }
      top = Math.max(minTop, Math.min(top, maxBottom - size.height));
      popover.classList.toggle('is-below', below);
      popover.style.left = left + 'px';
      popover.style.top = top + 'px';
      popover.style.setProperty('--tip-arrow', Math.max(16, Math.min(center - left, size.width - 16)) + 'px');
    }

    function hideTip() { tip.hidden = true; tipGroup = null; }

    if (view) {
      view.addEventListener('scroll', function () {
        if (tipGroup) { positionTip(tipGroup); }
      }, { passive: true });
    }

    // Floor targets sit below the equipment, so a tall rack or tote always
    // opens its own station instead of the floor projected behind it.
    mount.querySelectorAll('[data-area-app], [data-layout-area]').forEach(function (area) {
      var app = area.getAttribute('data-area-app') || area.getAttribute('data-layout-area');
      var marker = mount.querySelector('[data-node-app="' + app + '"]');
      if (!marker) { return; }
      area.addEventListener('pointerenter', function () { showTip(marker, app); });
      area.addEventListener('pointerleave', hideTip);
      area.addEventListener('click', function () {
        hideTip();
        if (opts.onNodeClick) { opts.onNodeClick(app); }
      });
    });

    mount.querySelectorAll('[data-node-app]').forEach(function (group) {
      var app = group.getAttribute('data-node-app');
      group.addEventListener('pointerenter', function () { showTip(group, app); });
      group.addEventListener('pointerleave', hideTip);
      group.addEventListener('focus', function () { showTip(group, app); });
      group.addEventListener('blur', hideTip);
      if (opts.onNodeClick) {
        group.addEventListener('click', function () { hideTip(); opts.onNodeClick(app); });
        group.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            hideTip();
            opts.onNodeClick(app);
          }
        });
      }
    });

    window.addEventListener('resize', hideTip);

    return {
      /* Light the aisle up to the last finished node. */
      setActive: function (value) {
        active = value;
        if (!active) { closeGreeting(); hideTip(); camera.cancelDrag(); }
        syncMotion();
      },
      setProgress: function (doneApps) {
        mount.querySelectorAll('[data-node-app]').forEach(function (group) {
          group.classList.toggle('is-done', doneApps.indexOf(group.getAttribute('data-node-app')) !== -1);
        });
        var reached = 0;
        NODES.forEach(function (node, i) {
          if (doneApps.indexOf(node.app) !== -1) { reached = Math.max(reached, i + 1); }
        });
        var done = document.getElementById('twin-route-done');
        if (done) {
          var fraction = [0, 0.30, 0.63, 1][reached];
          done.style.strokeDasharray = '1000';
          done.style.strokeDashoffset = String(1000 - 1000 * fraction);
        }
      },
      hideTip: hideTip,
      members: function () { return TEAM.map(function (m) { return m.name; }); },

      /* The shipping lane runs continuously. Finishing the last station jumps
         the cycle to the moment the loaded truck pulls out, so the departure
         reads as a consequence of the pallet rather than a coincidence. */
      departTruck: function () {
        ['shipping'].forEach(function (id) {
          var node = document.getElementById(id);
          if (!node) { return; }
          node.style.animation = 'none';
          void node.getBoundingClientRect();
          node.style.animation = '';
          node.style.animationDelay = DEPART_AT;
        });
      },
      relabel: function (newLabels) {
        closeGreeting();
        labelMembers();
        mount.querySelector('[data-area-label="returnables"]').textContent = text('twin.returnables');
        mount.querySelector('.iso-building-sign').textContent = text('brand.name');
        NODES.forEach(function (node) {
          var group = mount.querySelector('[data-node-app="' + node.app + '"]');
          if (group) { group.setAttribute('aria-label', node.num + '. ' + newLabels[node.app]); }
        });
      }
    };
  }

  global.Twin = { create: create };
})(window);

</script>
<script>
/* js/router.js */
/* Full screen views with a forklift transition between them.
   Only one view is in the document flow at a time, so nothing scrolls to reach
   another station. The truck drives across pushing a curtain; the view is
   swapped behind the curtain at the halfway point, so the change is never
   seen. */

(function (global) {
  'use strict';

  var TRANSITION_MS = 1700;
  var SWAP_AT = 780;

  var current = 'home';
  var busy = false;
  var listeners = [];

  function views() {
    return Array.prototype.slice.call(document.querySelectorAll('.view'));
  }

  function apply(id) {
    views().forEach(function (view) {
      var active = view.id === 'view-' + id;
      view.classList.toggle('is-active', active);
      view.hidden = !active;
    });
    document.body.setAttribute('data-view', id);
    document.querySelectorAll('.topbar__nav [data-goto]').forEach(function (link) {
      if (link.getAttribute('data-goto') === id) { link.setAttribute('aria-current', 'page'); }
      else { link.removeAttribute('aria-current'); }
    });
    current = id;
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
    var heading = document.querySelector('#view-' + id + ' [data-view-heading]');
    if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
    listeners.forEach(function (fn) { fn(id); });
  }

  function go(id, options) {
    var opts = options || {};
    if (busy || id === current) { return; }
    if (!document.getElementById('view-' + id)) { return; }
    if(global.WarehouseHandoff && global.WarehouseHandoff.isActive()) global.WarehouseHandoff.cancel();

    if (opts.instant || global.Forklift.prefersReducedMotion()) {
      apply(id);
      return;
    }

    busy = true;
    var layer = document.getElementById('transition');
    layer.innerHTML =
      '<div class="transition__curtain"></div>'
      + '<div class="transition__truck">' + global.TransitionForklift.markup() + '</div>';
    layer.hidden = false;
    void layer.offsetWidth;
    layer.classList.add('is-running');

    setTimeout(function () { apply(id); }, SWAP_AT);
    setTimeout(function () {
      layer.classList.remove('is-running');
      layer.hidden = true;
      layer.innerHTML = '';
      busy = false;
    }, TRANSITION_MS);
  }

  function init() {
    document.addEventListener('click', function (event) {
      var link = event.target.closest('[data-goto]');
      if (!link) { return; }
      event.preventDefault();
      go(link.getAttribute('data-goto'));
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && current !== 'home') {
        var overlay = document.getElementById('finale');
        if (overlay && !overlay.hidden) { return; }
        go('home');
      }
    });

    apply('home');
  }

  global.Router = {
    init: init,
    go: go,
    current: function () { return current; },
    onChange: function (fn) { listeners.push(fn); }
  };
})(window);

</script>
<script>
/* js/challenge.js */
/* The manual challenge, web version. Match cartons to docket lines by hand,
   against a clock, with two discrepancies planted. */

(function (global) {
  'use strict';

  var t = function (key, vars) { return global.I18N.t(key, vars); };

  var LINES = [
    { id: 'L1', item: 'SE-A4021-88', qty: 24 },
    { id: 'L2', item: 'SE-B1190-04', qty: 12 },
    { id: 'L3', item: 'SE-C7745-20', qty: 30 },
    { id: 'L4', item: 'SE-D3308-11', qty: 6 }
  ];

  // Two of these do not agree with the docket: BX-00004 is short by two units
  // and BX-00002 carries a transposed item code.
  var CARTONS = [
    { code: 'BX-00003', item: 'SE-C7745-20', qty: 30, line: 'L3', bad: false },
    { code: 'BX-00002', item: 'SE-B1190-40', qty: 12, line: 'L2', bad: true },
    { code: 'BX-00004', item: 'SE-D3308-11', qty: 4, line: 'L4', bad: true },
    { code: 'BX-00001', item: 'SE-A4021-88', qty: 24, line: 'L1', bad: false }
  ];

  function esc(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function clock(ms) {
    var total = Math.round(ms / 1000);
    var mins = Math.floor(total / 60);
    var secs = total % 60;
    return mins + ':' + (secs < 10 ? '0' : '') + secs;
  }

  function create(mount) {
    var s = {
      phase: 'idle',
      startedAt: 0,
      elapsed: 0,
      picked: null,
      flagMode: false,
      assigned: {},
      message: null
    };
    var ticker = null;
    var active=false,lastTick=0;
    function focus(selector) { var node=mount.querySelector(selector);if(node)node.focus({preventScroll:true}); }
    function syncClock() {
      clearInterval(ticker);ticker=null;lastTick=Date.now();
      if(active && !document.hidden && s.phase==='play') ticker=setInterval(tick,250);
    }
    document.addEventListener('visibilitychange',syncClock);

    function assignedCount() { return Object.keys(s.assigned).length; }

    function missedCount() {
      return CARTONS.filter(function (carton) {
        var record = s.assigned[carton.code];
        return carton.bad && (!record || !record.flagged);
      }).length;
    }

    function render() {
      if (s.phase === 'idle') {
        mount.innerHTML =
          '<div class="ch ch--idle">'
          + '<button class="btn btn-primary" type="button" data-act="start">' + esc(t('challenge.start')) + '</button>'
          + '</div>';
        return;
      }

      if (s.phase === 'done') {
        var missed = missedCount();
        var score=CARTONS.filter(function(c){return s.assigned[c.code].flagged===c.bad;}).length;
        var review=CARTONS.map(function(c){
          var correct=s.assigned[c.code].flagged===c.bad;
          return '<li class="'+(correct?'is-good':'')+'"><strong>'+esc(c.code)+' · '+esc(correct?t('challenge.correct'):t('challenge.flag'))+'</strong>'
            +esc(t(c.code==='BX-00002'?'challenge.error.item':c.code==='BX-00004'?'challenge.error.qty':'challenge.error.clear'))+'</li>';
        }).join('');
        mount.innerHTML =
          '<div class="ch ch--result">'
          + '<h3>' + esc(t('challenge.done.title')) + '</h3>'
          + '<p class="ch__verdict">' + esc(t('challenge.done.time', { time: clock(s.elapsed) })) + '</p>'
          + '<p class="ch__verdict ' + (missed ? 'is-bad' : 'is-good') + '">'
          +   esc(missed ? t('challenge.done.missed', { n: missed }) : t('challenge.done.caught'))
          + '</p>'
          + '<p><strong>' + esc(t('challenge.score',{n:score})) + '</strong></p><ul class="ch__review">'+review+'</ul>'
          + '<p>' + esc(t('challenge.done.note')) + '</p>'
          + '<button class="btn btn-primary" type="button" data-goto="gr">'+esc(t('gr.name'))+'</button> '
          + '<button class="btn btn-ghost" type="button" data-act="reset">' + esc(t('challenge.reset')) + '</button>'
          + '</div>';
        return;
      }

      var boxes = CARTONS.map(function (carton) {
        var record = s.assigned[carton.code];
        var cls = 'ch-box';
        if (record) { cls += record.flagged ? ' is-flagged' : ' is-matched'; }
        if (s.picked === carton.code) { cls += ' is-picked'; }
        return '<button class="' + cls + '" type="button" data-carton="' + carton.code + '"' + (record ? ' disabled' : '') + '>'
          + '<span class="ch-box__code mono">' + esc(carton.code) + '</span>'
          + '<span class="ch-box__item mono">' + esc(carton.item) + '</span>'
          + '<span class="ch-box__qty mono">' + carton.qty + '</span>'
          + '</button>';
      }).join('');

      var rows = LINES.map(function (line) {
        var taken = Object.keys(s.assigned).some(function (code) { return s.assigned[code].line === line.id; });
        return '<button class="ch-line' + (taken ? ' is-taken' : '') + '" type="button" data-line="' + line.id + '"'
          + (taken || !s.picked ? ' disabled' : '') + '>'
          + '<span class="mono">' + esc(line.id) + '</span>'
          + '<span class="mono">' + esc(line.item) + '</span>'
          + '<span class="mono">' + line.qty + '</span>'
          + '</button>';
      }).join('');

      mount.innerHTML =
        '<div class="ch">'
        + '<div class="ch__bar">'
        +   '<span class="ch__time mono" data-time>' + esc(t('challenge.time')) + ' ' + clock(s.elapsed) + '</span>'
        +   '<button class="btn-flag' + (s.flagMode ? ' is-on' : '') + '" type="button" data-act="flag" aria-pressed="'+s.flagMode+'">'
        +     esc(t(s.flagMode ? 'challenge.flagged' : 'challenge.flag')) + '</button>'
        + '</div>'
        + '<p class="ch__hint" role="status">' + esc(s.message || t('challenge.pick')) + '</p>'
        + '<div class="ch__grid">'
        +   '<div><p class="ch__cap">' + esc(t('challenge.boxes')) + '</p><div class="ch__boxes">' + boxes + '</div></div>'
        +   '<div><p class="ch__cap">' + esc(t('challenge.paper')) + '</p><div class="ch__paper">' + rows + '</div></div>'
        + '</div>'
        + '</div>';
    }

    function tick() {
      var now=Date.now();
      if(active && !document.hidden && s.phase==='play') s.elapsed+=now-lastTick;
      lastTick=now;
      var node = mount.querySelector('[data-time]');
      if (node) { node.textContent = t('challenge.time') + ' ' + clock(s.elapsed); }
    }

    function start() {
      s.phase = 'play';
      s.startedAt = Date.now();
      s.elapsed = 0;
      s.assigned = {};
      s.picked = null;
      s.flagMode = false;
      s.message = null;
      render();
      syncClock();focus('[data-carton]:not(:disabled)');
    }

    function stop() {
      clearInterval(ticker);
      ticker = null;
      tick();
      s.phase = 'done';
      render();
      mount.querySelector('h3').tabIndex=-1;focus('h3');
    }

    mount.addEventListener('click', function (event) {
      var act = event.target.closest('[data-act]');
      if (act) {
        var name = act.getAttribute('data-act');
        if (name === 'start') { start(); return; }
        if (name === 'reset') { s.phase = 'idle'; syncClock();render();focus('[data-act=start]');return; }
        if (name === 'flag') { s.flagMode = !s.flagMode; render();focus('[data-act=flag]');return; }
      }

      var box = event.target.closest('[data-carton]');
      if (box && !box.disabled) {
        s.picked = box.getAttribute('data-carton');
        s.message = t('challenge.picked', { code: s.picked });
        render();
        focus('[data-act=flag]');
        return;
      }

      var line = event.target.closest('[data-line]');
      if (line && !line.disabled && s.picked) {
        if(CARTONS.find(function(c){return c.code===s.picked;}).line!==line.dataset.line) {
          s.message=t('challenge.wrongLine');render();focus('[data-line="'+line.dataset.line+'"]');return;
        }
        s.assigned[s.picked] = { line: line.getAttribute('data-line'), flagged: s.flagMode };
        s.message = t('challenge.matched', { code: s.picked });
        s.picked = null;
        s.flagMode=false;
        if (assignedCount() === CARTONS.length) { stop(); return; }
        render();
        focus('[data-carton]:not(:disabled)');
      }
    });

    return {
      render: render,
      setActive:function(value){tick();active=value;syncClock();},
      reset: function () { clearInterval(ticker); s.phase = 'idle'; render(); }
    };
  }

  global.Challenge = { create: create };
})(window);

</script>
<script>
/* js/demos.js */
/* The three app simulations.
   Goods Received and Pallet Interlocking follow the real systems described in
   the two architecture maps: an inbound supplier receipt posted to SAP, and an
   outbound pallet verified two labels per carton against its packing list.
   PutAway is illustrative and marked as such, since no specification exists. */

(function (global) {
  'use strict';

  var t = function (key, vars) { return global.I18N.t(key, vars); };

  function esc(value) {
    return String(value).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function barcodeBars(seed, count) {
    var out = '';
    var value = seed;
    for (var i = 0; i < count; i++) {
      value = (value * 1103515245 + 12345) % 2147483648;
      out += '<i style="width:' + (1 + (value % 3)) + 'px"></i>';
    }
    return out;
  }

  function scanner(code, flashing, idleKey) {
    return '<div class="scanner' + (flashing ? ' is-scanning' : '') + '">'
      + (code
        ? '<div class="scanner__bars">' + barcodeBars(code.length + 7, 26) + '</div>'
          + '<span class="scanner__code' + (flashing ? ' is-in' : '') + '">' + esc(code) + '</span>'
        : '<span class="scanner__idle">' + esc(t(idleKey)) + '</span>')
      + '</div>';
  }

  function field(labelKey, value, emptyKey) {
    var set = value !== null && value !== undefined && value !== '';
    return '<div class="field"><span class="field__label">' + esc(t(labelKey)) + '</span>'
      + '<span class="field__value ' + (set ? 'is-set' : 'is-empty') + '">'
      + esc(set ? value : t(emptyKey)) + '</span></div>';
  }

  /* ---------------------------------------------------------- Goods Received */

  var GR_LINES = [
    { material: 'C2030-WE', po: '4500912 / 10', spq: 24, boxes: 2 },
    { material: 'A9F5-BL', po: '4500912 / 20', spq: 24, boxes: 1 }
  ];
  /* What the supplier takes back on the same truck. Types are the real
     returnable codes from the box master. */
  var GR_EMPTIES = [
    { code: 'S00', qty: 12 },
    { code: 'K03', qty: 8 },
    { code: 'WPALLET', qty: 2 }
  ];
  var GR_SIGNS = ['receiver', 'guard', 'leader'];

  var GR_BOXES = [
    { sscc: '589352611036539718', line: 0 },
    { sscc: '589352611036539725', line: 0 },
    { sscc: '589352611036539732', line: 1 }
  ];

  function GoodsReceived(mount, onComplete) {
    var s;

    function reset() {
      s = { step: 1, session: null, docket: null, scanned: [], last: null, note: null, flash: false,
            empties: [], noteRef: null, signed: [] };
    }
    reset();

    function receivedOn(index) {
      return s.scanned.filter(function (b) { return b.line === index; }).length;
    }

    function render() {
      var steps = [1, 2, 3, 4, 5].map(function (n) {
        var cls = 'scr__step' + (n === s.step ? ' is-active' : '') + (n < s.step ? ' is-done' : '');
        return '<span class="' + cls + '">' + esc(t('gr.step.' + n)) + '</span>';
      }).join('');

      var lines = s.step === 5 ? s.empties.map(function (e) {
        return '<div class="line">'
          + '<span class="line__code">' + esc(e.code) + '</span>'
          + '<span class="line__qty">' + esc(t('gr.col.boxtype')) + '</span>'
          + '<span class="line__state">' + e.qty + '</span>'
          + '</div>';
      }).join('') : s.docket ? GR_LINES.map(function (line, index) {
        var got = receivedOn(index) * line.spq;
        var want = line.boxes * line.spq;
        return '<div class="line">'
          + '<span class="line__code">' + esc(line.material) + '</span>'
          + '<span class="line__qty">' + esc(line.po) + '</span>'
          + '<span class="line__state' + (got >= want ? '' : ' is-part') + '">' + got + ' / ' + want + '</span>'
          + '</div>';
      }).join('') : '';

      var actions = '';
      if (s.step === 1) {
        actions = '<button class="btn-screen" type="button" data-act="open">' + esc(t('gr.btn.open')) + '</button>';
      } else if (s.step === 2) {
        actions = '<button class="btn-screen" type="button" data-act="docket">' + esc(t('gr.btn.scanDo')) + '</button>';
      } else if (s.step === 3) {

      } else if (!s.noteRef) {

              + '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
              + (done

        + '<div class="scr__steps">' + steps + '</div>'

        s.step = 5;

  /* ------------------------------------------------------ Pallet Interlocking */

    { box: '589352611036539732', ean: '19311554004535', product: 'A9F5-BL' }
  ];
  var WRONG_EAN = '19311554009999';

  function Interlocking(mount, onComplete) {
    var s;

    function reset() {
      s = { pallet: null, done: [], pending: null, last: null, status: null, flash: false, green: false };
    }
    reset();

    function isDone(box) { return s.done.indexOf(box) !== -1; }

        '<div class="scr">'

        +     '<span class="field__value">' + s.done.length + ' / ' + PACKING_LIST.length + '</span></div>'

        + '</div>'
        + '<div class="scr__foot"><p class="scr__hint">' + esc(t('il.hint.' + step)) + '</p>' + actions + '</div>'
        + '</div>';

      s.flash = false;
    }

    mount.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-act]');
      if (!btn) { return; }

      if (act === 'pallet') {
        s.pallet = PALLET_HU;
        s.last = PALLET_HU;
        s.flash = true;
        s.status = null;
      } else if (act === 'hu2') {
        var item = nextBox();
        if (!item) { return; }
        s.pending = item.box;
        s.last = item.box;
        s.flash = true;
        s.status = { text: t('il.st.await'), bad: false };
      } else if (act === 'ean') {
        var match = PACKING_LIST.filter(function (x) { return x.box === s.pending; })[0];
        s.done.push(match.box);
        s.pending = null;
        s.last = match.ean;
        s.flash = true;
        s.status = { text: t('il.st.200'), bad: false };
      } else if (act === 'wrong') {
        s.last = WRONG_EAN;
        s.flash = true;
        s.status = { text: t('il.st.401'), bad: true };
      } else if (act === 'green') {
        if (s.done.length < PACKING_LIST.length) {
          s.status = { text: t('il.green.blocked'), bad: true };
          render();
          return;
        }
        s.green = true;
        onComplete();
        return;
      }
      render();
    });

    return { render: render, reset: function () { reset(); render(); } };
  }

  /* ------------------------------------------------------------------ PutAway */

  var OCCUPIED = ['A-01-01', 'A-02-01', 'A-05-01', 'A-01-03', 'A-04-03'];
  var SUGGESTED = 'A-03-02';

  function PutAway(mount, onComplete) {
    var s = { pallet: null, selected: null, justPlaced: false, flash: false };

    function render() {
      var bins = '';
      for (var level = 3; level >= 1; level--) {
        for (var bay = 1; bay <= 5; bay++) {
          var code = 'A-0' + bay + '-0' + level;
          var occupied = OCCUPIED.indexOf(code) !== -1;
          var cls = 'bin';
          if (occupied) { cls += ' is-occupied'; }
          if (!occupied && s.pallet && code === SUGGESTED && s.selected !== code) { cls += ' is-suggested'; }
          if (s.selected === code) { cls += ' is-selected'; }
          bins += '<button class="' + cls + '" type="button" data-bin="' + code + '"'
            + (occupied || !s.pallet ? ' disabled' : '') + '>' + code
            + (s.selected === code ? '<span class="bin__pallet' + (s.justPlaced ? ' is-in' : '') + '"></span>' : '')
            + '</button>';
        }
      }

      var hint = !s.pallet ? 'pa.hint.1' : (s.selected ? 'pa.hint.3' : 'pa.hint.2');
      var action = !s.pallet
        ? '<button class="btn-screen" type="button" data-act="scan">' + esc(t('pa.btn.scan')) + '</button>'
        : '<button class="btn-screen" type="button" data-act="confirm"' + (s.selected ? '' : ' disabled') + '>'
          + esc(t('pa.btn.confirm')) + '</button>';

      mount.innerHTML =
        '<div class="scr">'
        + '<div class="scr__body">'
        +   field('pa.f.pallet', s.pallet, 'pa.empty')
        +   field('pa.f.bin', s.selected, 'pa.empty')
        +   scanner(s.pallet, s.flash, 'gr.scan.idle')
        +   '<div class="rack">' + bins + '</div>'
        +   '<div class="rack__legend">'
        +     '<span><i></i>' + esc(t('pa.legend.free')) + '</span>'
        +     '<span class="k-suggest"><i></i>' + esc(t('pa.legend.suggested')) + '</span>'
        +     '<span><i class="k-taken"></i>' + esc(t('pa.legend.taken')) + '</span>'
        +   '</div>'
        + '</div>'
        + '<div class="scr__foot"><p class="scr__hint">' + esc(t(hint)) + '</p>' + action + '</div>'
        + '</div>';

      s.flash = false;
      s.justPlaced = false;
    }

    mount.addEventListener('click', function (event) {
      var bin = event.target.closest('[data-bin]');
      if (bin && !bin.disabled) {
        s.selected = bin.getAttribute('data-bin');
        s.justPlaced = true;
        render();
        return;
      }
      var btn = event.target.closest('[data-act]');
      if (!btn || btn.disabled) { return; }
      if (btn.getAttribute('data-act') === 'scan') {
        s.pallet = 'PL-004182';
        s.flash = true;
        render();
      } else if (btn.getAttribute('data-act') === 'confirm') {
        onComplete(s.selected);
      }
    });

    return {
      render: render,
      reset: function () {
        s = { pallet: null, selected: null, justPlaced: false, flash: false };
        render();
      }
    };
  }

  global.Demos = {
    create: function (app, mount, onComplete) {
      if (app === 'gr') { return GoodsReceived(mount, onComplete); }
      if (app === 'interlock') { return Interlocking(mount, onComplete); }
      if (app === 'putaway') { return PutAway(mount, onComplete); }
      return null;
    },
    suggestedBin: SUGGESTED
  };
})(window);
